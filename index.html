    <!-- 2. Full-Screen Free Meadow Playground (Classic Mode) -->
    <div class="classic-field" id="classicField" title="点草地任意地方下蛋！"></div>

    <!-- 3. Minimal Floating Corner HUD -->
    <header class="hud-top">
      <div class="hud-left">
        <div class="pill-glass sticker-tray" id="stickerTray" title="集齐5颗星星开小鸡派对！">
          <span class="sticker-slot empty">⭐</span>
          <span class="sticker-slot empty">⭐</span>
          <span class="sticker-slot empty">⭐</span>
          <span class="sticker-slot empty">⭐</span>
          <span class="sticker-slot empty">⭐</span>
        </div>
        <div class="pill-glass classic-mini-counts" id="classicMiniCounts" title="草地上的蛋和小鸡">
          <span id="classicEggCount">🥚 0</span>
          <span id="classicChickCount">🐣 0</span>
        </div>
      </div>

      <div class="prompt-wrap">
        <div class="prompt-bubble" id="promptBubble" role="button" tabindex="0" title="点一点再听一遍">
          <div class="prompt-speak-icon">🔊</div>
          <div class="prompt-text" id="promptText">点草地任意地方，快乐小鸡就跑过去下蛋哦！</div>
        </div>
      </div>

      <div class="hud-right">
        <button class="pill-glass timer-badge hidden" id="timerBadgeBtn" type="button" title="护眼倒计时">🌙 5:00</button>
        <button class="pill-glass icon-circle-btn wardrobe-hud-btn" id="wardrobeBtn" type="button" title="小鸡换装间与稀有图鉴">👗<span class="wardrobe-dot hidden" id="wardrobeDot"></span></button>
        <button class="pill-glass icon-circle-btn" id="soundToggleBtn" type="button" title="声音开关">🔊</button>
        <button class="pill-glass icon-circle-btn" id="parentMenuBtn" type="button" title="家长设置（语言与护眼定时）">⚙️</button>
      </div>
    </header>

    <!-- 4. Classic Corner Action Buttons (Toy Hammer & Tidy) -->
    <div class="classic-fabs" id="classicFabs">
      <button class="fab-btn fab-amber" id="hammerFab" type="button" title="玩具小锤子：拖到或点击砸开彩虹金蛋">🔨</button>
      <button class="fab-btn fab-mint" id="clearMeadowBtn" type="button" title="收好重玩">🧺</button>
    </div>

    <!-- 5. Quiz Stage (Only visible in Colors / Counting / Shapes) -->
    <main class="stage empty" id="gameStage"></main>

    <!-- 6. Dedicated Sub-Mode Capsule Dock (Colors / Shapes / Math sub-modes) -->
    <div class="submode-dock hidden" id="subModeDock" role="tablist" aria-label="子玩法切换"></div>

    <!-- 7. Responsive Floating Mode Dock (Bottom in Portrait / Left Rail in Landscape) -->
    <nav class="mode-dock" id="modeDock" aria-label="游戏模式">
      <button class="mode-tab active" data-mode="classic" type="button">
        <span class="mode-icon">🥚</span>
        <span class="mode-title">下蛋</span>
      </button>
      <button class="mode-tab" data-mode="colors" type="button">
        <span class="mode-icon">🎨</span>
        <span class="mode-title">颜色</span>
      </button>
      <button class="mode-tab" data-mode="counting" type="button">
        <span class="mode-icon">🌽</span>
        <span class="mode-title">数学</span>
      </button>
      <button class="mode-tab" data-mode="shapes" type="button">
        <span class="mode-icon">🧩</span>
        <span class="mode-title">形状</span>
      </button>
      <button class="mode-tab" data-mode="play" type="button">
        <span class="mode-icon">🎵</span>
        <span class="mode-title">乐园</span>
      </button>
    </nav>
  </div>

  <!-- Confetti & Floating Praise Layer -->
  <div class="fx-layer" id="fxLayer"></div>

  <!-- Dress-Up Wardrobe & Rare Chick Album Modal -->
  <div class="modal-backdrop" id="wardrobeModal" aria-hidden="true">
    <div class="wardrobe-card" role="dialog" aria-modal="true" aria-label="小鸡换装间与神奇小鸡图鉴">
      <div class="wardrobe-header">
        <div class="wardrobe-title-group">
          <h3 class="wardrobe-title">👗 装扮与图鉴</h3>
          <span class="wardrobe-star-pill" id="totalStarsBadge">⭐ 0</span>
        </div>
        <button class="ctrl-btn wardrobe-close-btn" id="wardrobeCloseBtn" type="button">✕ 关闭</button>
      </div>
      <div class="wardrobe-tabs" id="wardrobeTabs" role="tablist"></div>
      <div class="wardrobe-body" id="wardrobeBody"></div>
    </div>
  </div>

  <!-- Consolidated Parent Menu (Settings + Parent Real Voice Recording Pack + Learning Insights) -->
  <div class="modal-backdrop" id="parentModal" aria-hidden="true">
    <div class="parent-card" role="dialog" aria-modal="true" aria-label="家长小助手">
      <div class="parent-header">
        <h3 class="parent-title">⚙️ 家长小助手</h3>
        <button class="ctrl-btn parent-close-btn" id="parentCloseBtn" type="button">✕ 关闭</button>
      </div>

      <div class="parent-tabs" id="parentTabs" role="tablist" aria-label="家长小助手功能切换">
        <button class="parent-tab-btn active" data-tab="settings" type="button" role="tab" aria-selected="true">⚙️ 设置</button>
        <button class="parent-tab-btn" data-tab="voices" type="button" role="tab" aria-selected="false">🎙️ 配音 <span class="parent-tab-count" id="voiceCountBadge">0/4</span></button>
        <button class="parent-tab-btn" data-tab="insights" type="button" role="tab" aria-selected="false">📊 成长</button>
      </div>

      <div class="parent-body" id="parentBody">
        <!-- Tab 1: Basic Settings (Nickname + Language + Eye-Care Timer) -->
        <div class="parent-panel" id="parentPanelSettings" data-panel="settings" role="tabpanel">
          <div class="parent-section">
            <div class="parent-section-title">🏷️ 宝贝专属小名</div>
            <p class="parent-section-desc">
              设好小名后，小鸡的答对夸奖、五颗星派对和护眼晚安都会亲切呼唤宝贝哦！
            </p>
            <div class="nickname-row">
              <input
                type="text"
                id="nicknameInput"
                class="nickname-input"
                maxlength="12"
                autocomplete="off"
                placeholder="如：乐乐、朵朵、姐妹俩"
                aria-label="宝贝专属小名"
              />
              <button class="ctrl-btn active nickname-save-btn" id="nicknameSaveBtn" type="button">保存</button>
              <button class="ctrl-btn nickname-test-btn" id="nicknameTestBtn" type="button">🔊 试听</button>
            </div>
            <div class="nickname-chips" id="nicknameChips">
              <button class="nick-chip" data-nick="宝贝" type="button">宝贝</button>
              <button class="nick-chip" data-nick="乐乐" type="button">乐乐</button>
              <button class="nick-chip" data-nick="朵朵" type="button">朵朵</button>
              <button class="nick-chip" data-nick="姐姐妹妹" type="button">姐姐妹妹</button>
            </div>
            <div class="nickname-feedback hidden" id="nicknameFeedback" aria-live="polite"></div>
          </div>

          <div class="parent-section parent-section-divider">
            <div class="parent-section-title">🌐 语音启蒙语言</div>
            <div class="seg-grid-3" id="langChoices">
              <button class="ctrl-btn active" data-lang="zh" type="button">中文</button>
              <button class="ctrl-btn" data-lang="bi" type="button">中+英双语</button>
              <button class="ctrl-btn" data-lang="en" type="button">English</button>
            </div>
          </div>

          <div class="parent-section parent-section-divider">
            <div class="parent-section-title">🌙 护眼晚安定时</div>
            <p class="parent-section-desc">
              到时间后，快乐小鸡会戴上睡帽打哈欠说晚安，帮助宝宝愉快放下屏幕。
            </p>
            <div id="timerStatusLine" class="timer-status-line">
              当前状态：未开启定时
            </div>
            <div class="timer-grid">
              <button class="ctrl-btn" data-mins="5" type="button">⏱️ 玩 5 分钟</button>
              <button class="ctrl-btn" data-mins="10" type="button">⏱️ 玩 10 分钟</button>
              <button class="ctrl-btn" data-mins="15" type="button">⏱️ 玩 15 分钟</button>
              <button class="ctrl-btn" data-mins="0" type="button">🔓 取消定时</button>
            </div>
            <button class="ctrl-btn active" id="previewSleepBtn" type="button" style="width:100%;margin-top:2px;">
              ✨ 立即体验「鸡妈妈晚安画面」
            </button>
          </div>
        </div>

        <!-- Tab 2: Parent Real Voice Recording Pack -->
        <div class="parent-panel hidden" id="parentPanelVoices" data-panel="voices" role="tabpanel">
          <div class="voice-support-banner" id="voiceSupportBanner" aria-live="polite"></div>
          <div class="voice-slots-list" id="voiceSlotsList"></div>
        </div>

        <!-- Tab 3: Local Learning Insights -->
        <div class="parent-panel hidden" id="parentTabInsights" data-panel="insights" role="tabpanel">
          <div class="insights-content" id="insightsContent"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Goodnight Eye-Care Screen -->
  <div class="sleep-overlay" id="sleepOverlay">
    <div style="font-size:40px;">🌙 ✨ ⭐</div>
    <div class="zzz">Zzz...</div>
    <div id="sleepingChickenSlot"></div>
    <h2 style="margin:0;font-size:24px;font-weight:900;color:#FFE875;">快乐小鸡困啦，要睡觉咯～</h2>
    <p id="sleepGreetingText" style="margin:0;max-width:340px;font-size:15px;line-height:1.6;color:#E8EEFF;">
      宝贝今天玩得真棒！我们让眼睛和小鸡一起休息一下吧，晚安哟！
    </p>
    <button class="hold-unlock-btn" id="unlockSleepBtn" type="button">家长长按 2 秒可唤醒小鸡</button>
  </div>

  <!-- Modular Game Scripts (Classic Deferred — Works identically on file://, localhost, and PWA) -->
  <script defer src="js/storage.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/audio.js"></script>
  <script defer src="js/svg-wardrobe.js"></script>
  <script defer src="js/svg-buddies.js"></script>
  <script defer src="js/svg.js"></script>
  <script defer src="js/effects.js"></script>
  <script defer src="js/classic-toys.js"></script>
  <script defer src="js/mode-classic.js"></script>
  <script defer src="js/mode-colors.js"></script>
  <script defer src="js/mode-math.js"></script>
  <script defer src="js/mode-shapes.js"></script>
  <script defer src="js/habit-bath.js"></script>
  <script defer src="js/habit-bedtime.js"></script>
  <script defer src="js/mode-play.js"></script>
  <script defer src="js/wardrobe.js"></script>
  <script defer src="js/parent.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
