/* Full-Viewport Storybook World */
.app-shell {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  background: linear-gradient(180deg, #74CEFF 0%, #BCE9FF 46%, #D6F2FF 62%, #7CD957 100%);
  transition: background 0.55s ease;
}
.app-shell.weather-rain {
  background: linear-gradient(180deg, #6EA6D6 0%, #9BC0E0 46%, #BBD4EA 62%, #6AC850 100%);
}
.app-shell.weather-rainbow {
  background: linear-gradient(180deg, #64C8FF 0%, #B9ECFF 46%, #E5F8FF 62%, #7CD957 100%);
}

/* =====================
   1. Storybook Scenery
   ===================== */
.scenery {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

/* Weather Magic Box: Rainbow Arc & Rain Layer */
.rainbow-arc {
  position: absolute;
  bottom: 50%;
  left: 50%;
  width: min(94vw, 780px);
  height: 44%;
  transform: translateX(-50%) translateY(28px) scale(0.92);
  transform-origin: center bottom;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.65s ease, transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}
.rainbow-arc svg {
  width: 100%;
  height: 100%;
  display: block;
}
.app-shell.weather-rainbow .rainbow-arc {
  opacity: 0.9;
  transform: translateX(-50%) translateY(0) scale(1);
}
.app-shell.mode-quiz.weather-rainbow .rainbow-arc {
  opacity: 0.42;
}

.rain-layer {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  overflow: hidden;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.45s ease, visibility 0.45s ease;
}
.app-shell.weather-rain .rain-layer {
  opacity: 1;
  visibility: visible;
}
.app-shell.mode-quiz.weather-rain .rain-layer {
  opacity: 0.34;
}
.rain-drop {
  position: absolute;
  top: -28px;
  left: var(--x, 50%);
  width: 3px;
  height: 18px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.15) 0%, rgba(168, 226, 255, 0.88) 100%);
  animation: none;
}
.app-shell.weather-rain .rain-drop {
  animation: rainFall var(--dur, 1.12s) linear var(--delay, 0s) infinite;
}
@keyframes rainFall {
  0% { transform: translate3d(0, -24px, 0) rotate(12deg); opacity: 0; }
  12% { opacity: 0.92; }
  86% { opacity: 0.82; }
  100% { transform: translate3d(-44px, 106dvh, 0) rotate(12deg); opacity: 0; }
}

.hills-svg {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 75%;
  z-index: 0;
  pointer-events: none;
}
.hills-svg.hills-back { z-index: 0; }
.hills-svg.hills-front { z-index: 2; }

/* Standalone Natural-Aspect Hilltop House (Zero Stretching on Any Viewport!) */
.hill-house {
  position: absolute;
  left: 12%;
  bottom: 53.5%;
  width: clamp(54px, 6.2vw, 76px);
  aspect-ratio: 96 / 92;
  height: auto;
  z-index: 1;
  pointer-events: none;
}
.hill-house svg {
  width: 100%;
  height: 100%;
  display: block;
}

.sun-btn {
  position: absolute;
  top: 52px;
  right: 16px;
  width: 62px;
  height: 62px;
  pointer-events: auto;
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s;
  z-index: 12;
}
.sun-btn:hover { transform: scale(1.08); }
.sun-btn.spin { animation: sunSpin 0.9s cubic-bezier(0.34, 1.56, 0.64, 1); }
.app-shell.weather-rain .sun-btn { opacity: 0.76; }

@keyframes sunSpin {
  0% { transform: scale(1) rotate(0deg); }
  45% { transform: scale(1.22) rotate(180deg); }
  100% { transform: scale(1) rotate(360deg); }
}

.cloud {
  position: absolute;
  pointer-events: auto;
  cursor: pointer;
  z-index: 11;
  opacity: 0.92;
  transition: transform 0.2s ease;
}
.cloud svg path {
  transition: fill 0.45s ease, stroke 0.45s ease;
}
.app-shell.weather-rain .cloud svg path {
  fill: #D9E7F4;
  stroke: #6C98BF;
}
.cloud-1 { top: 56px; left: 10%; width: 88px; animation: floatCloud 18s ease-in-out infinite; }
.cloud-2 { top: 68px; right: 20%; width: 74px; animation: floatCloud 22s ease-in-out infinite reverse; }
.cloud.puff { animation: cloudPuff 0.5s ease; }

@keyframes floatCloud {
  0%, 100% { transform: translateX(0px); }
  50% { transform: translateX(22px); }
}
@keyframes cloudPuff {
  0% { transform: scale(1); }
  50% { transform: scale(1.2) translateY(-6px); }
  100% { transform: scale(1); }
}

/* Ground Props (Muddy Puddle, Meadow Playground Toys & Musical Flowers) */
.ground-prop {
  position: absolute;
  pointer-events: auto;
  cursor: pointer;
  z-index: 12;
  transition: transform 0.2s ease, opacity 0.25s ease, filter 0.2s ease;
}
/* In quiz modes, gently dim flowers/puddle & completely hide meadow playground toys */
.app-shell.mode-quiz .ground-prop {
  opacity: 0.35;
  pointer-events: none;
}
.app-shell.mode-quiz .meadow-toy {
  opacity: 0;
  pointer-events: none;
}

/* Enlarged Juicy Muddy Puddle (Portrait default: tucked cleanly above bottom dock) */
.puddle-btn {
  bottom: 78px;
  left: 10px;
  width: 122px;
  height: 60px;
  transform-origin: left bottom;
  transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease, filter 0.2s ease;
}
.puddle-btn svg,
.meadow-toy svg {
  width: 100%;
  height: 100%;
  display: block;
  transform-origin: center bottom;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.puddle-btn.puddle-grown {
  transform: scale(1.22);
}
.puddle-btn.puddle-grown::after {
  content: '';
  position: absolute;
  left: 14%;
  right: 14%;
  bottom: 18%;
  height: 44%;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0.72);
  pointer-events: none;
  animation: puddleRipple 1.6s ease-out infinite;
}
@keyframes puddleRipple {
  0% { transform: scale(0.45); opacity: 0.85; }
  100% { transform: scale(1.16); opacity: 0; }
}
.puddle-btn:active svg, .puddle-btn.splash svg {
  animation: puddleSplash 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes puddleSplash {
  0% { transform: scale(1); }
  35% { transform: scale(1.18, 0.82); }
  70% { transform: scale(0.95, 1.12); }
  100% { transform: scale(1); }
}

/* Meadow Playground Toys: Rainbow Slide & Bouncy Mushroom Trampoline */
.slide-toy {
  right: 8px;
  top: 34%;
  width: 106px;
  height: 88px;
  z-index: 12;
}
.trampoline-toy {
  left: 10px;
  top: 47%;
  width: 82px;
  height: 54px;
  z-index: 12;
}
.slide-toy:active svg,
.slide-toy.slide-cheer svg {
  animation: slideCheer 0.48s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes slideCheer {
  0% { transform: scale(1) rotate(0deg); }
  35% { transform: scale(1.06, 0.94) rotate(-2deg); }
  70% { transform: scale(0.97, 1.05) rotate(2deg); }
  100% { transform: scale(1) rotate(0deg); }
}
.trampoline-toy:active svg,
.trampoline-toy.trampoline-boing svg {
  animation: trampolineBoing 0.44s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes trampolineBoing {
  0% { transform: scale(1, 1); }
  28% { transform: scale(1.22, 0.72); }
  62% { transform: scale(0.9, 1.18); }
  84% { transform: scale(1.05, 0.95); }
  100% { transform: scale(1, 1); }
}

/* Drag-and-Drop Welcoming Rings & Hover Golden Glow on All 3 Playground Toys */
.ground-prop.drop-ready::before {
  content: '';
  position: absolute;
  inset: -8px;
  border-radius: 28px;
  border: 3px dashed rgba(255, 255, 255, 0.9);
  background: radial-gradient(circle, rgba(255, 245, 170, 0.24) 0%, rgba(255, 245, 170, 0) 72%);
  pointer-events: none;
  animation: toyDropRing 1.15s ease-in-out infinite;
}
.ground-prop.drop-hot {
  filter: drop-shadow(0 0 14px rgba(255, 212, 59, 0.98));
}
.ground-prop.drop-hot svg {
  transform: scale(1.09);
}
.ground-prop.drop-hot::before {
  inset: -11px;
  border-color: #FFD43B;
  border-width: 3.5px;
  background: radial-gradient(circle, rgba(255, 232, 102, 0.45) 0%, rgba(255, 212, 59, 0.08) 76%);
  box-shadow: 0 0 16px rgba(255, 212, 59, 0.68);
}
@keyframes toyDropRing {
  0%, 100% { transform: scale(0.96); opacity: 0.72; }
  50% { transform: scale(1.05); opacity: 1; }
}

.toy-drop-hint {
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%) translateY(4px) scale(0.88);
  padding: 4px 11px;
  border-radius: 999px;
  background: linear-gradient(180deg, #FFFCE0 0%, #FFE066 100%);
  border: 2.5px solid #4A3728;
  box-shadow: 0 3px 0 #C87B00, 0 4px 12px rgba(74, 55, 40, 0.22);
  font-size: 12.5px;
  font-weight: 900;
  color: #4A3728;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  z-index: 20;
  transition: opacity 0.16s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), visibility 0.16s ease;
}
.toy-drop-hint.visible {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0) scale(1);
}
.slide-toy .toy-drop-hint {
  left: auto;
  right: 0;
  transform: translateY(4px) scale(0.88);
}
.slide-toy .toy-drop-hint.visible {
  transform: translateY(0) scale(1);
}
.puddle-btn .toy-drop-hint,
.trampoline-toy .toy-drop-hint {
  left: 0;
  transform: translateY(4px) scale(0.88);
}
.puddle-btn .toy-drop-hint.visible,
.trampoline-toy .toy-drop-hint.visible {
  transform: translateY(0) scale(1);
}

.flower-1 { right: 14px; bottom: 84px; width: 34px; }
.flower-2 { right: 54px; bottom: 78px; width: 29px; }
.flower-3 { left: 170px; bottom: 80px; width: 29px; }
.flower-btn.bloom { animation: flowerBounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
@keyframes flowerBounce {
  0% { transform: scale(1) rotate(0); }
  40% { transform: scale(1.32) rotate(-14deg); }
  75% { transform: scale(1.12) rotate(10deg); }
  100% { transform: scale(1) rotate(0); }
}

/* =====================
   2. Minimal Floating HUD (Zero Heavy Bars!)
   ===================== */
.hud-top {
  position: absolute;

  right: 10px;
  z-index: 1030;

.hud-left {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  order: 1;
}

.hud-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  order: 2;
}

.pill-glass {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  height: 36px;
  padding: 0 10px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(8px);
  border: 2.5px solid rgba(255, 255, 255, 0.96);
  border-radius: 999px;
  box-shadow: 0 3px 10px rgba(45, 92, 128, 0.14);

  font-weight: 900;
  color: #4A3728;
  cursor: pointer;
  transition: transform 0.12s ease;
}
.pill-glass:active { transform: scale(0.94); }

.icon-circle-btn {
  width: 36px;
  height: 36px;
  padding: 0;

}

.sticker-tray {
  border-color: #FFAED0;

}
.sticker-slot {

}
.sticker-slot.empty { opacity: 0.22; filter: grayscale(1); }
.sticker-slot.earned {
  opacity: 1;
  animation: starPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes starPop {
  0% { transform: scale(0.3) rotate(-40deg); }
  60% { transform: scale(1.45) rotate(12deg); }
  100% { transform: scale(1) rotate(0deg); }
}

.classic-mini-counts {
  border-color: #FFD466;
  background: rgba(255, 251, 232, 0.92);
  gap: 8px;
  padding: 0 11px;
}
.classic-mini-counts.hidden { display: none; }

.timer-badge {
  border-color: #74C0FC;
  background: rgba(235, 247, 255, 0.94);

  white-space: nowrap;
}
.timer-badge.hidden { display: none; }

.wardrobe-hud-btn {

}
.wardrobe-hud-btn.has-claimable {

}
.wardrobe-dot {

  background: #FF4D5E;
  border: 2px solid #FFFFFF;
  box-shadow: 0 0 0 2px rgba(255, 77, 94, 0.34);

  animation: wardrobeDotPulse 1.45s ease-in-out infinite;
}
.wardrobe-dot.hidden { display: none; }
@keyframes wardrobeDotPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.24); }
}

/* Ultra-Clean Single-Line Floating Prompt (Flex-safe in both Portrait & Landscape) */
.prompt-wrap {
  order: 3;
  flex: 1 0 100%;
  display: flex;
  justify-content: center;
  min-width: 0;
  pointer-events: none;
}
.prompt-bubble {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  max-width: 100%;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(8px);
  border: 2.5px solid #FFAED0;
  border-radius: 999px;
  padding: 4px 13px 4px 6px;
  box-shadow: 0 4px 12px rgba(90, 50, 70, 0.12);
  cursor: pointer;
  transition: transform 0.14s ease;
}
.prompt-bubble:active { transform: scale(0.96); }
.prompt-speak-icon {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #FFE57F;
  border: 2px solid #F5A623;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
}
.prompt-text {
  font-size: 14px;
  font-weight: 800;
  color: #4A3728;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* =====================
   3. Floating Mode Dock & Dedicated Sub-Mode Capsule Dock
   ===================== */
.mode-dock {
  position: absolute;
  bottom: max(10px, env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%);
  z-index: 1032;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 7px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(10px);
  border: 3px solid rgba(255, 255, 255, 0.96);
  border-radius: 999px;
  box-shadow: 0 6px 18px rgba(40, 88, 25, 0.22);
}

.mode-tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  min-width: 64px;
  height: 50px;
  padding: 4px 8px;
  border-radius: 999px;
  border: 2.5px solid transparent;
  background: transparent;
  cursor: pointer;
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.15s, border-color 0.15s;
}
.mode-tab:active { transform: scale(0.92); }
.mode-tab.active {
  background: #FFF1A6;
  border-color: #F59F00;
  box-shadow: 0 3px 0 #D88400;
  transform: translateY(-2px);
}
.mode-icon { font-size: 21px; line-height: 1; }
.mode-title { font-size: 11px; font-weight: 900; color: #4A3728; line-height: 1.1; white-space: nowrap; }

/* Dedicated Single-Row Sub-Mode Capsule Dock (Docked Above Mode Dock in Portrait / Bottom Center in Landscape) */
.submode-dock {
  position: absolute;
  bottom: calc(max(10px, env(safe-area-inset-bottom)) + 74px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 1031;
  display: inline-flex;
  align-items: center;
  flex-wrap: nowrap;
  gap: 4px;
  height: 36px;
  max-width: calc(100% - 16px);
  padding: 3px 5px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(8px);
  border: 2.5px solid rgba(255, 255, 255, 0.96);
  border-radius: 999px;
  box-shadow: 0 4px 12px rgba(40, 88, 25, 0.16);
}
.submode-dock::-webkit-scrollbar { display: none; }
.submode-dock.hidden { display: none; }

.submode-pill {
  flex-shrink: 0;
  border: 2px solid transparent;
  background: transparent;
  border-radius: 999px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 900;
  line-height: 1.15;
  color: #6B523E;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s, border-color 0.15s, transform 0.12s;
}
.submode-pill:active { transform: scale(0.95); }
.submode-pill.active {
  background: #FFE878;
  border-color: #F59F00;
  color: #4A3728;
}

/* Subtle non-interactive stage progress eyebrow (replaces old misleading pill inside submode dock) */
.stage-level-note {
  font-size: 12px;
  font-weight: 800;
  line-height: 1.2;
  color: rgba(74, 55, 40, 0.76);
  text-shadow: 0 1px 2px rgba(255, 255, 255, 0.9);
  letter-spacing: 0.3px;
  pointer-events: none;
  user-select: none;
  margin: -4px 0 -6px;
}

/* Classic Mode Corner Action FABs (Toy Hammer & Tidy — Zero Top Bar Bloat!) */
.classic-fabs {
  position: absolute;
  right: 12px;
  bottom: 132px;
  z-index: 1026;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.classic-fabs.hidden { display: none; }

.fab-btn {
  position: relative;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  border: 3px solid #4A3728;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  cursor: pointer;
  transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.16s ease, border-color 0.16s ease;
}
.fab-btn:active { transform: scale(0.9) translateY(2px); }
.fab-amber {
  background: linear-gradient(180deg, #FFE878 0%, #FFB02E 100%);
  box-shadow: 0 4px 0 #C87B00;
}

  touch-action: none;
}

}

  animation: hammerHintPulse 0.56s ease-in-out infinite;
}
#hammerFab.active {
  background: linear-gradient(180deg, #FFD43B 0%, #FF6B9D 100%);
  border-color: #FFFFFF;
  box-shadow: 0 0 0 4px #FF5C8D, 0 6px 16px rgba(255, 92, 141, 0.45);
  transform: scale(1.12) rotate(-12deg);
  animation: none;
}
@keyframes hammerReadyPulse {
  0%, 100% {
    transform: scale(1) rotate(0deg);
    box-shadow: 0 4px 0 #C87B00, 0 0 0 0 rgba(255, 200, 45, 0.72);
  }
  50% {
    transform: scale(1.09) rotate(-8deg);
    box-shadow: 0 4px 0 #C87B00, 0 0 0 11px rgba(255, 200, 45, 0);
  }
}
@keyframes hammerHintPulse {
  0%, 100% {
    transform: scale(1.06) rotate(-14deg);
    box-shadow: 0 4px 0 #C87B00, 0 0 0 4px rgba(255, 77, 94, 0.55), 0 0 18px rgba(255, 212, 59, 0.95);
  }
  50% {
    transform: scale(1.2) rotate(14deg);
    box-shadow: 0 4px 0 #C87B00, 0 0 0 12px rgba(255, 77, 94, 0), 0 0 24px rgba(255, 212, 59, 1);
  }
}
.fab-mint {
  background: linear-gradient(180deg, #B2F7C0 0%, #5FD67A 100%);
  box-shadow: 0 4px 0 #359B4B;
}
.fab-badge {
  position: absolute;
  top: -5px;
  right: -5px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 999px;
  background: #FF4D5E;
  border: 2px solid #FFFFFF;
  color: #FFFFFF;
  font-size: 11px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
}
.fab-badge.hidden { display: none; }

/* =====================
   4. Quiz Stage Shell
   ===================== */
.stage {
  position: absolute;
  inset: 0;
  z-index: 1016;

/* === css/games.css === */
/* ==========================================================================
   Happy Mrs. Chicken — Classic Meadow & Quiz Game Modes
   ========================================================================== */

/* =====================
   1. Classic Free-Meadow Playground
   ===================== */
.classic-field {
  position: absolute;
  inset: 0;
  cursor: pointer;
  overflow: hidden;
}
.classic-field.hidden {
  display: none;
  pointer-events: none;
}

/* STRICT Pixel-Exact SVG Hit-Testing: wrappers/svg/shadows ignore pointer events;
   only visible painted SVG geometry and number tags capture clicks! */
.free-chicken-wrap {
  position: absolute;
  transform: translate(-50%, -78%);
  transition: left 0.36s cubic-bezier(0.22, 1, 0.36, 1), top 0.36s cubic-bezier(0.22, 1, 0.36, 1);
  z-index: 650;
  pointer-events: none;
}
.free-chicken-wrap .chicken-facing,
.free-chicken-wrap .chicken-actor,
.free-chicken-wrap svg {
  pointer-events: none;
}
.free-chicken-wrap svg path,
.free-chicken-wrap svg circle,
.free-chicken-wrap svg ellipse,
.free-chicken-wrap svg polygon,
.free-chicken-wrap svg rect,
.free-chicken-wrap svg line {
  pointer-events: visiblePainted;
  cursor: pointer;
}
.chicken-facing { transition: transform 0.22s ease; }
.chicken-facing.flip { transform: scaleX(-1); }

.chicken-actor {
  position: relative;
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  filter: drop-shadow(0 8px 10px rgba(68, 95, 32, 0.22));
}
.chicken-actor:hover { transform: scale(1.03); }
.chicken-actor.idle { animation: chickenBreathe 2.8s ease-in-out infinite; }
.chicken-actor.lay { animation: chickenLay 0.58s cubic-bezier(0.34, 1.56, 0.64, 1); }
.chicken-actor.celebrate { animation: chickenDance 0.75s ease-in-out 2; }
.chicken-actor.tilt { animation: chickenTilt 0.5s ease-in-out; }

@keyframes chickenBreathe {
  0%, 100% { transform: translateY(0) scaleY(1); }
  50% { transform: translateY(-4px) scaleY(1.02); }
}
@keyframes chickenLay {
  0% { transform: scale(1, 1) translateY(0); }
  25% { transform: scale(1.16, 0.82) translateY(12px); }
  55% { transform: scale(0.92, 1.15) translateY(-28px) rotate(-5deg); }
  80% { transform: scale(1.05, 0.96) translateY(2px) rotate(3deg); }
  100% { transform: scale(1, 1) translateY(0) rotate(0); }
}
@keyframes chickenDance {
  0%, 100% { transform: translateY(0) rotate(0); }
  25% { transform: translateY(-20px) rotate(-10deg) scale(1.08); }
  50% { transform: translateY(0) rotate(0); }
  75% { transform: translateY(-20px) rotate(10deg) scale(1.08); }
}
@keyframes chickenTilt {
  0%, 100% { transform: rotate(0); }
  35% { transform: rotate(-11deg); }
  70% { transform: rotate(8deg); }
}

.chicken-wing-l, .chicken-wing-r { transform-origin: center; }
.chicken-actor.lay .chicken-wing-l, .chicken-actor.celebrate .chicken-wing-l { animation: flapL 0.22s ease-in-out 3; }
.chicken-actor.lay .chicken-wing-r, .chicken-actor.celebrate .chicken-wing-r { animation: flapR 0.22s ease-in-out 3; }
@keyframes flapL { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-28deg); } }
@keyframes flapR { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(28deg); } }

.free-meadow-item {
  position: absolute;
  transform: translate(-50%, -72%);
  pointer-events: none;
}
.meadow-item-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
  transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
}
.meadow-sprite-wrap {
  position: relative;
}
.meadow-sprite-wrap,
.chick-facing,
.chick-waddle {
  pointer-events: none;
}
.chick-facing {
  transition: transform 0.2s ease;
}
.chick-facing.flip {
  transform: scaleX(-1);
}
.chick-waddle.waddling {
  animation: chickWaddle 0.44s ease-in-out infinite;
}
@keyframes chickWaddle {
  0%, 100% { transform: translateY(0) rotate(-3.5deg); }
  50% { transform: translateY(-4px) rotate(3.5deg); }
}

.free-meadow-item svg {
  pointer-events: none;
}
.free-meadow-item svg path,
.free-meadow-item svg circle,
.free-meadow-item svg ellipse,
.free-meadow-item svg polygon,
.free-meadow-item svg rect,
.free-meadow-item svg line {
  pointer-events: visiblePainted;
  cursor: pointer;
}
.free-meadow-item .item-num-tag {
  pointer-events: auto;
  cursor: pointer;
}
/* Grabbable & Draggable Hatched Chicks + Rare Buddies (Zero scroll hijack, Pixel-Exact Hit-Testing Preserved!) */
.free-meadow-item.is-chick,
.free-meadow-item.is-chick svg path,
.free-meadow-item.is-chick svg circle,
.free-meadow-item.is-chick svg ellipse,
.free-meadow-item.is-chick svg polygon,
.free-meadow-item.is-chick svg rect,
.free-meadow-item.is-chick svg line,
.free-meadow-item.is-chick .item-num-tag {
  touch-action: none;
}
.free-meadow-item.is-chick svg path,
.free-meadow-item.is-chick svg circle,
.free-meadow-item.is-chick svg ellipse,
.free-meadow-item.is-chick svg polygon,
.free-meadow-item.is-chick svg rect,
.free-meadow-item.is-chick svg line,
.free-meadow-item.is-chick .item-num-tag {
  cursor: grab;
}
.free-meadow-item.is-dragging {
  z-index: 950 !important;
}
.free-meadow-item.is-dragging svg path,
.free-meadow-item.is-dragging svg circle,
.free-meadow-item.is-dragging svg ellipse,
.free-meadow-item.is-dragging svg polygon,
.free-meadow-item.is-dragging svg rect,
.free-meadow-item.is-dragging svg line,
.free-meadow-item.is-dragging .item-num-tag {
  cursor: grabbing;
}
.free-meadow-item.is-dragging .meadow-item-inner {
  transform: translateY(-10px) scale(1.18);
  filter: drop-shadow(0 16px 14px rgba(56, 84, 24, 0.34)) drop-shadow(0 0 10px rgba(255, 232, 102, 0.92));
}
.free-meadow-item.is-dragging .chick-waddle {
  animation: chickGrabWiggle 0.34s ease-in-out infinite;
}
@keyframes chickGrabWiggle {
  0%, 100% { transform: rotate(-6deg) translateY(0); }
  50% { transform: rotate(6deg) translateY(-3px); }
}
.free-meadow-item.is-playing-toy {
  z-index: 930 !important;
}

/* Temporary Cute Mud Freckles Overlay After Puddle Jump */
.muddy-splatter,
.muddy-splatter svg,
.muddy-splatter svg * {
  pointer-events: none !important;
}
.muddy-splatter {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0.95;
  transition: opacity 0.6s ease;
}
.muddy-splatter svg {
  width: 100%;
  height: 100%;
  display: block;
}
.muddy-splatter.fading {
  opacity: 0;
}

/* Playground Toy Burst Particles (Mud Droplets & Sparkle Stars) */
.mud-droplet {
  position: absolute;
  border-radius: 50% 50% 54% 46% / 44% 56% 44% 56%;
  background: radial-gradient(circle at 35% 30%, #C79464 0%, #8D5524 68%, #5E3A1D 100%);
  border: 2px solid #5E3A1D;
  transform: translate(-50%, -50%) scale(0.4);
  pointer-events: none;
  animation: mudDropletBurst 0.68s cubic-bezier(0.2, 0.8, 0.35, 1) forwards;
}
@keyframes mudDropletBurst {
  0% { transform: translate(-50%, -50%) scale(0.4); opacity: 0.95; }
  45% { transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, -40px))) scale(1.12); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx, 0px) * 1.25), calc(-50% + var(--dy, -40px) * 0.2 + 24px)) scale(0.5); opacity: 0; }
}
.toy-sparkle {
  position: absolute;
  font-size: 20px;
  line-height: 1;
  transform: translate(-50%, -50%) scale(0.4);
  pointer-events: none;
  animation: toySparkleBurst 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes toySparkleBurst {
  0% { transform: translate(-50%, -50%) scale(0.4) rotate(0deg); opacity: 0; }
  25% { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, -44px))) scale(1.2) rotate(120deg); opacity: 0; }
}

svg .ground-shadow {
  pointer-events: none !important;
}
.free-meadow-item:not(.is-dragging):not(.is-playing-toy):hover .meadow-item-inner {
  transform: translateY(-3px) scale(1.03);
  filter: drop-shadow(0 0 8px rgba(255, 232, 102, 0.95));
}
.meadow-item-inner.golden-shimmer {
  filter: drop-shadow(0 0 9px rgba(255, 212, 59, 0.85));
}
.meadow-item-inner.pop-in { animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
.meadow-item-inner.hop { animation: chickHop 0.48s cubic-bezier(0.34, 1.56, 0.64, 1); }
.meadow-item-inner.egg-shake { animation: eggShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97); }
.meadow-item-inner.egg-incubating {
  transform-origin: center bottom;
  animation: eggIncubateWobble 0.44s ease-in-out infinite;
}

@keyframes popIn {
  0% { transform: scale(0.2) translateY(-32px); opacity: 0; }
  70% { transform: scale(1.15) translateY(4px); opacity: 1; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}
@keyframes chickHop {
  0%, 100% { transform: translateY(0) scale(1); }
  45% { transform: translateY(-24px) scale(1.12); }
}
@keyframes eggShake {
  0%, 100% { transform: translateX(0) rotate(0deg) scale(1); }
  20% { transform: translateX(-7px) rotate(-10deg) scale(1.06); }
  40% { transform: translateX(7px) rotate(10deg) scale(1.08); }
  60% { transform: translateX(-5px) rotate(-7deg) scale(1.04); }
  80% { transform: translateX(4px) rotate(5deg) scale(1.02); }
}
@keyframes eggIncubateWobble {
  0%, 100% { transform: rotate(0deg) scale(1, 1); }
  22% { transform: rotate(-9deg) scale(1.04, 0.96); }
  48% { transform: rotate(9deg) scale(1.04, 0.96); }
  72% { transform: rotate(-6deg) scale(0.98, 1.04); }
  88% { transform: rotate(5deg) scale(1.02, 0.99); }
}

/* Toy Hammer Mode, Floating Dragged Mallet & Whack Animation */
.classic-field.hammer-mode {
  cursor: crosshair;
}
.classic-field.hammer-mode .free-meadow-item.is-golden-egg .meadow-item-inner {
  filter: drop-shadow(0 0 14px rgba(255, 212, 59, 0.98));
  animation: goldenTargetInvite 1.1s ease-in-out infinite;
}
.classic-field.hammer-mode .free-meadow-item.is-golden-egg .meadow-item-inner.egg-shake {
  animation: eggShake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97);
}
@keyframes goldenTargetInvite {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.07); }
}

.free-meadow-item.hammer-target-hot .meadow-item-inner,
.classic-field.hammer-mode .free-meadow-item.is-golden-egg.hammer-target-hot .meadow-item-inner {
  animation: none;
  transform: translateY(-6px) scale(1.14);
  filter: drop-shadow(0 0 16px rgba(255, 212, 59, 1)) drop-shadow(0 0 8px rgba(255, 107, 157, 0.85));
}
.free-meadow-item.hammer-target-hot .item-num-tag.golden-tag {
  background: linear-gradient(180deg, #FFF3B0 0%, #FF85B3 100%);
  border-color: #D63384;
  color: #4A3728;
}

.floating-hammer-tool {
  position: fixed;
  left: 0;
  top: 0;
  width: 74px;
  height: 74px;
  margin-left: -37px;
  margin-top: -37px;
  pointer-events: none;
  z-index: 1080;
  filter: drop-shadow(0 12px 14px rgba(74, 55, 40, 0.34));
  will-change: transform;
}
.floating-hammer-tool.over-target {
  filter: drop-shadow(0 0 14px rgba(255, 212, 59, 0.98)) drop-shadow(0 12px 14px rgba(74, 55, 40, 0.3));
}
.floating-hammer-tool svg {
  width: 100%;
  height: 100%;
  display: block;
  animation: hammerDragBob 0.32s ease-in-out infinite alternate;
}
@keyframes hammerDragBob {
  0% { transform: rotate(-8deg) scale(1.04); }
  100% { transform: rotate(8deg) scale(1.1); }
}

.hammer-strike-fx {
  position: absolute;
  width: 76px;
  height: 76px;
  margin-left: -12px;
  margin-top: -64px;
  transform-origin: 76% 84%;
  pointer-events: none;
  z-index: 65;
  filter: drop-shadow(0 6px 10px rgba(74, 55, 40, 0.28));
  animation: hammerWhack 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.hammer-strike-fx svg {
  width: 100%;
  height: 100%;
  display: block;
}
@keyframes hammerWhack {
  0% { transform: rotate(28deg) scale(0.75); opacity: 0; }
  24% { transform: rotate(36deg) scale(1.06); opacity: 1; }
  50% { transform: rotate(-48deg) scale(1.15); opacity: 1; }
  72% { transform: rotate(-18deg) scale(1.02); opacity: 1; }
  100% { transform: rotate(-8deg) scale(0.9); opacity: 0; }
}

.item-num-tag {
  margin-top: -6px;
  background: #FFFFFF;
  border: 2.5px solid #4A3728;
  border-radius: 999px;
  min-width: 26px;
  height: 24px;
  padding: 0 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 900;
  color: #4A3728;
  box-shadow: 0 2px 0 rgba(74, 55, 40, 0.25);
  white-space: nowrap;
}
.item-num-tag.golden-tag {
  background: linear-gradient(180deg, #FFF7B2 0%, #FFD43B 100%);
  border-color: #C87B00;
  color: #6B3E00;
  font-size: 12px;
  padding: 0 8px;
}
/* Storybook soft-mist caption for rare buddies — blends gently with meadow grass */
.item-num-tag.rare-tag {
  margin-top: -2px;
  min-width: 0;
  height: auto;
  padding: 1px 7px;
  border: none;
  border-radius: 999px;
  background: rgba(255, 253, 245, 0.58);
  box-shadow: none;
  color: #4A3728;
  font-size: 11px;
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: 0.2px;
  white-space: nowrap;
  text-shadow:
    0 1px 0 rgba(255, 255, 255, 0.94),
    0 -1px 0 rgba(255, 255, 255, 0.85),
    1px 0 0 rgba(255, 255, 255, 0.85),
    -1px 0 0 rgba(255, 255, 255, 0.85);
}

/* Storybook self-intro speech bubble above rare buddies (on hatch / tap / grab) */
.rare-intro-bubble {
  position: absolute;
  bottom: calc(100% + 4px);
  left: 50%;
  transform: translateX(-50%);
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(255, 254, 249, 0.96);
  border: 2px solid #8A6B52;
  color: #4A3728;
  font-size: 12px;
  font-weight: 900;
  line-height: 1.25;
  white-space: nowrap;
  box-shadow: 0 3px 10px rgba(60, 88, 35, 0.16);
  pointer-events: none;
  z-index: 20;
  animation: introBubblePop 0.26s cubic-bezier(0.34, 1.56, 0.64, 1);
  transition: opacity 0.34s ease, transform 0.34s ease;
}
.rare-intro-bubble::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: #8A6B52;
}
.rare-intro-bubble::before {
  content: '';
  position: absolute;
  top: calc(100% - 2px);
  left: 50%;
  transform: translateX(-50%);
  border: 4px solid transparent;
  border-top-color: rgba(255, 254, 249, 0.98);
  z-index: 1;
}
.rare-intro-bubble.fade-out {
  opacity: 0;
  transform: translate(-50%, -6px) scale(0.95);
}
@keyframes introBubblePop {
  0% { opacity: 0; transform: translate(-50%, 6px) scale(0.75); }
  100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
}

.tap-ripple {
  position: absolute;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 4px solid #FFE066;
  background: rgba(255, 240, 140, 0.35);
  transform: translate(-50%, -50%) scale(0.4);
  pointer-events: none;
  animation: rippleOut 0.55s ease-out forwards;
  z-index: 5;
}
@keyframes rippleOut {
  0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(3.2); opacity: 0; }
}

/* =====================
   2. Shared Quiz Components (Colors / Counting / Shapes)
   ===================== */
.sorting-hero {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  max-width: 100%;
}

.featured-egg-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: grab;
  touch-action: none;
}
.featured-egg-wrap:active { cursor: grabbing; }
.featured-egg-wrap.bounce { animation: featuredBounce 1.8s ease-in-out infinite; }
@keyframes featuredBounce {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-9px) rotate(2deg); }
}

.count-chip {
  background: rgba(255, 255, 255, 0.94);
  border: 3px solid #F6B93B;
  border-radius: 999px;
  padding: 3px 13px;
  font-size: 15px;
  font-weight: 900;
  color: #5C3D1E;
  box-shadow: 0 3px 0 rgba(212, 146, 18, 0.3);
}

.choice-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  width: 100%;
  max-width: 720px;
}
.choice-grid-4 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  width: 100%;
  max-width: 760px;
}
.choice-grid-5 {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  width: 100%;
  max-width: 760px;
}

/* =====================
   3. Color Lab (Mixing & Pattern Train)
   ===================== */
.mix-board {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: rgba(255, 255, 255, 0.92);
  border: 4px solid #4A3728;
  border-radius: 28px;
  padding: 10px 16px;

}

/* =====================

}

.shape-block-btn.shake { animation: gentleShake 0.45s ease-in-out; }
.shape-block-btn.hint-glow { animation: hintPulse 1s ease-in-out infinite; border-color: #FF8C00; }

/* Choice Cards */
.nest-card {
  position: relative;
  min-height: 150px;
  background: rgba(255, 255, 255, 0.94);
  border: 4px solid #4A3728;
  border-radius: 26px;
  padding: 12px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
  box-shadow: 0 6px 0 rgba(74, 55, 40, 0.24);
  transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.nest-card.card-compact { min-height: 114px; }
.nest-card.card-clue { min-height: 128px; }
.nest-card:hover { transform: translateY(-4px) scale(1.03); }
.nest-card:active { transform: translateY(3px) scale(0.97); }
.nest-card.shake { animation: gentleShake 0.45s ease-in-out; }
.nest-card.hint-glow { animation: hintPulse 1s ease-in-out infinite; border-color: #FF8C00; }
.nest-card.correct-pop { animation: correctPop 0.65s cubic-bezier(0.34, 1.56, 0.64, 1); }

@keyframes gentleShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-8px) rotate(-2deg); }
  75% { transform: translateX(8px) rotate(2deg); }
}
@keyframes hintPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 196, 0, 0.78), 0 6px 0 rgba(74, 55, 40, 0.24); transform: scale(1); }
  50% { box-shadow: 0 0 0 14px rgba(255, 196, 0, 0), 0 6px 0 rgba(74, 55, 40, 0.24); transform: scale(1.05); }
}
@keyframes correctPop {
  0% { transform: scale(1); }
  45% { transform: scale(1.12); }
  100% { transform: scale(1); }
}

.nest-label { font-size: 18px; font-weight: 900; color: #4A3728; }
.nest-sublabel { font-size: 12px; font-weight: 800; color: #7D624E; }

/* =====================
   5. Feeding & Math Mode
   ===================== */
.feed-scene {

.feed-top-row {

}

.thought-bubble {

.hungry-chick-wrap { display: flex; flex-direction: column; align-items: center; }

@keyframes chickChomp {

.corn-tray {

/* =====================
   5b. Math Growth: Size Ordering (📏 大小排队)
   ===================== */
:root {
  --size-scale: 1;
  --nest-scale: 1;
  --slot-scale: 0.84;
}

.size-hero {
  gap: 18px;
}
.size-hero-stage {
  min-height: calc(116px * var(--size-scale, 1));
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.size-item-visual {
  width: calc(var(--item-w, 68px) * var(--size-scale, 1));
  height: calc(var(--item-h, 80px) * var(--size-scale, 1));
  display: flex;
  align-items: flex-end;
  justify-content: center;
  flex-shrink: 0;
}
.size-nest-visual {
  width: calc(var(--nest-w, 104px) * var(--nest-scale, 1));
  height: calc(var(--nest-h, 68px) * var(--nest-scale, 1));
  display: flex;
  align-items: flex-end;
  justify-content: center;
  flex-shrink: 0;
}
.size-hero .size-item-visual svg,
.size-nest-card .size-nest-visual svg,
.size-nest-card .size-item-visual svg,
.size-slot .size-item-visual svg,
.size-choice-card .size-item-visual svg {
  width: 100%;
  height: 100%;
  max-width: none;
  max-height: none;
  display: block;
}

.size-nest-card {
  justify-content: flex-end;
  min-height: 154px;
  padding: 12px 6px 10px;
}
.size-nest-stage {
  height: calc(84px * var(--nest-scale, 1));
  display: flex;
  align-items: flex-end;
  justify-content: center;
  width: 100%;
}

.size-order-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  width: 100%;
  max-width: 780px;
}
.size-order-board {
  display: grid;
  gap: 10px;
  padding: 12px 14px;
  background: rgba(255, 255, 255, 0.93);
  border: 4px solid #4A3728;
  border-radius: 28px;
  box-shadow: 0 6px 0 rgba(74, 55, 40, 0.2);
  flex: 1 1 auto;
  max-width: 580px;
}
.size-order-board.cols-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.size-order-board.cols-4 {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.size-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  padding: 8px 6px;
  border-radius: 20px;
  border: 3px dashed #C7B299;
  background: #FFFDF7;
  transition: border-color 0.2s, background 0.2s, transform 0.2s;
}
.size-slot.active-slot {
  border-color: #FF922B;
  background: #FFF8E6;
  animation: hintPulse 1.5s ease-in-out infinite;
}
.size-slot.filled {
  border-style: solid;
  border-color: #51CF66;
  background: #F1FDF3;
}
.size-slot-stage {
  height: calc(116px * var(--slot-scale, 0.84));
  width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.size-slot-stage .size-item-visual {
  width: calc(var(--item-w, 68px) * var(--slot-scale, 0.84));
  height: calc(var(--item-h, 80px) * var(--slot-scale, 0.84));
}
.size-slot-stage.pop-in {
  animation: popIn 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.size-slot-q {
  align-self: center;
  font-size: 28px;
  font-weight: 900;
  color: #D49212;
  opacity: 0.72;
}
.size-slot-label {
  font-size: 13px;
  font-weight: 900;
  color: #5C4332;
  white-space: nowrap;
}

.size-choice-row {
  display: grid;
  gap: 12px;
  width: 100%;
  max-width: 740px;
  align-items: stretch;
}
.size-choice-row.cols-3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  max-width: 640px;
}
.size-choice-row.cols-4 {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  max-width: 740px;
}

.size-choice-card {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  padding: 12px 8px;
  background: rgba(255, 255, 255, 0.96);
  border: 4px solid #4A3728;
  border-radius: 26px;
  cursor: pointer;
  box-shadow: 0 6px 0 rgba(74, 55, 40, 0.24);
  transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.22s;
}
.size-choice-card:hover { transform: translateY(-4px) scale(1.03); }
.size-choice-card:active { transform: translateY(3px) scale(0.96); }
.size-choice-card.shake { animation: gentleShake 0.45s ease-in-out; }
.size-choice-card.hint-glow { animation: hintPulse 1s ease-in-out infinite; border-color: #FF8C00; }
.size-choice-card.used {
  opacity: 0.24;
  pointer-events: none;
  transform: scale(0.92);
  box-shadow: none;
}
.size-choice-stage {
  height: calc(116px * var(--size-scale, 1));
  width: 100%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

/* Chick & Ducky Live Interactive Animations */
.bath-chick-actor {
  transform-box: view-box;
  transform-origin: 214px 158px;
}
.bath-chick-tuft {
  transform-box: view-box;
  transform-origin: 214px 54px;
}
.bath-chick-actor.chick-tickle-giggle {
  animation: bathChickTickle 0.34s ease-in-out infinite;
}
@keyframes bathChickTickle {
  0%, 100% { transform: rotate(0deg) scale(1, 1); }
  25% { transform: rotate(-4.5deg) scale(1.04, 0.96); }
  75% { transform: rotate(4.5deg) scale(0.97, 1.04); }
}

.bath-chick-actor.chick-shake-off {
  animation: bathChickShakeOff 0.16s ease-in-out infinite;
}
@keyframes bathChickShakeOff {
  0%, 100% { transform: translateX(0) rotate(0deg); }
  25% { transform: translateX(-7px) rotate(-6deg); }
  75% { transform: translateX(7px) rotate(6deg); }
}

.bath-chick-actor.chick-fluff-sway {
  animation: bathChickFluff 0.42s ease-in-out infinite;
}
.bath-chick-actor.chick-fluff-sway .bath-chick-tuft {
  animation: bathTuftSway 0.24s ease-in-out infinite;
}
@keyframes bathChickFluff {
  0%, 100% { transform: scale(1, 1) rotate(0deg); }
  50% { transform: scale(1.04, 1.03) rotate(1.8deg); }
}
@keyframes bathTuftSway {
  0%, 100% { transform: rotate(-10deg) scaleY(1.08); }
  50% { transform: rotate(12deg) scaleY(1.14); }
}

.bath-chick-actor.chick-happy-bounce {
  animation: bathChickHappy 1.4s ease-in-out infinite;
}
@keyframes bathChickHappy {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-6px) scale(1.03); }
}

.bath-ducky {
  cursor: pointer;
  transform-box: view-box;
  transform-origin: 104px 154px;
  animation: bathDuckyFloat 2.8s ease-in-out infinite;
}
.bath-ducky.ducky-bounce {
  animation: bathDuckyBounce 0.52s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes bathDuckyFloat {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-3.5px) rotate(2.5deg); }
}
@keyframes bathDuckyBounce {
  0% { transform: translateY(0) scale(1, 1) rotate(0deg); }
  30% { transform: translateY(-18px) scale(0.92, 1.14) rotate(-10deg); }
  62% { transform: translateY(3px) scale(1.12, 0.88) rotate(6deg); }
  100% { transform: translateY(0) scale(1, 1) rotate(0deg); }
}

.bath-spot {
  cursor: pointer;
}
.bath-spot .spot-mud,
.bath-spot .spot-foam,
.bath-spot .spot-wet {
  transition: opacity 0.14s ease, transform 0.14s ease;
}

.bath-pour-fx.pouring-active {
  animation: bathPourPulse 0.56s ease-out forwards;
}
@keyframes bathPourPulse {
  0% { opacity: 0; transform: translateY(-10px); }
  20% { opacity: 1; transform: translateY(0); }
  85% { opacity: 1; transform: translateY(2px); }
  100% { opacity: 0; transform: translateY(4px); }
}

.bath-shake-spray {
  transition: opacity 0.18s ease;
}
.bath-done-sparkles {
  transition: opacity 0.35s ease;
  animation: bathSparkleTwinkle 1.6s ease-in-out infinite;
}
@keyframes bathSparkleTwinkle {
  0%, 100% { transform: scale(1); opacity: 0.95; }
  50% { transform: scale(1.03); opacity: 0.72; }
}

/* Floating Poppable Iridescent Bubbles Layer */
.bath-bubbles-layer,
.bath-fx-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.bath-bubbles-layer { z-index: 6; }
.bath-fx-layer { z-index: 8; }

.floating-bubble {
  position: absolute;
  padding: 0;
  border-radius: 50%;
  border: 2px solid var(--bub-stroke, #74C0FC);
  background:
    radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.48) 26%, var(--bub-tint, #D0EBFF) 68%, rgba(255, 214, 232, 0.65) 100%);
  box-shadow:
    inset -3px -4px 8px rgba(130, 180, 255, 0.38),
    inset 2px 2px 5px rgba(255, 255, 255, 0.92),
    0 3px 8px rgba(45, 92, 128, 0.16);
  pointer-events: auto;
  cursor: pointer;
  touch-action: manipulation;
  transform: translate(-50%, -50%);
  animation: bathBubbleRise var(--bub-dur, 4s) ease-out forwards;
}
.floating-bubble::after {
  content: '';
  position: absolute;
  top: 18%;
  left: 20%;
  width: 28%;
  height: 18%;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.92);
  transform: rotate(-28deg);
  pointer-events: none;
}
@keyframes bathBubbleRise {
  0% {
    transform: translate(-50%, -50%) scale(0.35);
    opacity: 0;
  }
  12% {
    transform: translate(calc(-50% + var(--bub-sway, 12px) * 0.25), -68%) scale(1.04);
    opacity: 0.96;
  }
  55% {
    transform: translate(calc(-50% - var(--bub-sway, 12px) * 0.55), -190%) scale(1);
    opacity: 0.92;
  }
  100% {
    transform: translate(calc(-50% + var(--bub-sway, 12px)), -360%) scale(0.92);
    opacity: 0;
  }
}

/* Stage Micro-Toasts, Sparkles & Tap-Assist Zip */
.bath-micro-toast {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 16px;
  font-weight: 900;
  white-space: nowrap;

  animation: bathToastUp 0.95s ease-out forwards;
}
@keyframes bathToastUp {
  0% { transform: translate(-50%, -30%) scale(0.6); opacity: 0; }
  22% { transform: translate(-50%, -65%) scale(1.12); opacity: 1; }
  100% { transform: translate(-50%, -145%) scale(0.96); opacity: 0; }
}

.bath-sparkle-pop {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 20px;
  line-height: 1;
  animation: bathSparklePop 0.65s ease-out forwards;
}
@keyframes bathSparklePop {
  0% { transform: translate(-50%, -50%) scale(0.4) rotate(0deg); opacity: 0; }
  35% { transform: translate(-50%, -70%) scale(1.25) rotate(24deg); opacity: 1; }
  100% { transform: translate(-50%, -120%) scale(0.75) rotate(60deg); opacity: 0; }
}

.bath-zip-tool {
  position: absolute;
  transform: translate(-50%, -50%);

  flex-direction: column;
  align-items: center;

}
.bath-zip-tool.bath-zip-dryer {

}
@keyframes bathZipPop {
  0% { transform: translate(-50%, -25%) scale(0.55) rotate(-14deg); opacity: 0; }
  45% { transform: translate(-50%, -55%) scale(1.12) rotate(10deg); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(0.85) rotate(-6deg); opacity: 0; }
}

/* Step 2 / 3 / 4: Draggable Tool Handle & Guide */
.bath-draggable-dock {

}

.bath-tool-handle {

}
.bath-tool-handle:active { cursor: grabbing; }
.bath-tool-handle.hint-glow {

}
.bath-tool-handle.is-dragging {

}

}
.bath-tool-svg {

}
.bath-tool-badge {

.bath-tool-guide {

.bath-hint-arrow {

}

.bath-progress-pills {

}
.bath-progress-count {

.bath-replay-btn {

/* Active Floating Dragged Tool Cursor (Pointer-Follow Overlay) */
.bath-drag-cursor {
  position: fixed;
  left: -200px;
  top: -200px;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 75;
  display: none;
  flex-direction: column;
  align-items: center;
  filter: drop-shadow(0 6px 10px rgba(74, 55, 40, 0.28));
}
.bath-drag-cursor.visible {

}
.bath-cursor-tool {
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.15s ease;
}

.bath-drag-cursor.tool-sponge.active-effect .bath-cursor-tool {
  animation: bathSpongeWiggle 0.24s ease-in-out infinite;
}
@keyframes bathSpongeWiggle {
  0%, 100% { transform: rotate(-10deg) scale(1.04); }
  50% { transform: rotate(10deg) scale(0.98); }
}

.bath-drag-cursor.tool-shower.active-effect .bath-cursor-tool {
  transform: rotate(-16deg) scale(1.04);
}
.bath-water-streams {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 5px;
  margin-top: -12px;
  margin-left: -14px;
  opacity: 0;
  transition: opacity 0.14s ease;
}
.bath-drag-cursor.tool-shower.active-effect .bath-water-streams,
.bath-zip-tool .bath-water-streams {
  opacity: 1;
}
.bath-water-streams span {
  width: 4px;
  height: 46px;
  border-radius: 999px;
  background: linear-gradient(180deg, rgba(116, 192, 252, 0.95) 0%, rgba(56, 182, 255, 0.72) 60%, rgba(116, 192, 252, 0) 100%);

}
.bath-water-streams span:nth-child(2) { height: 56px; animation-delay: 0.08s; }
.bath-water-streams span:nth-child(3) { height: 62px; animation-delay: 0.16s; }
.bath-water-streams span:nth-child(4) { height: 52px; animation-delay: 0.24s; }
.bath-water-streams span:nth-child(5) { height: 42px; animation-delay: 0.12s; }
.bath-water-streams.compact span { height: 32px; }
@keyframes bathWaterFall {
  0% { transform: translateY(-6px); opacity: 0.35; }
  45% { transform: translateY(8px); opacity: 1; }
  100% { transform: translateY(22px); opacity: 0; }
}

/* Hairdryer Warm Golden Wind Streaks */
.bath-drag-cursor.tool-dryer {

}
.bath-drag-cursor.tool-dryer.face-right {

}
.bath-wind-streams {
  display: flex;
  flex-direction: column;

  gap: 6px;

.bath-drag-cursor.tool-dryer.active-effect .bath-wind-streams,
.bath-zip-tool .bath-wind-streams {

}
.bath-wind-streams span {
  width: 44px;
  height: 4px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(255, 196, 61, 0) 0%, rgba(255, 183, 3, 0.92) 55%, rgba(255, 243, 191, 0.96) 100%);
  animation: bathWindGust 0.38s ease-out infinite;
}
.bath-wind-streams span:nth-child(2) { width: 54px; animation-delay: 0.12s; }
.bath-wind-streams span:nth-child(3) { width: 40px; animation-delay: 0.24s; }
.bath-wind-streams.compact span { width: 30px; }
@keyframes bathWindGust {
  0% { transform: translateX(8px) scaleX(0.6); opacity: 0.3; }
  50% { transform: translateX(-10px) scaleX(1.06); opacity: 1; }
  100% { transform: translateX(-28px) scaleX(0.8); opacity: 0; }
}

/* =====================
   5f. Interactive Tactile Bedtime (刷牙盖被子)
   ===================== */
.bed-canvas {
  background: #E6FCF5;
  transition: border-color 0.45s ease, box-shadow 0.45s ease, background 0.55s ease;
}
.bed-canvas.night-mode {

  border-color: #7950F2;
  box-shadow: 0 7px 0 #3B2878, 0 0 24px rgba(177, 151, 252, 0.5);
}
.bed-canvas.bed-done-state.night-mode {
  border-color: #B197FC;
  box-shadow: 0 7px 0 #4C3399, 0 0 26px rgba(255, 224, 102, 0.55);
}

.bed-scene-svg {
  width: 100%;
  height: 100%;
  display: block;
}

.bed-fx-layer {
  position: absolute;
  inset: 0;

  z-index: 9;
}

/* Step 1: Toothpaste Tube & Flavor Dock */
.bed-tube-actor,
.bed-bristles-hit {

}
.bed-tube-actor:active {
  cursor: grabbing;
}
.bed-tube-actor.tube-done {

}

.bed-paste-dock {

}
.bed-flavor-row {

}
.bed-flavor-pill {
  display: inline-flex;

.bed-flavor-pill:hover { transform: translateY(-2px); }
.bed-flavor-pill:active { transform: translateY(2px) scale(0.96); }
.bed-flavor-pill.selected {
  background: linear-gradient(180deg, var(--bf-foam, #FFE3EE) 0%, var(--bf-paste, #FF6B9D) 100%);
  color: #FFFFFF;
  text-shadow: 0 1px 2px rgba(74, 55, 40, 0.45);
  box-shadow: 0 0 0 3px rgba(255, 224, 102, 0.9), 0 3px 0 var(--bf-dark, #D6336C);
}
.bed-flavor-emoji { font-size: 16px; line-height: 1; }

.bed-paste-action-row {
  display: flex;
  align-items: center;

  width: 100%;
}
.bed-tool-paste {

  padding: 5px 12px;

}
.bed-tool-brush {

.bed-meter-wrap {

}
.bed-meter-track {

}
.bed-meter-fill {
  height: 100%;
  border-radius: 999px;
  transition: width 0.14s ease, background 0.2s ease;
}

/* Step 2: Open-Mouth 6 Wiggling Candy/Germ Monsters & Gargle */
.bed-germ {
  cursor: pointer;
}
.bed-germ .germ-body-anim {
  transform-box: fill-box;
  transform-origin: center;
  animation: bedGermWiggle 1.15s ease-in-out infinite;
}
.bed-germ:nth-child(2n) .germ-body-anim { animation-delay: 0.22s; }
.bed-germ:nth-child(3n) .germ-body-anim { animation-delay: 0.48s; }
@keyframes bedGermWiggle {
  0%, 100% { transform: rotate(-6deg) scale(1, 1); }
  50% { transform: rotate(6deg) scale(1.06, 0.94); }
}

.bed-germ .germ-mover {
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 0.14s ease;
}
.bed-germ.germ-fly-off .germ-mover {
  animation: bedGermFlyOff 0.56s cubic-bezier(0.2, 0.85, 0.3, 1) forwards;
}
.bed-germ.germ-defeated .germ-hit {
  pointer-events: none;
}
@keyframes bedGermFlyOff {
  0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
  35% { transform: translate(calc(var(--fly-x, 90px) * 0.45), calc(var(--fly-y, -80px) * 0.45)) rotate(240deg) scale(1.1); opacity: 1; }
  100% { transform: translate(var(--fly-x, 120px), var(--fly-y, -100px)) rotate(540deg) scale(0.18); opacity: 0; }
}

.bed-germ .germ-foam {
  transition: opacity 0.14s ease, transform 0.14s ease;
}
.tooth-sparkle {
  transform-box: fill-box;
  transform-origin: center;
  transition: opacity 0.25s ease;
  animation: bedSparkleTwinkle 1.5s ease-in-out infinite;
}
@keyframes bedSparkleTwinkle {
  0%, 100% { transform: scale(1) rotate(0deg); }
  50% { transform: scale(1.18) rotate(12deg); }
}

.bed-mouth-hit {
  cursor: pointer;
}
.bed-gargle-fx {
  transition: opacity 0.2s ease;
}
.bed-gargle-fx.gargle-active {
  animation: bedGarglePulse 0.34s ease-in-out infinite;
}
@keyframes bedGarglePulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.02); }
}

.bed-drag-cursor.tool-toothbrush.active-effect .bath-cursor-tool {
  animation: bedBrushScrub 0.2s ease-in-out infinite;
}
@keyframes bedBrushScrub {
  0%, 100% { transform: translateX(-6px) rotate(-8deg); }
  50% { transform: translateX(6px) rotate(6deg); }
}
.bed-drag-cursor.tool-cup.active-effect .bath-cursor-tool {
  transform: rotate(-28deg) scale(1.06);
}
.bed-drag-cursor.tool-plushie .bath-cursor-tool {
  animation: bedPlushFloat 0.6s ease-in-out infinite;
}
@keyframes bedPlushFloat {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-4px) rotate(4deg); }
}

/* Step 3a: Plushie Selection Cards */
.bed-plushie-dock {
  width: 100%;
}

  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));

  touch-action: none;
  user-select: none;

.bed-plushie-card:hover { transform: translateY(-3px) scale(1.03); }
.bed-plushie-card:active { cursor: grabbing; transform: translateY(2px) scale(0.96); }
.bed-plushie-card.is-dragging {

}
.bed-plushie-svg {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
}
.bed-plushie-name {
  font-size: 13.5px;
  font-weight: 900;
  color: #4A3728;
  white-space: nowrap;
  pointer-events: none;
}

/* Step 3b & Step 4: Bedroom Transitions, Starry Quilt Overlay & Lamp Pull-Cord */
.bed-night-layer,
.bed-day-layer,
.bed-window-stars,
.bed-night-sparkles {

}

.bed-chick-actor {

}
.bed-chick-actor.chick-sleeping {

}
@keyframes bedSleepBreathe {

}

/* Interactive Pink Starry Quilt Overlay aligned over the SVG crib */
.bed-quilt-overlay {
  position: absolute;
  left: 16.5%;
  width: 61.5%;
  bottom: 6.5%;
  z-index: 4;
  border-radius: 18px 18px 12px 12px;
  border: 3px solid #4A3728;
  background: linear-gradient(180deg, #FFC2E2 0%, #FF93C9 58%, #F772B4 100%);
  box-shadow: inset 0 6px 0 rgba(255, 255, 255, 0.55), 0 -3px 10px rgba(74, 55, 40, 0.14);

.bed-quilt-overlay.quilt-tucked-low {
  pointer-events: none;
}
.bed-quilt-overlay.quilt-snug {
  cursor: default;
  pointer-events: none;
  transition: height 0.34s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.6s ease;
}
.bed-canvas.night-mode .bed-quilt-overlay {
  filter: brightness(0.76) saturate(1.12);
  border-color: #262254;
}

.bed-quilt-hem {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 11px;
  border-radius: 14px 14px 0 0;
  background: repeating-linear-gradient(
    90deg,
    #FFF0F7 0 16px,
    #FFE066 16px 24px
  );
  border-bottom: 2px solid rgba(74, 55, 40, 0.35);
  pointer-events: none;
}

.bed-quilt-stars {
  position: absolute;
  inset: 14px 10px 6px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  font-size: 15px;
  opacity: 0.9;
  pointer-events: none;
}
.bed-quilt-stars span:nth-child(even) {
  transform: translateY(6px) scale(0.88);
}

.bed-quilt-handle {
  position: absolute;
  left: 50%;
  top: -17px;
  transform: translateX(-50%);
  display: none;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 4px 12px;
  border-radius: 999px;
  border: 2.8px solid #4A3728;
  background: linear-gradient(180deg, #FFF7B2 0%, #FFD43B 100%);
  box-shadow: 0 3px 0 #C87B00, 0 0 12px rgba(255, 212, 59, 0.78);
  font-size: 12.5px;
  font-weight: 900;
  color: #4A3728;
  white-space: nowrap;
  cursor: grab;
  touch-action: none;
  z-index: 6;
}
.bed-quilt-handle.visible {
  display: inline-flex;
  animation: bedHandlePulse 1.15s ease-in-out infinite;
}
.bed-quilt-handle:active { cursor: grabbing; }
.bed-quilt-arrows {
  display: inline-block;
  animation: bedArrowUp 0.85s ease-in-out infinite;
}
@keyframes bedHandlePulse {
  0%, 100% { transform: translateX(-50%) scale(1); }
  50% { transform: translateX(-50%) scale(1.06); }
}
@keyframes bedArrowUp {
  0%, 100% { transform: translateY(1px); }
  50% { transform: translateY(-4px); }
}

/* Interactive Golden Star Lamp Pull-Cord (#bedLampCord) */
.bed-lamp-cord {
  position: absolute;
  right: 1.5%;
  top: 22%;
  width: 26%;
  height: 58%;
  z-index: 6;
  pointer-events: none;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.bed-lamp-cord.cord-active {
  pointer-events: auto;
  cursor: grab;
}
.bed-lamp-cord.cord-active:active {
  cursor: grabbing;
}
.bed-lamp-cord-hit {
  position: relative;
  width: 100%;
  height: 100%;
}
.bed-lamp-cue-badge {
  position: absolute;
  right: 2px;
  top: calc(56% + var(--cord-pull, 0px));
  display: none;
  align-items: center;
  justify-content: center;
  padding: 3px 8px;
  border-radius: 999px;
  border: 2.4px solid #4A3728;
  background: linear-gradient(180deg, #FFF7B2 0%, #FFD43B 100%);
  box-shadow: 0 3px 0 #C87B00, 0 0 12px rgba(255, 224, 102, 0.85);
  font-size: 11px;
  font-weight: 900;
  color: #4A3728;
  white-space: nowrap;
  pointer-events: none;
}
.bed-lamp-cue-badge.visible {
  display: inline-flex;
  animation: bedArrowDown 0.95s ease-in-out infinite;
}
@keyframes bedArrowDown {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(5px); }
}

/* Dreamy Floating Zzz... 🌙 Layer */
.bed-zzz-layer {
  position: absolute;
  left: 44%;
  top: 10%;
  width: 90px;
  height: 76px;
  pointer-events: none;
  z-index: 7;
  opacity: 0;
  transition: opacity 0.6s ease;
}
.bed-zzz-layer.visible {
  opacity: 1;
}
.bed-zzz {
  position: absolute;
  font-weight: 900;
  color: #FFE875;
  text-shadow: 0 2px 6px rgba(14, 19, 52, 0.85);
  animation: bedZzzFloat 2.6s ease-in-out infinite;
}
.bed-zzz.z1 { left: 10px; bottom: 8px; font-size: 15px; animation-delay: 0s; }
.bed-zzz.z2 { left: 28px; bottom: 22px; font-size: 19px; animation-delay: 0.45s; }
.bed-zzz.z3 { left: 48px; bottom: 38px; font-size: 22px; animation-delay: 0.9s; }
.bed-zzz-moon {
  position: absolute;
  right: 4px;
  top: 2px;
  font-size: 18px;
  animation: bedZzzFloat 3s ease-in-out infinite;
  animation-delay: 0.6s;
}
@keyframes bedZzzFloat {
  0% { transform: translateY(6px) scale(0.85); opacity: 0.2; }
  45% { transform: translateY(-4px) scale(1.06); opacity: 1; }
  100% { transform: translateY(-14px) scale(0.95); opacity: 0.15; }
}

  <!-- Modular Game Scripts (Classic Deferred — Works identically on file://, localhost, and PWA) -->
  <script>
window.__HMC_SINGLE_FILE__ = true;

// === js/storage.js ===
(function (HMC) {
  'use strict';

  const PREFIX = 'hmc_v1_';
  const VOICE_KEY = 'hmc_v2_voices';
  const DEFAULT_NICKNAME = '宝贝';
  const VALID_LANGS = ['zh', 'bi', 'en'];
  const DEFAULT_VOICE_SLOTS = ['praise', 'lay', 'party', 'sleep'];
  const FALLBACK_INSIGHT_SKILLS = [
    { id: 'color_basic',   icon: '🥚', name: '颜色基础配对', group: '颜色启蒙' },
    { id: 'color_mix',     icon: '🎨', name: '调色魔法',     group: '颜色启蒙' },
    { id: 'color_pattern', icon: '🚂', name: '规律小火车',   group: '逻辑推理' },
    { id: 'math_feed',     icon: '🌽', name: '数玉米计数',   group: '数学启蒙' },
    { id: 'math_size',     icon: '📏', name: '大小排排队',   group: '比较与序数' },
    { id: 'math_addsub',   icon: '➕', name: '具象小加减',   group: '数学启蒙' },
    { id: 'shape_basic',   icon: '🥚', name: '形状基础配对', group: '几何认知' },
    { id: 'shape_clue',    icon: '🕵️', name: '多维线索寻蛋', group: '观察与逻辑' },
    { id: 'shape_build',   icon: '🧩', name: '图形拼图',     group: '空间几何' },
    { id: 'shape_odd',     icon: '🔎', name: '形状找不同',   group: '分类辨别' },
    { id: 'play_music',    icon: '🎹', name: '音乐小鸡琴',   group: '听觉节奏' },
    { id: 'play_habits',   icon: '🛁', name: '生活好习惯',   group: '自理习惯' }
  ];
  const FALLBACK_INSIGHT_MAP = Object.fromEntries(FALLBACK_INSIGHT_SKILLS.map(s => [s.id, s]));
  const FALLBACK_RARE_IDS = [
    'dino', 'duck', 'bunny', 'bear', 'cat', 'panda',
    'wizard', 'rainbow', 'unicorn', 'fairy', 'princess', 'mermaid',
    'strawberry', 'cupcake', 'donut', 'icecream', 'peach', 'pudding',
    'astronaut', 'doctor', 'chef', 'firefighter', 'pirate', 'painter'
  ];
  const FALLBACK_LEGACY_SLOTS = {
    bow: 'neck',
    crown: 'head',
    boots: 'feet',
    sunglasses: 'eyes',
    tutu: 'body',
    wings: 'back',
    wand: 'hand'
  };

  function getWardrobeItemSlot(id) {
    if (typeof id !== 'string' || !id) return null;
    const catalog = HMC.data && HMC.data.WARDROBE_BY_ID;
    if (catalog && catalog[id] && catalog[id].slot) {
      return catalog[id].slot;
    }
    if (FALLBACK_LEGACY_SLOTS[id]) {
      return FALLBACK_LEGACY_SLOTS[id];
    }
    const match = id.match(/^(head|body|neck|eyes|feet|back|hand)_/);
    return match ? match[1] : null;
  }

  function enforceSinglePerSlot(ids) {
    const list = Array.isArray(ids) ? ids : [];
    const seen = new Set();
    const slotToId = new Map();
    const ordered = [];
    list.forEach(id => {
      if (typeof id !== 'string' || !id || id === 'none' || seen.has(id)) return;
      seen.add(id);
      const slot = getWardrobeItemSlot(id);
      if (slot) {
        if (slotToId.has(slot)) {
          const prevId = slotToId.get(slot);
          const prevIdx = ordered.indexOf(prevId);
          if (prevIdx >= 0) ordered.splice(prevIdx, 1);
        }
        slotToId.set(slot, id);
      }
      ordered.push(id);
    });
    return ordered;
  }

  function getInsightSkills() {
    if (HMC.data && Array.isArray(HMC.data.INSIGHT_SKILLS) && HMC.data.INSIGHT_SKILLS.length > 0) {
      return HMC.data.INSIGHT_SKILLS;
    }
    return FALLBACK_INSIGHT_SKILLS;
  }

  function getInsightSkillMap() {
    if (HMC.data && HMC.data.INSIGHT_SKILL_BY_ID && typeof HMC.data.INSIGHT_SKILL_BY_ID === 'object') {
      return HMC.data.INSIGHT_SKILL_BY_ID;
    }
    return FALLBACK_INSIGHT_MAP;
  }

  function createDefaultInsights() {
    return {
      skills: {},
      misses: {},
      totalAttempts: 0,
      totalCorrect: 0,
      updatedAt: 0
    };
  }

  function normalizeInsights(rawInsights) {
    const base = createDefaultInsights();
    if (!rawInsights || typeof rawInsights !== 'object') return base;

    const skillMap = getInsightSkillMap();
    const skills = {};
    let sumAttempts = 0;
    let sumCorrect = 0;

    if (rawInsights.skills && typeof rawInsights.skills === 'object') {
      Object.keys(rawInsights.skills).forEach(skillId => {
        if (!skillMap[skillId]) return;
        const rawEntry = rawInsights.skills[skillId];
        if (!rawEntry || typeof rawEntry !== 'object') return;
        const attempts = Math.max(0, Math.floor(Number(rawEntry.attempts) || 0));
        const correct = Math.min(attempts, Math.max(0, Math.floor(Number(rawEntry.correct) || 0)));
        if (attempts > 0 || correct > 0) {
          skills[skillId] = { attempts, correct };
          sumAttempts += attempts;
          sumCorrect += correct;
        }
      });
    }

    const misses = {};
    if (rawInsights.misses && typeof rawInsights.misses === 'object') {
      Object.keys(rawInsights.misses).forEach(label => {
        const cleanLabel = typeof label === 'string' ? label.replace(/[<>]/g, '').trim() : '';
        if (!cleanLabel) return;
        const count = Math.max(0, Math.floor(Number(rawInsights.misses[label]) || 0));
        if (count > 0) {
          misses[cleanLabel] = count;
        }
      });
    }

    const rawTotalAttempts = Math.max(0, Math.floor(Number(rawInsights.totalAttempts) || 0));
    const totalAttempts = Math.max(sumAttempts, rawTotalAttempts);
    const rawTotalCorrect = Math.max(0, Math.floor(Number(rawInsights.totalCorrect) || 0));
    const totalCorrect = Math.min(totalAttempts, Math.max(sumCorrect, rawTotalCorrect));
    const updatedAt = Math.max(0, Math.floor(Number(rawInsights.updatedAt) || 0));

    return {
      skills,
      misses,
      totalAttempts,
      totalCorrect,
      updatedAt
    };
  }

  function get(key, fallback = null) {
    try {
      const raw = window.localStorage.getItem(PREFIX + key);
      if (raw === null || raw === undefined) return fallback;
      return JSON.parse(raw);
    } catch (e) {
      return fallback;
    }
  }

  function set(key, value) {
    try {
      window.localStorage.setItem(PREFIX + key, JSON.stringify(value));
      return true;
    } catch (e) {
      return false;
    }
  }

  function remove(key) {
    try {
      window.localStorage.removeItem(PREFIX + key);
      return true;
    } catch (e) {
      return false;
    }
  }

  function loadPrefs() {
    const saved = get('prefs', null);
    const lang = saved && VALID_LANGS.includes(saved.lang) ? saved.lang : 'zh';
    const soundOn = saved && typeof saved.soundOn === 'boolean' ? saved.soundOn : true;
    return { lang, soundOn };
  }

  function savePrefs(partial) {
    const next = Object.assign(loadPrefs(), partial || {});
    return set('prefs', next);
  }

  let memoryProfile = null;

  function createDefaultProfile() {
    return {
      nickname: '',
      totalStars: 0,
      album: {},
      wardrobe: {
        unlocked: ['bow'],
        equipped: ['bow']
      },
      insights: createDefaultInsights()
    };
  }

  function normalizeWardrobe(rawWardrobe) {
    const rawW = (rawWardrobe && typeof rawWardrobe === 'object') ? rawWardrobe : null;
    let unlocked = rawW && Array.isArray(rawW.unlocked)
      ? rawW.unlocked.slice().filter(id => typeof id === 'string' && id && id !== 'none')
      : ['bow'];

    // Deduplicate and guarantee default starter 'bow' (cost 0) is always unlocked
    unlocked = Array.from(new Set(unlocked));
    if (!unlocked.includes('bow')) {
      unlocked.unshift('bow');
    }

    let equipped;
    if (rawW && Array.isArray(rawW.equipped)) {
      equipped = enforceSinglePerSlot(
        rawW.equipped.slice().filter(id => typeof id === 'string' && id && id !== 'none' && unlocked.includes(id))
      );
    } else if (rawW && rawW.equipped && typeof rawW.equipped === 'object') {
      // Support map-shaped equipped objects gracefully if ever encountered
      const clonedMap = Object.assign({}, rawW.equipped);
      equipped = enforceSinglePerSlot(
        Object.keys(clonedMap).filter(id => clonedMap[id] && unlocked.includes(id))
      );
    } else {
      equipped = ['bow'];
    }

    return { unlocked: unlocked.slice(), equipped: equipped.slice() };
  }

  function sanitizeNickname(name) {
    if (typeof name !== 'string') return DEFAULT_NICKNAME;
    const stripped = name.replace(/[<>]/g, '').trim();
    const capped = Array.from(stripped).slice(0, 12).join('').trim();
    return capped || DEFAULT_NICKNAME;
  }

  function normalizeProfile(raw) {
    const base = createDefaultProfile();
    if (!raw || typeof raw !== 'object') return base;
    const totalStars = Math.max(0, Math.floor(Number(raw.totalStars) || 0));
    const nickname = typeof raw.nickname === 'string'
      ? Array.from(raw.nickname.replace(/[<>]/g, '').trim()).slice(0, 12).join('').trim()
      : '';
    return Object.assign({}, base, raw, {
      nickname,
      totalStars,
      album: (raw.album && typeof raw.album === 'object') ? Object.assign({}, raw.album) : {},
      wardrobe: normalizeWardrobe(raw.wardrobe),
      insights: normalizeInsights(raw.insights)
    });
  }

  function getProfile() {
    try {
      const saved = get('profile', null);
      if (saved && typeof saved === 'object') {
        memoryProfile = normalizeProfile(saved);
        return normalizeProfile(memoryProfile);
      }
    } catch (e) {}
    if (!memoryProfile) memoryProfile = createDefaultProfile();
    return normalizeProfile(memoryProfile);
  }

  function saveProfile(p) {
    try {
      const current = getProfile();
      const merged = normalizeProfile(Object.assign({}, current, p || {}));
      memoryProfile = merged;
      return set('profile', merged);
    } catch (e) {
      return false;
    }
  }

  function getTotalStars() {
    try {
      const profile = getProfile();
      return Math.max(0, Math.floor(Number(profile.totalStars) || 0));
    } catch (e) {
      return 0;
    }
  }

  function addStar() {
    try {
      const profile = getProfile();
      const nextTotal = Math.max(0, Math.floor(Number(profile.totalStars) || 0)) + 1;
      profile.totalStars = nextTotal;
      saveProfile(profile);
      return nextTotal;
    } catch (e) {
      return 0;
    }
  }

  function getWardrobe() {
    try {
      const profile = getProfile();
      return {
        unlocked: profile.wardrobe.unlocked.slice(),
        equipped: profile.wardrobe.equipped.slice()
      };
    } catch (e) {
      return { unlocked: ['bow'], equipped: ['bow'] };
    }
  }

  function unlockWardrobeItem(id) {
    try {
      const profile = getProfile();
      const catalog = HMC.data && HMC.data.WARDROBE_BY_ID;
      const item = catalog && id ? catalog[id] : null;
      const totalStars = Math.max(0, Math.floor(Number(profile.totalStars) || 0));
      if (!item || totalStars < item.cost) {
        return {
          unlocked: profile.wardrobe.unlocked.slice(),
          equipped: profile.wardrobe.equipped.slice()
        };
      }
      if (!profile.wardrobe.unlocked.includes(id)) {
        profile.wardrobe.unlocked.push(id);
      }
      const slot = item.slot || getWardrobeItemSlot(id);
      if (slot) {
        profile.wardrobe.equipped = profile.wardrobe.equipped.filter(
          otherId => otherId !== id && getWardrobeItemSlot(otherId) !== slot
        );
      }
      if (!profile.wardrobe.equipped.includes(id)) {
        profile.wardrobe.equipped.push(id);
      }
      saveProfile(profile);
      return {
        unlocked: profile.wardrobe.unlocked.slice(),
        equipped: profile.wardrobe.equipped.slice()
      };
    } catch (e) {
      return getWardrobe();
    }
  }

  function toggleEquipWardrobeItem(id) {
    try {
      const profile = getProfile();
      if (!id || !profile.wardrobe.unlocked.includes(id)) {
        return {
          equipped: false,
          wardrobe: {
            unlocked: profile.wardrobe.unlocked.slice(),
            equipped: profile.wardrobe.equipped.slice()
          }
        };
      }
      const idx = profile.wardrobe.equipped.indexOf(id);
      let isEquipped;
      if (idx >= 0) {
        profile.wardrobe.equipped.splice(idx, 1);
        isEquipped = false;
      } else {
        const slot = getWardrobeItemSlot(id);
        if (slot) {
          profile.wardrobe.equipped = profile.wardrobe.equipped.filter(
            otherId => getWardrobeItemSlot(otherId) !== slot
          );
        }
        profile.wardrobe.equipped.push(id);
        isEquipped = true;
      }
      saveProfile(profile);
      return {
        equipped: isEquipped,
        wardrobe: {
          unlocked: profile.wardrobe.unlocked.slice(),
          equipped: profile.wardrobe.equipped.slice()
        }

      const list = Array.isArray(idsArray) ? idsArray : [];
      const validIds = list.filter(id => typeof id === 'string' && id && unlockedSet.has(id));
      profile.wardrobe.equipped = enforceSinglePerSlot(validIds);
      saveProfile(profile);
      return {
        unlocked: profile.wardrobe.unlocked.slice(),
        equipped: profile.wardrobe.equipped.slice()
      };
    } catch (e) {
      return getWardrobe();
    }
  }

      profile.wardrobe.equipped = [];

      err.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
      err.code === 22 ||
      err.code === 1014 ||

  function readVoiceStore() {
    const validSlots = getValidVoiceSlots();
    try {
      const raw = window.localStorage.getItem(VOICE_KEY);
      if (raw !== null && raw !== undefined) {
        const parsed = JSON.parse(raw);
        const cleaned = {};
        if (parsed && typeof parsed === 'object') {
          validSlots.forEach(id => {
            if (typeof parsed[id] === 'string' && parsed[id].startsWith('data:audio')) {
              cleaned[id] = parsed[id];

        }

      const profile = getProfile();
      const insights = normalizeInsights(profile.insights);
      const entry = insights.skills[skillId] || { attempts: 0, correct: 0 };

      entry.attempts += 1;
      insights.totalAttempts += 1;

      if (isCorrect) {
        entry.correct += 1;
        insights.totalCorrect += 1;
      } else if (topicLabel) {
        const cleanLabel = String(topicLabel).replace(/[<>]/g, '').trim();
        if (cleanLabel) {
          insights.misses[cleanLabel] = (Number(insights.misses[cleanLabel]) || 0) + 1;
        }
      }

      insights.skills[skillId] = entry;

    try {
      const profile = getProfile();
      const insights = normalizeInsights(profile.insights);
      const catalog = getInsightSkills();
      const totalAttempts = insights.totalAttempts;
      const totalCorrect = insights.totalCorrect;
      const overallRate = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;

      const playedSkills = [];
      catalog.forEach((skill, orderIdx) => {
        const stat = insights.skills[skill.id];
        if (!stat || stat.attempts <= 0) return;
        const rate = Math.round((stat.correct / stat.attempts) * 100);
        playedSkills.push({
          id: skill.id,
          icon: skill.icon,
          name: skill.name,
          group: skill.group,
          attempts: stat.attempts,
          correct: stat.correct,
          rate,
          _order: orderIdx
        });
      });

      playedSkills.sort((a, b) => {
        if (b.attempts !== a.attempts) return b.attempts - a.attempts;
        if (b.rate !== a.rate) return b.rate - a.rate;
        return a._order - b._order;
      });

      const cleanPlayed = playedSkills.map(({ _order, ...rest }) => rest);

      const strengths = cleanPlayed
        .filter(s => s.attempts >= 1 && s.rate >= 75)
        .sort((a, b) => {
          if (b.rate !== a.rate) return b.rate - a.rate;
          return b.attempts - a.attempts;
        })
        .slice(0, 3);

      let focusTopics = Object.entries(insights.misses)
        .filter(([, count]) => count > 0)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 4)
        .map(([label]) => label);

      if (focusTopics.length === 0) {
        focusTopics = cleanPlayed
          .filter(s => s.attempts >= 2 && s.rate < 75)
          .sort((a, b) => {
            if (a.rate !== b.rate) return a.rate - b.rate;
            return b.attempts - a.attempts;
          })
          .slice(0, 4)
          .map(s => s.name);
      }

      const rareList = (HMC.data && Array.isArray(HMC.data.RARE_BUDDIES) && HMC.data.RARE_BUDDIES.length > 0)
        ? HMC.data.RARE_BUDDIES.map(b => b.id)
        : FALLBACK_RARE_IDS;
      const totalRare = rareList.length;
      const album = profile.album && typeof profile.album === 'object' ? profile.album : {};
      const rareCount = rareList.filter(id => (Number(album[id]) || 0) > 0).length;

      return {
        totalAttempts,
        totalCorrect,
        overallRate,
        playedSkills: cleanPlayed,
        strengths,
        focusTopics,
        totalStars: Math.max(0, Math.floor(Number(profile.totalStars) || 0)),
        rareCount,
        totalRare
      };
    } catch (e) {
      return {
        totalAttempts: 0,
        totalCorrect: 0,
        overallRate: 0,
        playedSkills: [],
        strengths: [],
        focusTopics: [],
        totalStars: 0,
        rareCount: 0,
        totalRare: FALLBACK_RARE_IDS.length
      };
    }
  }

  function resetInsights() {
    try {
      const profile = getProfile();
      profile.insights = createDefaultInsights();
      saveProfile(profile);
      return true;
    } catch (e) {

    hasVoiceClip,

(function (HMC) {
  'use strict';

  let audioCtx = null;

  function getAudio() {
    if (!HMC.state.soundOn) return null;
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(() => {});
    }
    return audioCtx;
  }

  function playTone(freq, duration, type = 'sine', volume = 0.22, delay = 0, slideTo = null) {
    const ctx = getAudio();
    if (!ctx) return;
    const now = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(volume, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
