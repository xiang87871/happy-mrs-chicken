    }

    // Done celebration actions!
    return `
      <div class="bath-done-dock">
        <div class="bath-done-banner">✨ 洗白白吹蓬松，香喷喷好舒服！</div>
        <div class="bath-done-actions">
          <button class="bath-action-btn bath-replay-btn" id="bathReplayBtn" type="button">
            🔄 再洗一次
          </button>
          <button class="bath-action-btn bath-next-story-btn" id="bathToBedtimeBtn" type="button">
            🪥 去刷牙盖被子
          </button>
        </div>
      </div>
    `;
  }

  function updateStepsAndDockUI() {
    if (!mountContainer || !bathState) return;
    const stepsEl = mountContainer.querySelector('#bathStepsBar');
    if (stepsEl) stepsEl.innerHTML = renderStepsBarHTML();

    const dockEl = mountContainer.querySelector('#bathToolDock');
    if (dockEl) {
      dockEl.innerHTML = renderToolDockHTML();
      bindDockEvents();
    }
  }

  function updateSpotCountUI() {
    if (!mountContainer || !bathState) return;
    const countEl = mountContainer.querySelector('#bathSpotCount');
    if (countEl) {
      const total = bathState.spots.length;
      const done = total - countRemainingForPhase();
      countEl.textContent = `${done}/${total}`;
    }
  }

  function setChickExpression(expr) {
    if (!bathState) return;
    bathState.expression = expr;
    if (!mountContainer) return;
    const exprNodes = mountContainer.querySelectorAll('.chick-expr');
    exprNodes.forEach(node => {
      node.style.display = node.classList.contains(`expr-${expr}`) ? '' : 'none';
    });
  }

  function syncSceneVisuals() {
    if (!mountContainer || !bathState) return;
    const pal = getFlavorPalette();

    // Water tint
    const waterEl = mountContainer.querySelector('#bathWaterFill');
    if (waterEl) waterEl.setAttribute('fill', pal.water);

    // Pour FX colors
    const pourStream = mountContainer.querySelector('#bathPourStream');
    if (pourStream) pourStream.setAttribute('stroke', pal.stroke);
    const pourBody = mountContainer.querySelector('#bathPourBottleBody');
    if (pourBody) pourBody.setAttribute('fill', pal.bottleBody);
    const pourCap = mountContainer.querySelector('#bathPourBottleCap');
    if (pourCap) pourCap.setAttribute('fill', pal.bottleCap);

    // Ambient tub foam along water rim
    const tubFoam = mountContainer.querySelector('#bathTubFoam');
    if (tubFoam) {
      let rimOpacity = 0;
      if (bathState.phase === 'pouring') rimOpacity = 0.72;
      else if (bathState.phase === 'scrub') rimOpacity = 0.95;
      else if (bathState.phase === 'rinse') {
        const avgFoam = bathState.spots.reduce((acc, s) => acc + s.foamLevel, 0) / (bathState.spots.length * 100);
        rimOpacity = Math.max(0.18, avgFoam * 0.95);
      } else if (bathState.phase === 'shake' || bathState.phase === 'dry') {
        rimOpacity = 0.14;
      } else if (bathState.phase === 'done') {
        rimOpacity = 0.28;
      }
      tubFoam.setAttribute('opacity', rimOpacity.toFixed(2));
      tubFoam.querySelectorAll('circle').forEach((c, idx) => {
        if (idx % 2 === 0) c.setAttribute('fill', pal.foam);
        c.setAttribute('stroke', pal.stroke);
      });
    }

    // Update each of the 5 spots
    bathState.spots.forEach(spot => {
      const group = mountContainer.querySelector(`.bath-spot[data-spot-id="${spot.id}"]`);
      if (!group) return;
      const mudEl = group.querySelector('.spot-mud');
      const foamEl = group.querySelector('.spot-foam');
      const wetEl = group.querySelector('.spot-wet');

      // Mud visibility
      let mudOpacity = 0;
      let mudScale = 1;
      if (bathState.phase === 'flavor' || bathState.phase === 'pouring') {
        mudOpacity = 1;
        mudScale = 1;
      } else if (bathState.phase === 'scrub') {
        mudOpacity = Math.max(0, 1 - spot.scrubProgress / 92);
        mudScale = Math.max(0.15, 1 - (spot.scrubProgress / 100) * 0.78);
      }
      if (mudEl) {
        mudEl.setAttribute('opacity', mudOpacity.toFixed(2));
        mudEl.setAttribute('transform', `rotate(${spot.rot}) scale(${mudScale.toFixed(2)})`);
      }

      // Foam visibility
      let foamOpacity = 0;
      let foamScale = 0.2;
      if (bathState.phase === 'scrub') {
        foamOpacity = Math.min(1, spot.scrubProgress / 28);
        foamScale = 0.22 + 0.88 * (spot.scrubProgress / 100);
      } else if (bathState.phase === 'rinse') {
        foamOpacity = Math.min(1, spot.foamLevel / 25);
        foamScale = 0.22 + 0.88 * (spot.foamLevel / 100);
      }
      if (foamEl) {
        foamEl.setAttribute('opacity', foamOpacity.toFixed(2));
        foamEl.setAttribute('transform', `scale(${foamScale.toFixed(2)})`);
        foamEl.querySelectorAll('circle').forEach((c, idx) => {
          if (idx !== 2) c.setAttribute('fill', pal.foam);
          c.setAttribute('stroke', pal.stroke);
        });
      }

      // Wet droplet visibility
      let wetOpacity = 0;
      let wetScale = 0.2;
      if (bathState.phase === 'shake' || bathState.phase === 'dry') {
        wetOpacity = Math.min(1, spot.wetLevel / 24);
        wetScale = 0.28 + 0.78 * (spot.wetLevel / 100);
      }
      if (wetEl) {
        wetEl.setAttribute('opacity', wetOpacity.toFixed(2));
        wetEl.setAttribute('transform', `scale(${wetScale.toFixed(2)})`);
      }
    });

    // Clean halo & sparkles
    const halo = mountContainer.querySelector('#bathCleanHalo');
    const sparkles = mountContainer.querySelector('#bathDoneSparkles');
    const isDone = bathState.phase === 'done';
    if (halo) halo.setAttribute('opacity', isDone ? '0.88' : '0');
    if (sparkles) sparkles.setAttribute('opacity', isDone ? '1' : '0');

    const canvas = mountContainer.querySelector('#bathCanvas');
    if (canvas) {
      canvas.classList.toggle('bath-done-state', isDone);
    }

    updateSpotCountUI();
  }

  /* ========================================================================
     Micro-FX Helpers: Stage Micro-Toasts, Poppable Bubbles, Zip Assist
     ======================================================================== */

  function svgToPercent(svgX, svgY) {
    return {
      leftPct: Math.max(6, Math.min(94, (svgX / SVG_W) * 100)),
      topPct: Math.max(8, Math.min(90, (svgY / SVG_H) * 100))
    };
  }

  function spawnStageToast(text, svgX, svgY, color = '#FF5C9D') {
    if (!mountContainer) return;
    const fx = mountContainer.querySelector('#bathFxLayer');
    if (!fx) return;
    const { leftPct, topPct } = svgToPercent(svgX, svgY);
    const el = document.createElement('div');
    el.className = 'bath-micro-toast';
    el.textContent = text;
    el.style.left = `${leftPct}%`;
    el.style.top = `${topPct}%`;
    el.style.color = color;
    fx.appendChild(el);
    schedule(() => {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 980);
  }

  function spawnSparkleStar(svgX, svgY, color = '#FFB703') {
    if (!mountContainer) return;
    const fx = mountContainer.querySelector('#bathFxLayer');
    if (!fx) return;
    const { leftPct, topPct } = svgToPercent(svgX, svgY);
    const el = document.createElement('span');
    el.className = 'bath-sparkle-pop';
    el.textContent = '✨';
    el.style.left = `${leftPct}%`;
    el.style.top = `${topPct}%`;
    el.style.color = color;
    fx.appendChild(el);
    schedule(() => {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 680);
  }

  function spawnFloatingBubble(originSvgX = null, originSvgY = null) {
    if (!mountContainer || !bathState) return null;
    if (activeBubbleCount >= 12) return null;
    const layer = mountContainer.querySelector('#bathBubblesLayer');
    if (!layer) return null;

    const pal = getFlavorPalette();
    const id = ++bubbleUid;
    const sx = originSvgX != null ? originSvgX + (Math.random() * 44 - 22) : (120 + Math.random() * 190);
    const sy = originSvgY != null ? originSvgY + (Math.random() * 18 - 9) : (145 + Math.random() * 25);
    const { leftPct, topPct } = svgToPercent(sx, sy);
    const size = Math.round(28 + Math.random() * 18);
    const dur = (3.4 + Math.random() * 1.8).toFixed(2);
    const sway = Math.round(Math.random() * 34 - 17);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'floating-bubble';
    btn.dataset.bubbleId = String(id);
    btn.setAttribute('aria-label', '戳一戳飘浮泡泡');
    btn.style.left = `${leftPct}%`;
    btn.style.top = `${topPct}%`;
    btn.style.width = `${size}px`;
    btn.style.height = `${size}px`;
    btn.style.setProperty('--bub-tint', pal.water);
    btn.style.setProperty('--bub-stroke', pal.stroke);
    btn.style.setProperty('--bub-dur', `${dur}s`);
    btn.style.setProperty('--bub-sway', `${sway}px`);

    activeBubbleCount++;

    const removeBubble = () => {
      if (btn.dataset.removed === '1') return;
      btn.dataset.removed = '1';
      activeBubbleCount = Math.max(0, activeBubbleCount - 1);
      if (btn.parentNode) btn.parentNode.removeChild(btn);
    };

    const handlePop = (e) => {
      if (e) {
        e.stopPropagation();
        if (typeof e.preventDefault === 'function') e.preventDefault();
      }
      popBubble(btn, sx, sy);
    };

    btn.addEventListener('pointerdown', handlePop);
    btn.addEventListener('click', handlePop);
    btn.addEventListener('animationend', removeBubble);

    layer.appendChild(btn);
    schedule(removeBubble, Math.round(parseFloat(dur) * 1000) + 250);
    return btn;
  }

  function popBubble(bubbleEl, fallbackSvgX = 210, fallbackSvgY = 90) {
    if (!bathState) return false;
    if (bubbleEl && bubbleEl.dataset && bubbleEl.dataset.popped === '1') return false;

    let toastX = fallbackSvgX;
    let toastY = fallbackSvgY;

    if (bubbleEl && mountContainer) {
      bubbleEl.dataset.popped = '1';
      const canvas = mountContainer.querySelector('#bathCanvas');
      if (canvas && typeof canvas.getBoundingClientRect === 'function' && typeof bubbleEl.getBoundingClientRect === 'function') {
        const cr = canvas.getBoundingClientRect();
        const br = bubbleEl.getBoundingClientRect();
        if (cr.width > 0 && cr.height > 0 && br.width > 0) {
          toastX = ((br.left + br.width / 2 - cr.left) / cr.width) * SVG_W;
          toastY = ((br.top + br.height / 2 - cr.top) / cr.height) * SVG_H;
        }
      }
      if (bubbleEl.dataset.removed !== '1') {
        bubbleEl.dataset.removed = '1';
        activeBubbleCount = Math.max(0, activeBubbleCount - 1);
        if (bubbleEl.parentNode) bubbleEl.parentNode.removeChild(bubbleEl);
      }
    }

    bathState.bubblesPopped++;
    if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.pop) {
      HMC.audio.SFX.pop();
    }
    const pal = getFlavorPalette();
    spawnSparkleStar(toastX, toastY, pal.sparkle);
    spawnStageToast('啵！', toastX, Math.max(22, toastY - 12), pal.sparkle);
    return true;
  }

  /* ========================================================================
     Interactive Rubber Ducky Easter Egg (Active at ANY Step!)
     ======================================================================== */

  function tapDucky() {
    if (!bathState) return;
    bathState.duckyQuacks++;
    if (HMC.audio && HMC.audio.SFX) {
      if (typeof HMC.audio.SFX.quack === 'function') HMC.audio.SFX.quack();
      else if (typeof HMC.audio.SFX.pop === 'function') HMC.audio.SFX.pop();
    }

    if (mountContainer) {
      const ducky = mountContainer.querySelector('#bathDucky');
      if (ducky) {
        ducky.classList.remove('ducky-bounce');
        void ducky.offsetWidth;
        ducky.classList.add('ducky-bounce');
        schedule(() => ducky.classList.remove('ducky-bounce'), 560);
      }
      spawnSparkleStar(94, 134, '#38B6FF');
      spawnSparkleStar(118, 136, '#74C0FC');
      spawnStageToast('嘎嘎！', 108, 114, '#F59F00');
    }
  }

  /* ========================================================================
     Step 1: Select Bubble Flavor & Pour Splash
     ======================================================================== */

  function selectFlavor(flavorId, opts = {}) {
    if (!bathState) return false;
    if (bathState.phase !== 'flavor') return false;
    const flavor = FLAVOR_BY_ID[flavorId];
    if (!flavor) return false;

    bathState.flavor = flavor;
    bathState.phase = 'pouring';
    syncHabitStepIndex();

    if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.bubble) {
      HMC.audio.SFX.bubble();
    }
    schedule(() => {
      if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.splash) {
        HMC.audio.SFX.splash();
      }
    }, 150);

    syncSceneVisuals();
    updateStepsAndDockUI();

    if (mountContainer) {
      const pourFx = mountContainer.querySelector('#bathPourFx');
      if (pourFx) {
        pourFx.setAttribute('opacity', '1');
        pourFx.classList.add('pouring-active');
      }
      spawnStageToast(`${flavor.icon} 倒泡泡啦！`, 246, 126, flavor.sparkle);
      for (let i = 0; i < 5; i++) {
        schedule(() => spawnFloatingBubble(165 + i * 24, 155), i * 85);
      }
    }

    if (HMC.audio && HMC.audio.setPrompt) {
      HMC.audio.setPrompt(flavor.pourZh, flavor.pourEn);
    }

    const enterScrub = () => {
      if (!bathState || bathState.phase !== 'pouring') return;
      if (mountContainer) {
        const pourFx = mountContainer.querySelector('#bathPourFx');
        if (pourFx) {
          pourFx.setAttribute('opacity', '0');
          pourFx.classList.remove('pouring-active');
        }
      }
      bathState.phase = 'scrub';
      syncHabitStepIndex();
      syncSceneVisuals();
      updateStepsAndDockUI();
    };

    if (opts.instant) {
      enterScrub();
    } else if (HMC.audio && typeof HMC.audio.waitForSpeechThen === 'function') {
      const token = mountToken;
      HMC.audio.waitForSpeechThen(
        800,
        enterScrub,
        () => token === mountToken && bathState && bathState.phase === 'pouring',
        6000
      );
    } else {
      schedule(enterScrub, 800);
    }
    return true;
  }

  /* ========================================================================
     Chick Reaction Helpers (Tickle, Rinse Scrunch, Fluff Sway, Shake-Off)
     ======================================================================== */

  function triggerTickleReaction() {
    if (!bathState || bathState.phase !== 'scrub') return;
    bathState.tickleCount++;
    setChickExpression('tickle');

    if (mountContainer) {
      const chick = mountContainer.querySelector('#bathChickGroup');
      if (chick) {
        chick.classList.add('chick-tickle-giggle');
      }
    }

    const now = Date.now();
    if (now - lastTickleToastTs > 1350) {
      lastTickleToastTs = now;
      if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.cheep) {
        HMC.audio.SFX.cheep();
      }
      spawnStageToast('哈哈哈好痒呀！', 214, 52, '#FF5C9D');
    }

    if (tickleResetTimer) clearTimeout(tickleResetTimer);
    const token = mountToken;
    tickleResetTimer = setTimeout(() => {
      tickleResetTimer = null;
      if (token !== mountToken || !bathState) return;
      if (mountContainer) {
        const chick = mountContainer.querySelector('#bathChickGroup');
        if (chick) chick.classList.remove('chick-tickle-giggle');
      }
      if (bathState.phase === 'scrub') {
        setChickExpression('muddy');
      }
    }, 880);
  }

  function triggerActiveFluffSway() {
    if (!mountContainer || !bathState || bathState.phase !== 'dry') return;
    const chick = mountContainer.querySelector('#bathChickGroup');
    if (chick) chick.classList.add('chick-fluff-sway');
    if (activeToolEffectTimer) clearTimeout(activeToolEffectTimer);
    const token = mountToken;
    activeToolEffectTimer = setTimeout(() => {
      activeToolEffectTimer = null;
      if (token !== mountToken || !mountContainer) return;
      const c = mountContainer.querySelector('#bathChickGroup');
      if (c) c.classList.remove('chick-fluff-sway');
    }, 320);
  }

  /* ========================================================================
     Core Tactile Mechanics: Scrub / Rinse / Dry in SVG Coordinates
     ======================================================================== */

  function scrubAtSvgPoint(svgX, svgY, deltaDist = 18, hitRadiusSvg = 42) {
    if (!bathState || bathState.phase !== 'scrub') return false;
    const distGain = Math.max(4, Math.min(60, deltaDist)) * 1.4;
    let touchedAny = false;
    let touchedTummy = false;
    let newlyCleanedSpot = null;

    bathState.spots.forEach(spot => {
      if (spot.scrubProgress >= 100) return;
      const d = Math.hypot(spot.x - svgX, spot.y - svgY);
      if (d <= hitRadiusSvg) {
        touchedAny = true;
        const before = spot.scrubProgress;
        spot.scrubProgress = Math.min(100, spot.scrubProgress + distGain);
        if (spot.isTickle) touchedTummy = true;
        if (before < 100 && spot.scrubProgress >= 100) {
          newlyCleanedSpot = spot;
        }
      }
    });

    if (!touchedAny) return false;

    const now = Date.now();
    if (now - lastBubbleSfxTs > 180) {
      lastBubbleSfxTs = now;
      if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.bubble) {
        HMC.audio.SFX.bubble();
      }
    }
    if (now - lastBubbleSpawnTs > 220) {
      lastBubbleSpawnTs = now;
      spawnFloatingBubble(svgX, svgY - 8);
    }

    if (touchedTummy) {
      triggerTickleReaction();
    }

    if (newlyCleanedSpot) {
      const pal = getFlavorPalette();
      if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.pop) {
        HMC.audio.SFX.pop();
      }
      spawnSparkleStar(newlyCleanedSpot.x, newlyCleanedSpot.y, pal.sparkle);
      spawnFloatingBubble(newlyCleanedSpot.x, newlyCleanedSpot.y - 10);
    }

    syncSceneVisuals();

    // Check if all 5 mud spots are 100% foamy clean!
    if (bathState.spots.every(s => s.scrubProgress >= 100)) {
      completeScrubPhase();
    }
    return true;
  }

  function completeScrubPhase(opts = {}) {
    if (!bathState || bathState.phase !== 'scrub' || bathState.scrubLocked) return;
    bathState.scrubLocked = true;
    stopDrag();

    bathState.spots.forEach(s => {
      s.scrubProgress = 100;
      s.foamLevel = 100;
    });

    if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.success) {
      HMC.audio.SFX.success();
    }
    spawnStageToast('🫧 泡泡满满啦！', 214, 48, getFlavorPalette().sparkle);
    for (let i = 0; i < 4; i++) {
      spawnFloatingBubble(150 + i * 40, 120);
    }

    if (HMC.audio && HMC.audio.setPrompt) {
      HMC.audio.setPrompt(
        '全身都是香香泡泡啦！现在抓起花洒冲干净吧！',
        'Covered in yummy bubbles! Grab the showerhead to rinse clean!'
      );
    }

    const enterRinse = () => {
      if (!bathState || bathState.phase !== 'scrub') return;
      bathState.phase = 'rinse';
      setChickExpression('rinse');
      syncHabitStepIndex();
      syncSceneVisuals();
      updateStepsAndDockUI();
    };

    if (opts.instant) {
      enterRinse();
    } else if (HMC.audio && typeof HMC.audio.waitForSpeechThen === 'function') {
      const token = mountToken;
      HMC.audio.waitForSpeechThen(
        800,
        enterRinse,
        () => token === mountToken && bathState && bathState.phase === 'scrub',
        6000
      );
    } else {
      schedule(enterRinse, 800);
    }
  }

  function rinseAtSvgPoint(svgX, svgY, deltaDist = 18, hitRadiusSvg = 44) {
    if (!bathState || bathState.phase !== 'rinse') return false;
    const rinseAmount = Math.max(7, Math.min(55, deltaDist) * 1.25);
    let hitAny = false;
    let newlyRinsedSpot = null;

    bathState.spots.forEach(spot => {
      if (spot.foamLevel <= 0) return;
      const directDist = Math.hypot(spot.x - svgX, spot.y - svgY);
      // Falling water column directly below showerhead hits foamy spots naturally!
      const inWaterColumn =
        Math.abs(spot.x - svgX) <= hitRadiusSvg * 1.1 &&
        spot.y >= svgY - 26 &&
        spot.y <= svgY + 140;

      if (directDist <= hitRadiusSvg || inWaterColumn) {
        hitAny = true;
        const before = spot.foamLevel;
        spot.foamLevel = Math.max(0, spot.foamLevel - rinseAmount);
        if (before > 0 && spot.foamLevel <= 0) {
          newlyRinsedSpot = spot;
        }
      }
    });

    if (!hitAny) return false;

    setChickExpression('rinse');

    const now = Date.now();
    if (now - lastRainSfxTs > 650) {
      lastRainSfxTs = now;
      if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.rain) {
        HMC.audio.SFX.rain();
      }
    }

    if (newlyRinsedSpot) {
      spawnSparkleStar(newlyRinsedSpot.x, newlyRinsedSpot.y, '#38B6FF');
    }

    syncSceneVisuals();

    if (bathState.spots.every(s => s.foamLevel <= 0)) {
      startShakeOffThenDry();
    }
    return true;
  }

  function startShakeOffThenDry(opts = {}) {
    if (!bathState || bathState.phase !== 'rinse') return;
    stopDrag();

    bathState.phase = 'shake';
    bathState.spots.forEach(s => {
      s.foamLevel = 0;
      s.wetLevel = 100;
    });
    setChickExpression('rinse');
    syncHabitStepIndex();
    syncSceneVisuals();
    updateStepsAndDockUI();

    if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.splash) {
      HMC.audio.SFX.splash();
    }
    spawnStageToast('哗啦啦，甩干水珠！', 214, 48, '#228BE6');

    if (mountContainer) {
      const chick = mountContainer.querySelector('#bathChickGroup');
      const spray = mountContainer.querySelector('#bathShakeSpray');
      if (chick) chick.classList.add('chick-shake-off');
      if (spray) spray.setAttribute('opacity', '1');
    }

    const enterDry = () => {
      if (!bathState || bathState.phase !== 'shake') return;
      if (mountContainer) {
        const chick = mountContainer.querySelector('#bathChickGroup');
        const spray = mountContainer.querySelector('#bathShakeSpray');
        if (chick) chick.classList.remove('chick-shake-off');
        if (spray) spray.setAttribute('opacity', '0');
      }
      bathState.phase = 'dry';
      setChickExpression('fluff');
      syncHabitStepIndex();
      syncSceneVisuals();
      updateStepsAndDockUI();

      if (HMC.audio && HMC.audio.setPrompt) {
        HMC.audio.setPrompt(
          '哗啦啦甩干水珠！快拖起吹风机把毛毛吹蓬松吧！',
          'Shake shake! Now grab the warm hairdryer to fluff dry!'
        );
      }
    };

    if (opts.instant) {
      enterDry();
    } else if (HMC.audio && typeof HMC.audio.waitForSpeechThen === 'function') {
      const token = mountToken;
      HMC.audio.waitForSpeechThen(
        800,
        enterDry,
        () => token === mountToken && bathState && bathState.phase === 'shake',
        6000
      );
    } else {
      schedule(enterDry, 800);
    }
  }

  function dryAtSvgPoint(svgX, svgY, deltaDist = 18, hitRadiusSvg = 56) {
    if (!bathState || bathState.phase !== 'dry') return false;
    const dryAmount = Math.max(7, Math.min(55, deltaDist) * 1.25);
    let hitAny = false;
    let newlyDriedSpot = null;

    // Hairdryer aims warm breeze toward chick center (214, 118)
    const dirX = svgX >= 214 ? -1 : 1;

    bathState.spots.forEach(spot => {
      if (spot.wetLevel <= 0) return;
      const d = Math.hypot(spot.x - svgX, spot.y - svgY);
      const inBreezeCone =
        ((spot.x - svgX) * dirX >= -18 && (spot.x - svgX) * dirX <= 130) &&
        Math.abs(spot.y - svgY) <= 58;

      if (d <= hitRadiusSvg || inBreezeCone) {
        hitAny = true;
        const before = spot.wetLevel;
        spot.wetLevel = Math.max(0, spot.wetLevel - dryAmount);
        if (before > 0 && spot.wetLevel <= 0) {
          newlyDriedSpot = spot;
        }
      }
    });

    if (!hitAny) return false;

    setChickExpression('fluff');
    triggerActiveFluffSway();

    const now = Date.now();
    if (now - lastBlowSfxTs > 390) {
      lastBlowSfxTs = now;
      if (HMC.audio && HMC.audio.SFX && typeof HMC.audio.SFX.blow === 'function') {
        HMC.audio.SFX.blow();
      }
    }
    if (now - lastSparkleTs > 260) {
      lastSparkleTs = now;
      spawnSparkleStar(214 + (Math.random() * 88 - 44), 95 + (Math.random() * 64 - 28), '#FFB703');
    }

    if (newlyDriedSpot) {
      spawnSparkleStar(newlyDriedSpot.x, newlyDriedSpot.y, '#FFA94D');
      if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.pop) {
        HMC.audio.SFX.pop();
      }
    }

    syncSceneVisuals();

    if (bathState.spots.every(s => s.wetLevel <= 0)) {
      completeBathCelebration();
    }
    return true;
  }

  function completeBathCelebration() {
    if (!bathState || bathState.completed) return;
    stopDrag();

    bathState.completed = true;
    bathState.phase = 'done';
    bathState.spots.forEach(s => {
      s.scrubProgress = 100;
      s.foamLevel = 0;
      s.wetLevel = 0;
    });
    setChickExpression('done');
    syncHabitStepIndex();
    syncSceneVisuals();
    updateStepsAndDockUI();

    if (mountContainer) {
      const chick = mountContainer.querySelector('#bathChickGroup');
      if (chick) {
        chick.classList.remove('chick-fluff-sway', 'chick-tickle-giggle', 'chick-shake-off');
        chick.classList.add('chick-happy-bounce');
      }
      const ducky = mountContainer.querySelector('#bathDucky');
      if (ducky) {
        ducky.classList.remove('ducky-bounce');
        void ducky.offsetWidth;
        ducky.classList.add('ducky-bounce');
      }
      spawnStageToast('✨ 香喷喷蓬松啦！', 214, 42, '#FF5C9D');
    }

    if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.fanfare) {
      HMC.audio.SFX.fanfare();
    }
    if (HMC.effects && HMC.effects.burstConfetti) {
      HMC.effects.burstConfetti(42);
    }
    const isParty = (HMC.effects && HMC.effects.awardStar) ? HMC.effects.awardStar() : false;
    if (HMC.storage && HMC.storage.recordAttempt) {

  /* ========================================================================

  /* ========================================================================
     Pointer Events Smooth Drag Engine (Touch + Mouse + Continuous Pour/Blow)
     ======================================================================== */

  function getToolCursorEl() {
    return mountContainer ? mountContainer.querySelector('#bathDragCursor') : null;
  }

  function screenToCanvasSvg(clientX, clientY) {
    if (!mountContainer) return null;
    const canvas = mountContainer.querySelector('#bathCanvas');
    if (!canvas || typeof canvas.getBoundingClientRect !== 'function') return null;
    const rect = canvas.getBoundingClientRect();
    if (!rect || rect.width <= 0 || rect.height <= 0) return null;

    // Slight upward offset on touch so little fingers never obscure the tool tip!
    const touchOffsetY = dragPointerType === 'touch' ? -28 : 0;
    const tipClientX = clientX;
    const tipClientY = clientY + touchOffsetY;

    const svgX = ((tipClientX - rect.left) / rect.width) * SVG_W;
    const svgY = ((tipClientY - rect.top) / rect.height) * SVG_H;
    const inside =
      svgX >= -24 && svgX <= SVG_W + 24 &&
      svgY >= -24 && svgY <= SVG_H + 24;
    // Generous >= 36px screen hit radius mapped into SVG space
    const hitRadiusSvg = Math.max(38, 36 * (SVG_W / rect.width));

    return { svgX, svgY, tipClientX, tipClientY, inside, hitRadiusSvg, scaleX: SVG_W / rect.width };
  }

  function updateDragCursorVisual(clientX, clientY, isOverCanvas, svgX) {
    const cursor = getToolCursorEl();
    if (!cursor) return;
    const touchOffsetY = dragPointerType === 'touch' ? -28 : 0;
    const x = clientX;
    const y = clientY + touchOffsetY;

    cursor.style.left = `${x}px`;
    cursor.style.top = `${y}px`;
    cursor.classList.toggle('active-effect', !!isOverCanvas);

    if (dragTool === 'dryer') {
      // Auto-flip hairdryer so nozzle & warm golden breeze always aim toward the chick!
      const faceRight = typeof svgX === 'number' && svgX < 214;
      cursor.classList.toggle('face-right', faceRight);
    }
  }

  function renderDragCursorContent(tool) {
    const cursor = getToolCursorEl();
    if (!cursor) return;
    cursor.className = `bath-drag-cursor visible tool-${tool}`;
    if (tool === 'sponge') {
      cursor.innerHTML = `<div class="bath-cursor-tool">${renderSpongeSVG(64)}</div>`;
    } else if (tool === 'shower') {
      cursor.innerHTML = `
        <div class="bath-cursor-tool">${renderShowerheadSVG(64)}</div>
        <div class="bath-water-streams" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      `;
    } else if (tool === 'dryer') {
      cursor.innerHTML = `
        <div class="bath-cursor-tool">${renderHairdryerSVG(68)}</div>
        <div class="bath-wind-streams" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
      `;
    }
  }

      lastRafTs = now;

        const pt = screenToCanvasSvg(dragCurX, dragCurY);

    dragLastY = e.clientY;

    dragCurY = e.clientY;

    dragStartX = e ? e.clientX : 0;

    dragCurY = dragStartY;

    if (!dragFromStageSpot) {
      const handle = mountContainer.querySelector('#bathToolHandle');
      if (handle) {

    dragMoved = false;

    window.removeEventListener('pointerup', onGlobalPointerUp);
    window.removeEventListener('pointercancel', onGlobalPointerUp);

    if (mountContainer) {
      const handle = mountContainer.querySelector('#bathToolHandle');
      if (handle) {
        handle.classList.remove('is-dragging');
        if (prevPointerId != null && handle.releasePointerCapture) {
          try { handle.releasePointerCapture(prevPointerId); } catch (err) {}
        }
      }
      const cursor = getToolCursorEl();
      if (cursor) {
        cursor.className = 'bath-drag-cursor';
        cursor.innerHTML = '';
      }
    }

  /* ========================================================================
     UI Renderers: Steps Bar, Tool Dock & Live Visual Sync
     ======================================================================== */

  function renderStepsBarHTML() {
    const activeIdx = getActiveStepIndex();
    return STEPS.map((s, idx) => {
      const done = idx < activeIdx;
      const active = idx === activeIdx;
      const cls = done ? 'done' : (active ? 'active' : 'upcoming');
      return `
        <span class="bath-step-pill bed-step-pill ${cls}" data-step-id="${s.id}">
          <span class="bath-step-num">${done ? '✓' : s.num}</span>
          <span class="bath-step-label">${s.zh}</span>
        </span>
      `;
    }).join('<span class="bath-step-arrow" aria-hidden="true">›</span>');
  }

  function countDefeatedGerms() {
    if (!bedState) return 0;
    return bedState.germs.filter(g => g.defeated).length;
  }

  function renderToolDockHTML() {
    const p = bedState.phase;
    const f = getFlavor();

    // Step 1: Flavor selector + squeeze toothpaste handle
    if (p === 'paste') {
      const pct = Math.round(bedState.pastePct);
      return `
        <div class="bed-paste-dock">
          <div class="bed-flavor-row" id="bedFlavorRow">
            ${FLAVORS.map(item => `
              <button
                class="bed-flavor-pill ${f.id === item.id ? 'selected' : ''}"
                type="button"
                data-flavor-id="${item.id}"
                style="--bf-paste:${item.paste};--bf-foam:${item.foam};--bf-dark:${item.dark};"
              >
                <span class="bed-flavor-emoji">${item.icon}</span>
                <span class="bed-flavor-label">${item.zh}</span>
              </button>
            `).join('')}
          </div>
          <div class="bed-paste-action-row">
            <div
              class="bath-tool-handle bed-tool-paste ${pct < 100 ? 'hint-glow' : ''}"
              id="bedToolHandle"
              data-tool="tube"
              role="button"
              tabindex="0"
              style="--bf-paste:${f.paste};--bf-foam:${f.foam};--bf-dark:${f.dark};"
              aria-label="拖动牙膏或点一点挤到牙刷上"
            >
              <span class="bath-tool-svg">${renderTubeSVG(f, 44)}</span>
              <span class="bath-tool-badge">🧴 挤牙膏</span>
            </div>
            <div class="bath-tool-guide bed-paste-guide">
              <div class="bath-guide-hint">
                <span class="bath-hint-arrow" aria-hidden="true">👉</span>
                <span>向右拖牙膏，挤在牙刷上！</span>
              </div>
              <div class="bed-meter-wrap">
                <div class="bed-meter-track">
                  <div class="bed-meter-fill" id="bedPasteMeterFill" style="width:${pct}%;background:${f.paste};"></div>
                </div>
                <span class="bath-progress-count" id="bedPastePctLabel">${pct}%</span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // Step 2a: Brush 6 germs away with loaded toothbrush
    if (p === 'brush') {
      const defeated = countDefeatedGerms();
      const total = bedState.germs.length;
      return `
        <div class="bath-draggable-dock">
          <div
            class="bath-tool-handle bed-tool-brush hint-glow"
            id="bedToolHandle"
            data-tool="toothbrush"
            role="button"
            tabindex="0"
            aria-label="抓住牙刷来回刷打跑蛀牙怪兽"
          >
            <span class="bath-tool-svg">${renderLoadedToothbrushSVG(f, 62)}</span>
            <span class="bath-tool-badge">🪥 抓牙刷</span>
          </div>
          <div class="bath-tool-guide">
            <div class="bath-guide-hint">
              <span class="bath-hint-arrow" aria-hidden="true">🪥</span>
              <span>抓住牙刷来回刷，打跑蛀牙小怪兽！</span>
            </div>
            <div class="bath-progress-pills">
              <span class="bath-progress-label">打跑怪兽</span>
              <span class="bath-progress-count" id="bedProgressCount">${defeated}/${total}</span>
            </div>
          </div>
        </div>
      `;
    }

    // Step 2b: Gargle with draggable water cup
    if (p === 'gargle') {
      const text = bedState.gargling ? '咕噜咕噜～噗！冲干净啦！' : '拖起小水杯到嘴巴上，咕噜咕噜漱口！';
      return `
        <div class="bath-draggable-dock">
          <div
            class="bath-tool-handle bath-tool-shower ${bedState.gargling ? 'tool-resting' : 'hint-glow'}"
            id="bedToolHandle"
            data-tool="cup"
            role="button"
            tabindex="0"
            aria-label="拖水杯漱口"
          >
            <span class="bath-tool-svg">${renderWaterCupSVG(48)}</span>
            <span class="bath-tool-badge">🥤 拖水杯漱口</span>
          </div>
          <div class="bath-tool-guide">
            <div class="bath-guide-hint">
              <span class="bath-hint-arrow" aria-hidden="true">💦</span>
              <span>${text}</span>
            </div>
            <div class="bath-progress-pills">
              <span class="bath-progress-label">咕噜漱口</span>
              <span class="bath-progress-count">${bedState.rinsedClean ? '✨ 亮晶晶' : '💧 待冲洗'}</span>
            </div>
          </div>
        </div>
      `;
    }

    // Step 3a: Choose/drag a bedtime plushie into chick's arms
    if (p === 'plushie') {
      return `
        <div class="bed-plushie-dock">
          <div class="bed-plushie-grid" id="bedPlushieGrid">
            ${PLUSHIES.map(item => `
              <div
                class="bed-plushie-card"
                data-plushie-id="${item.id}"
                role="button"
                tabindex="0"
                style="--pl-bg:${item.bg};--pl-border:${item.dark};"
                aria-label="拖动或点选${item.zh}陪睡"
              >
                <span class="bed-plushie-svg">${renderPlushieSVG(item, 46)}</span>
                <span class="bed-plushie-name">${item.icon} ${item.zh}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Step 3b: Pull the starry quilt UP from bottom of bed
    if (p === 'quilt') {
      const pct = Math.round(bedState.quiltPct);
      return `
        <div class="bed-action-guide-dock">
          <button class="bed-assist-pill-btn hint-glow" id="bedQuiltAssistBtn" type="button">
            ⬆️ 往上拉盖好被子
          </button>
          <div class="bath-tool-guide">
            <div class="bath-guide-hint">
              <span class="bath-hint-arrow" aria-hidden="true">🛏️</span>
              <span>抓住床尾小被子，亲手往上拉到下巴哦！</span>
            </div>
            <div class="bed-meter-wrap">
              <div class="bed-meter-track">
                <div class="bed-meter-fill" id="bedQuiltMeterFill" style="width:${pct}%;background:#FF85C0;"></div>
              </div>
              <span class="bath-progress-count" id="bedQuiltPctLabel">${pct}%</span>
            </div>
          </div>
        </div>
      `;
    }

    // Step 4: Pull the golden star lamp cord DOWN to switch off light
    if (p === 'lamp') {
      return `
        <div class="bed-action-guide-dock">
          <button class="bed-assist-pill-btn bed-lamp-assist-btn hint-glow" id="bedLampAssistBtn" type="button">
            ⬇️ 往下拉灯绳关灯
          </button>
          <div class="bath-tool-guide">
            <div class="bath-guide-hint">
              <span class="bath-hint-arrow" aria-hidden="true">🌟</span>
              <span>拉住右上角星星灯绳，往下拉“咔哒”关灯吧！</span>
            </div>
            <div class="bath-progress-pills">
              <span class="bath-progress-label">晚安最后一步</span>
              <span class="bath-progress-count">💡 亮着</span>
            </div>
          </div>
        </div>
      `;
    }

    // Done celebration actions!
    const buddyText = bedState.plushie ? `抱着${bedState.plushie.zh}` : '';
    return `
      <div class="bath-done-dock">
        <div class="bath-done-banner bed-done-banner">🌙 牙齿亮晶晶，${buddyText}盖好被子晚安好梦！</div>
        <div class="bath-done-actions">
          <button class="bath-action-btn bath-replay-btn" id="bedReplayBtn" type="button">
            🔄 再玩一次
          </button>
          <button class="bath-action-btn bath-next-story-btn" id="bedToBathBtn" type="button">
            🛁 去洗泡泡澡
          </button>
        </div>
      </div>
    `;
  }

  function updateStepsAndDockUI() {
    if (!mountContainer || !bedState) return;
    const stepsEl = mountContainer.querySelector('#bedStepsBar');
    if (stepsEl) stepsEl.innerHTML = renderStepsBarHTML();

    const dockEl = mountContainer.querySelector('#bedToolDock');
    if (dockEl) {
      dockEl.innerHTML = renderToolDockHTML();
      bindDockEvents();
    }
  }

  /* ========================================================================
     Scene Switching & Live Visual Sync

  function renderCanvasSceneHTML() {
    if (!bedState) return '';
    if (bedState.scene === 'paste') {
      return `
        ${renderPasteSceneSVG()}
        <div class="bed-fx-layer" id="bedFxLayer" aria-hidden="true"></div>
      `;
    }
    if (bedState.scene === 'mouth') {
      return `
        ${renderMouthSceneSVG()}
        <div class="bed-fx-layer" id="bedFxLayer" aria-hidden="true"></div>
      `;
    }
    // Bedroom scene with aligned starry quilt overlay, star pull-cord overlay, and floating Zzz!
    const isNight = !!bedState.lampOff;
    const showQuiltHandle = bedState.phase === 'quilt' && !bedState.quiltLocked;
    const showLampCue = bedState.phase === 'lamp' && !bedState.lampOff;
    const quiltHeightPct = (15 + (bedState.quiltPct / 100) * 20.8).toFixed(1);

    return `
      ${renderBedroomSceneSVG()}

      <!-- Interactive Pink Starry Quilt Overlay (#bedQuiltOverlay) aligned squarely to the crib -->
      <div
        class="bed-quilt-overlay ${bedState.phase === 'plushie' ? 'quilt-tucked-low' : ''} ${bedState.quiltLocked ? 'quilt-snug' : ''}"
        id="bedQuiltOverlay"
        style="height:${quiltHeightPct}%;"
      >
        <div class="bed-quilt-hem" aria-hidden="true"></div>
        <div class="bed-quilt-stars" aria-hidden="true">
          <span>⭐</span><span>✨</span><span>🌙</span><span>⭐</span><span>✨</span>

          type="button"
          aria-label="抓住被角往上拉盖好被子"
        >
          <span class="bed-quilt-arrows" aria-hidden="true">⬆️</span>
          <span>往上拉盖好被子</span>
          <span class="bed-quilt-arrows" aria-hidden="true">⬆️</span>
        </button>
      </div>

      <!-- Interactive Golden Star Lamp Pull-Cord Handle (#bedLampCord) -->
      <div
        class="bed-lamp-cord ${showLampCue ? 'cord-active' : ''} ${isNight ? 'cord-off' : ''}"
        id="bedLampCord"
        role="button"
        tabindex="0"

      >
        <div class="bed-lamp-cord-hit">

      <!-- Floating Dreamy Zzz... when Chick Sleeps -->
      <div class="bed-zzz-layer ${isNight ? 'visible' : ''}" id="bedZzzLayer" aria-hidden="true">

        <span class="bed-zzz z2">z</span>
        <span class="bed-zzz z3">z...</span>

  function mountCurrentScene() {
    if (!mountContainer || !bedState) return;
    const canvas = mountContainer.querySelector('#bedCanvas');
    if (!canvas) return;
    canvas.classList.toggle('night-mode', !!bedState.lampOff);
    canvas.classList.toggle('bed-done-state', bedState.phase === 'done');
    canvas.innerHTML = renderCanvasSceneHTML();
    bindCanvasSceneEvents();
    syncSceneVisuals();
  }

  function syncSceneVisuals() {
    if (!mountContainer || !bedState) return;
    const f = getFlavor();
    const canvas = mountContainer.querySelector('#bedCanvas');
    if (canvas) {
      canvas.classList.toggle('night-mode', !!bedState.lampOff);
      canvas.classList.toggle('bed-done-state', bedState.phase === 'done');
    }

    if (bedState.scene === 'paste') {
      const pct = Math.max(0, Math.min(100, bedState.pastePct));
      const clipRect = mountContainer.querySelector('#bedPasteClipRect');
      if (clipRect) clipRect.setAttribute('width', String(Math.round((pct / 100) * 140)));

      const ribbonFill = mountContainer.querySelector('#bedPasteRibbonFill');
      if (ribbonFill) {
        ribbonFill.setAttribute('fill', f.paste);
        ribbonFill.setAttribute('stroke', f.dark);
      }

      const tube = mountContainer.querySelector('#bedTube');
      if (tube) {
        const tubeX = Math.round(92 + (pct / 100) * 124);
        const tubeY = pct > 0 && pct < 100 ? 116 : 108;
        tube.setAttribute('transform', `translate(${tubeX}, ${tubeY}) rotate(-34)`);
        tube.classList.toggle('tube-done', pct >= 100);
      }
      const tubeBody = mountContainer.querySelector('#bedTubeBody');
      if (tubeBody) tubeBody.setAttribute('fill', f.paste);
      const tubeStripe = mountContainer.querySelector('#bedTubeStripe');
      if (tubeStripe) tubeStripe.setAttribute('fill', f.stripe);
      const tubeTail = mountContainer.querySelector('#bedTubeTail');
      if (tubeTail) tubeTail.setAttribute('fill', f.dark);
      const tubeDrop = mountContainer.querySelector('#bedTubeDrop');
      if (tubeDrop) {
        tubeDrop.setAttribute('fill', f.paste);
        tubeDrop.setAttribute('stroke', f.dark);
      }
      const tubeIcon = mountContainer.querySelector('#bedTubeIcon');
      if (tubeIcon) tubeIcon.textContent = f.icon;

      const guide = mountContainer.querySelector('#bedPasteGuide');
      if (guide) guide.setAttribute('opacity', pct >= 100 ? '0' : '0.85');

      const meterFill = mountContainer.querySelector('#bedPasteMeterFill');
      if (meterFill) {
        meterFill.style.width = `${Math.round(pct)}%`;
        meterFill.style.background = f.paste;
      }
      const pctLabel = mountContainer.querySelector('#bedPastePctLabel');
      if (pctLabel) pctLabel.textContent = `${Math.round(pct)}%`;
      return;
    }

    if (bedState.scene === 'mouth') {
      bedState.germs.forEach(germ => {
        const gEl = mountContainer.querySelector(`.bed-germ[data-germ-id="${germ.id}"]`);
        if (gEl) {
          const mover = gEl.querySelector('.germ-mover');
          const foamEl = gEl.querySelector('.germ-foam');

          if (germ.defeated) {
            gEl.classList.add('germ-defeated');
          } else {
            gEl.classList.remove('germ-defeated');
            if (mover) {
              const shrink = Math.max(0.45, 1 - (germ.cleanProgress / 100) * 0.45);
              mover.setAttribute('transform', `scale(${shrink.toFixed(2)})`);
            }
          }

          if (foamEl) {
            const showFoam = !bedState.rinsedClean && germ.cleanProgress > 0;
            const foamOp = showFoam ? Math.min(0.96, 0.25 + (germ.cleanProgress / 100) * 0.75) : 0;
            const foamSc = showFoam ? (0.35 + (germ.cleanProgress / 100) * 0.72) : 0.2;
            foamEl.setAttribute('opacity', foamOp.toFixed(2));
            foamEl.setAttribute('transform', `scale(${foamSc.toFixed(2)})`);
          }
        }

        // Permanent bright sparkle on every defeated tooth!
        const sp = mountContainer.querySelector(`#toothSparkle-${germ.toothId}`);
        if (sp) {
          sp.setAttribute('opacity', (germ.defeated || bedState.rinsedClean) ? '1' : '0');
        }
      });

      // After rinse, ALL 8 teeth dazzle bright!
      TEETH.forEach(t => {
        const sp = mountContainer.querySelector(`#toothSparkle-${t.id}`);
        if (sp && bedState.rinsedClean) {
          sp.setAttribute('opacity', '1');
        }
      });

      // Cheerful foam layer during gargle phase (until rinsed clean)
      const mouthFoam = mountContainer.querySelector('#bedMouthFoam');
      if (mouthFoam) {
        const showMouthFoam = bedState.phase === 'gargle' && !bedState.rinsedClean;
        mouthFoam.setAttribute('opacity', showMouthFoam ? '0.94' : '0');
      }

      const gargleFx = mountContainer.querySelector('#bedGargleFx');
      if (gargleFx) {
        gargleFx.setAttribute('opacity', bedState.gargling ? '1' : '0');
        gargleFx.classList.toggle('gargle-active', !!bedState.gargling);
      }

      const eyesNormal = mountContainer.querySelector('#bedMouthEyesNormal');
      const eyesHappy = mountContainer.querySelector('#bedMouthEyesHappy');
      const happyEyes = bedState.rinsedClean || bedState.gargling;
      if (eyesNormal) eyesNormal.style.display = happyEyes ? 'none' : '';
      if (eyesHappy) eyesHappy.style.display = happyEyes ? '' : 'none';

      const mouthHit = mountContainer.querySelector('#bedMouthHit');
      if (mouthHit) {
        mouthHit.style.pointerEvents = (bedState.phase === 'gargle' && !bedState.gargling) ? 'auto' : 'none';
      }

      const countEl = mountContainer.querySelector('#bedProgressCount');
      if (countEl) {
        countEl.textContent = `${countDefeatedGerms()}/${bedState.germs.length}`;
      }
      return;
    }

    if (bedState.scene === 'bedroom') {
      const isNight = !!bedState.lampOff;
      mountContainer.querySelectorAll('.bed-night-layer').forEach(el => {
        el.setAttribute('opacity', isNight ? (el.tagName === 'rect' && el.getAttribute('y') === '216' ? '0.84' : '1') : '0');
      });
      mountContainer.querySelectorAll('.bed-day-layer').forEach(el => {
        el.setAttribute('opacity', isNight ? '0' : '1');
      });
      const winStars = mountContainer.querySelector('.bed-window-stars');
      if (winStars) winStars.setAttribute('opacity', isNight ? '1' : '0.35');
      const nightSparkles = mountContainer.querySelector('.bed-night-sparkles');
      if (nightSparkles) nightSparkles.setAttribute('opacity', isNight ? '1' : '0');

      const lampShade = mountContainer.querySelector('#bedLampShade');
      if (lampShade) lampShade.setAttribute('fill', isNight ? '#4C5696' : '#FFE066');

      // Bedroom chick expression
      mountContainer.querySelectorAll('.bed-chick-expr').forEach(el => {
        el.style.display = el.classList.contains(`expr-${bedState.chickBedroomExpr}`) ? '' : 'none';
      });
      const chickActor = mountContainer.querySelector('#bedChickActor');
      if (chickActor) {
        chickActor.classList.toggle('chick-sleeping', isNight);
      }

      // Plushie slot inside chick's arms
      const plushSlot = mountContainer.querySelector('#bedChickPlushieSlot');
      if (plushSlot) {
        const currentId = plushSlot.dataset.plushieId || '';
        const nextId = bedState.plushie ? bedState.plushie.id : '';
        if (currentId !== nextId) {
          plushSlot.dataset.plushieId = nextId;
          plushSlot.innerHTML = renderBedroomPlushieInline(bedState.plushie);
        }
      }

      // Starry quilt live height
      const quiltEl = mountContainer.querySelector('#bedQuiltOverlay');
      if (quiltEl) {
        const hPct = 15 + (Math.max(0, Math.min(100, bedState.quiltPct)) / 100) * 20.8;
        quiltEl.style.height = `${hPct.toFixed(1)}%`;
        quiltEl.classList.toggle('quilt-tucked-low', bedState.phase === 'plushie');
        quiltEl.classList.toggle('quilt-snug', !!bedState.quiltLocked);
      }
      const quiltHandle = mountContainer.querySelector('#bedQuiltHandle');
      if (quiltHandle) {
        quiltHandle.classList.toggle('visible', bedState.phase === 'quilt' && !bedState.quiltLocked);
      }
      const quiltMeter = mountContainer.querySelector('#bedQuiltMeterFill');
      if (quiltMeter) quiltMeter.style.width = `${Math.round(bedState.quiltPct)}%`;
      const quiltLabel = mountContainer.querySelector('#bedQuiltPctLabel');
      if (quiltLabel) quiltLabel.textContent = `${Math.round(bedState.quiltPct)}%`;

      // Lamp cord stretch sync
      const pull = Math.max(0, Math.min(40, bedState.lampPullPx));
      const cordEndY = 114 + pull;
      const cordLine = mountContainer.querySelector('#bedLampCordLine');
      if (cordLine) {
        cordLine.setAttribute('y2', String(cordEndY));
        cordLine.setAttribute('stroke', isNight ? '#B197FC' : '#D9820B');
      }
      const cordStar = mountContainer.querySelector('#bedLampCordStar');
      if (cordStar) {
        cordStar.setAttribute('transform', `translate(364, ${cordEndY + 8})`);
      }
      const cordOverlay = mountContainer.querySelector('#bedLampCord');
      if (cordOverlay) {
        cordOverlay.style.setProperty('--cord-pull', `${pull}px`);
        cordOverlay.classList.toggle('cord-active', bedState.phase === 'lamp' && !isNight);
        cordOverlay.classList.toggle('cord-off', isNight);
        const cue = cordOverlay.querySelector('.bed-lamp-cue-badge');
        if (cue) cue.classList.toggle('visible', bedState.phase === 'lamp' && !isNight);
      }

      const zzzLayer = mountContainer.querySelector('#bedZzzLayer');
      if (zzzLayer) zzzLayer.classList.toggle('visible', isNight);
    }
  }

  /* ========================================================================
     Micro-FX Helpers (Stage Toasts, Sparkles, Hearts, Zip Brush Assist)
     ======================================================================== */

  function svgToPercent(svgX, svgY) {
    return {
      leftPct: Math.max(8, Math.min(92, (svgX / SVG_W) * 100)),
      topPct: Math.max(10, Math.min(88, (svgY / SVG_H) * 100))
    };
  }

  function spawnStageToast(text, svgX, svgY, color = '#FF5C9D') {
    if (!mountContainer) return;
    const fx = mountContainer.querySelector('#bedFxLayer');
    if (!fx) return;
    const { leftPct, topPct } = svgToPercent(svgX, svgY);
    const el = document.createElement('div');
    el.className = 'bath-micro-toast';
    el.textContent = text;
    el.style.left = `${leftPct}%`;
    el.style.top = `${topPct}%`;
    el.style.color = color;
    fx.appendChild(el);
    schedule(() => {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 980);
  }

  function spawnStagePop(emoji, svgX, svgY, color = '#FFB703') {
    if (!mountContainer) return;
    const fx = mountContainer.querySelector('#bedFxLayer');
    if (!fx) return;
    const { leftPct, topPct } = svgToPercent(svgX, svgY);
    const el = document.createElement('span');
    el.className = 'bath-sparkle-pop';
    el.textContent = emoji;
    el.style.left = `${leftPct}%`;
    el.style.top = `${topPct}%`;
    el.style.color = color;
    fx.appendChild(el);
    schedule(() => {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 700);
  }

  function showBriefZipBrush(germ) {
    if (!mountContainer || !germ) return;
    const fx = mountContainer.querySelector('#bedFxLayer');
    if (!fx) return;
    const { leftPct, topPct } = svgToPercent(germ.x + 14, germ.y);
    const el = document.createElement('div');
    el.className = 'bath-zip-tool bed-zip-brush';
    el.style.left = `${leftPct}%`;
    el.style.top = `${topPct}%`;
    el.innerHTML = renderLoadedToothbrushSVG(getFlavor(), 58);
    fx.appendChild(el);
    schedule(() => {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 360);
  }

  /* ========================================================================
     Step 1 Mechanics: Flavor Selection & Toothpaste Squeeze (0% -> 100%)
     ======================================================================== */

  function selectFlavor(flavorId) {
    if (!bedState || bedState.phase !== 'paste' || bedState.pasteLocked) return false;
    const f = FLAVOR_BY_ID[flavorId];
    if (!f) return false;
    bedState.flavor = f;
    if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.pop) {
      HMC.audio.SFX.pop();
    }
    syncSceneVisuals();
    updateStepsAndDockUI();
    spawnStageToast(`${f.icon} ${f.zh}！`, 210, 88, f.dark);
    return true;
  }

  function squeezePaste(deltaPct, opts = {}) {
    if (!bedState || bedState.phase !== 'paste' || bedState.pasteLocked) return false;
    const gain = Math.max(0, Number(deltaPct) || 0);
    if (gain <= 0) return false;

    const prev = bedState.pastePct;
    bedState.pastePct = Math.min(100, prev + gain);
    const f = getFlavor();

    const now = Date.now();
    if (opts.forceSfx || now - lastBubbleSfxTs > 180) {
      lastBubbleSfxTs = now;
      if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.bubble) {
        HMC.audio.SFX.bubble();
      }
    }

    if (now - lastFoamFxTs > 220) {
      lastFoamFxTs = now;
      const fxX = 94 + (bedState.pastePct / 100) * 120;
      spawnStagePop('✨', fxX, 126, f.paste);
    }

    syncSceneVisuals();

    if (bedState.pastePct >= 100) {
      completePasteStep(opts);
    }
    return true;
  }

  function completePasteStep(opts = {}) {
    if (!bedState || bedState.phase !== 'paste' || bedState.pasteLocked) return;
    stopActiveDrag();
    bedState.pastePct = 100;
    bedState.pasteLocked = true;
    syncSceneVisuals();

    const f = getFlavor();
    if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.success) {
      HMC.audio.SFX.success();
    }
    spawnStageToast('✨ 牙膏挤好啦！', 180, 96, f.dark);
    if (HMC.audio && HMC.audio.setPrompt) {
      HMC.audio.setPrompt(
        '牙膏挤好啦！张大嘴巴，打跑蛀牙小怪兽！',
        'Toothpaste ready! Open wide and brush away the sugar bugs!'
      );
    }

    const enterBrush = () => {
      if (!bedState || bedState.phase !== 'paste') return;
      bedState.phase = 'brush';
      bedState.scene = 'mouth';
      syncHabitStepIndex();
      mountCurrentScene();
      updateStepsAndDockUI();
    };

    if (opts.instant) {
      enterBrush();
    } else if (HMC.audio && typeof HMC.audio.waitForSpeechThen === 'function') {
      const token = mountToken;
      HMC.audio.waitForSpeechThen(
        800,
        enterBrush,
        () => token === mountToken && bedState && bedState.phase === 'paste',
        6000
      );
    } else {
      schedule(enterBrush, 800);
    }
  }

  /* ========================================================================
     Step 2 Mechanics: Brush 6 Candy/Germ Monsters + Mini-Step 2b Gargle
     ======================================================================== */

  function defeatGerm(germ) {
    if (!germ || germ.defeated) return;
    germ.cleanProgress = 100;
    germ.defeated = true;

    if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.pop) {
      HMC.audio.SFX.pop();
    }
    if (mountContainer) {
      const gEl = mountContainer.querySelector(`.bed-germ[data-germ-id="${germ.id}"]`);
      if (gEl) gEl.classList.add('germ-fly-off');
    }
    spawnStagePop('✨', germ.x, germ.y, '#FFB703');
    spawnStageToast(germ.quote, germ.x, Math.max(30, germ.y - 22), germ.dark);
  }

  function brushAtSvgPoint(svgX, svgY, deltaDist = 18, hitRadiusSvg = 40, opts = {}) {
    if (!bedState || bedState.phase !== 'brush') return false;
    const gain = Math.max(5, Math.min(58, deltaDist)) * 1.45;
    let touchedAny = false;
    const f = getFlavor();

    bedState.germs.forEach(germ => {
      if (germ.defeated) return;
      const d = Math.hypot(germ.x - svgX, germ.y - svgY);
      if (d <= hitRadiusSvg) {
        touchedAny = true;
        germ.cleanProgress = Math.min(100, germ.cleanProgress + gain);
        if (germ.cleanProgress >= 100) {
          defeatGerm(germ);
        }
      }
    });

    if (!touchedAny) return false;

    const now = Date.now();
    if (now - lastBrushSfxTs > 220) {
      lastBrushSfxTs = now;
      if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.brush) {
        HMC.audio.SFX.brush();
      }
    }
    if (now - lastFoamFxTs > 190) {
      lastFoamFxTs = now;
      spawnStagePop('🫧', svgX + (Math.random() * 20 - 10), svgY - 8, f.paste);
    }

    syncSceneVisuals();

    if (bedState.germs.every(g => g.defeated)) {
      enterGargleSubStep(opts);
    }
    return true;
  }

  function tapGermAssist(germId, opts = {}) {
    if (!bedState || bedState.phase !== 'brush') return false;
    const germ = bedState.germs.find(g => g.id === germId);
    if (!germ || germ.defeated) return false;

    germ.cleanProgress = Math.min(100, germ.cleanProgress + 45);
    showBriefZipBrush(germ);
    if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.brush) {
      HMC.audio.SFX.brush();
    }
    spawnStagePop('🫧', germ.x, germ.y - 10, getFlavor().paste);

    if (germ.cleanProgress >= 100) {
      defeatGerm(germ);
    }
    syncSceneVisuals();

    if (bedState.germs.every(g => g.defeated)) {
      enterGargleSubStep(opts);
    }
    return true;
  }

  function enterGargleSubStep(opts = {}) {
    if (!bedState || bedState.phase !== 'brush' || bedState.brushLocked) return;
    bedState.brushLocked = true;
    stopActiveDrag();

    if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.success) {
      HMC.audio.SFX.success();
    }
    spawnStageToast('🎉 怪兽全打跑啦！', 210, 56, '#2B8A3E');

    const switchToGargle = () => {
      if (!bedState || bedState.phase !== 'brush') return;
      bedState.phase = 'gargle';
      syncHabitStepIndex();
      syncSceneVisuals();
      updateStepsAndDockUI();
      if (HMC.audio && HMC.audio.setPrompt) {
        HMC.audio.setPrompt(
          '蛀牙怪兽全跑啦！拖起小水杯帮小鸡咕噜咕噜漱口吧！',
          'All sugar bugs are gone! Drag the water cup to rinse clean!'
        );
      }
    };

    if (opts.instant) {
      switchToGargle();
    } else if (HMC.audio && typeof HMC.audio.waitForSpeechThen === 'function') {
      const token = mountToken;
      HMC.audio.waitForSpeechThen(
        700,
        switchToGargle,
        () => token === mountToken && bedState && bedState.phase === 'brush',
        6000
      );
    } else {
      schedule(switchToGargle, 700);
    }
  }

  function triggerGargle(opts = {}) {
    if (!bedState || bedState.phase !== 'gargle' || bedState.gargling) return false;
    stopActiveDrag();

    bedState.gargling = true;
    syncSceneVisuals();
    updateStepsAndDockUI();

    }
    spawnStageToast('咕噜咕噜～噗！', 210, 58, '#1C7ED6');
    spawnStagePop('💦', 148, 134, '#38B6FF');
    spawnStagePop('💦', 272, 134, '#38B6FF');
    spawnStagePop('✨', 210, 148, '#FFD43B');

    const finishRinse = () => {
      if (!bedState || bedState.phase !== 'gargle') return;
      bedState.gargling = false;
      bedState.rinsedClean = true;
      syncSceneVisuals();
      updateStepsAndDockUI();

      if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.magic) {
        HMC.audio.SFX.magic();
      }
      spawnStageToast('✨ 牙齿亮晶晶！', 210, 56, '#F59F00');
      TEETH.forEach((t, idx) => {
        schedule(() => spawnStagePop('✨', t.x, t.y, '#FFD43B'), idx * 55);
      });

      const enterBedroom = () => {
        if (!bedState || bedState.phase !== 'gargle') return;
        bedState.phase = 'plushie';
        bedState.scene = 'bedroom';
        bedState.chickBedroomExpr = 'happy';
        syncHabitStepIndex();
        mountCurrentScene();
        updateStepsAndDockUI();
        if (HMC.audio && HMC.audio.setPrompt) {
          HMC.audio.setPrompt(
            '牙齿亮晶晶真棒！挑一个陪睡小伙伴抱进怀里吧！',
            'Sparkling clean teeth! Pick a bedtime buddy to cuddle!'
          );
        }
      };

      if (opts.instant) {
        enterBedroom();
      } else if (HMC.audio && typeof HMC.audio.waitForSpeechThen === 'function') {
        const token = mountToken;
        HMC.audio.waitForSpeechThen(
          900,
          enterBedroom,
          () => token === mountToken && bedState && bedState.phase === 'gargle',
          6000
        );
      } else {
        schedule(enterBedroom, 900);
      }
    };

    if (opts.instant) {
      finishRinse();
    } else {
      schedule(finishRinse, 620);
    }
    return true;
  }

  function setQuiltPct(pct, opts = {}) {
    if (!bedState || bedState.phase !== 'quilt' || bedState.quiltLocked) return false;
    const clamped = Math.max(0, Math.min(100, Number(pct) || 0));
    const prev = bedState.quiltPct;
    bedState.quiltPct = clamped;

    const now = Date.now();
    if (clamped > prev + 3 && now - lastQuiltSfxTs > 280) {
      lastQuiltSfxTs = now;
      if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.pop) {
        HMC.audio.SFX.pop();
      }
    }

    syncSceneVisuals();

    if (bedState.quiltPct >= 78) {
      completeQuiltPull(opts);
    }
    return true;
  }

  function pullQuiltStep(deltaPct = 40, opts = {}) {
    if (!bedState || bedState.phase !== 'quilt' || bedState.quiltLocked) return false;
    const next = Math.min(100, bedState.quiltPct + deltaPct);
    if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.pop) {
      HMC.audio.SFX.pop();
    }
    spawnStagePop('✨', 198, 174 - (next / 100) * 28, '#FF85C0');
    return setQuiltPct(next, opts);
  }

    bedState.quiltPct = 100;
    bedState.quiltLocked = true;
    bedState.chickBedroomExpr = 'yawn';

      HMC.audio.SFX.yawn();

      );
    } else {

  /* ========================================================================
     Step 4 Mechanics: Downward Star Lamp Pull-Cord -> Starry Midnight Lullaby
     ======================================================================== */

  function setLampPullPx(px) {
    if (!bedState || bedState.phase !== 'lamp' || bedState.lampOff) return false;
    const clamped = Math.max(0, Math.min(40, Number(px) || 0));
    bedState.lampPullPx = clamped;

    const now = Date.now();
    if (clamped >= 10 && now - lastCordTickTs > 320) {
      lastCordTickTs = now;
      spawnStagePop('⭐', 364, 122 + clamped, '#FFD43B');
    }

    syncSceneVisuals();

    if (clamped >= 22) {
      pullLampOff();
    }
    return true;
  }

  function pullLampOff() {
    if (!bedState || bedState.phase !== 'lamp' || bedState.lampOff || bedState.completed) return false;
    stopActiveDrag();

    bedState.lampPullPx = 0;
    bedState.lampOff = true;
    bedState.chickBedroomExpr = 'sleep';
    bedState.phase = 'done';
    bedState.completed = true;
    syncHabitStepIndex();
    syncSceneVisuals();
    updateStepsAndDockUI();

    if (HMC.audio && HMC.audio.SFX && typeof HMC.audio.SFX.clickSwitch === 'function') {
      HMC.audio.SFX.clickSwitch();
    }
    spawnStageToast('咔哒！晚安好梦 🌙', 226, 68, '#FFE066');
    spawnStagePop('🌙', 364, 96, '#FFE066');
    spawnStagePop('⭐', 184, 76, '#FFE066');

    schedule(() => {
      if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.lullaby) {
        HMC.audio.SFX.lullaby();
      }
    }, 180);

    if (HMC.effects && HMC.effects.burstConfetti) {
      HMC.effects.burstConfetti(36);
    }
    const isParty = (HMC.effects && HMC.effects.awardStar) ? HMC.effects.awardStar() : false;

      HMC.storage.recordAttempt('play_habits', true);
    }
    const praiseZh = '刷完牙盖好被子关上灯，晚安好梦哟！';
    const praiseEn = 'Sparkling teeth, cozy blanket, lights out — sweet dreams!';
    if (isParty && HMC.audio && HMC.audio.setPrompt) {
      HMC.audio.setPrompt(praiseZh, praiseEn, false, { voiceStyle: 'bedtime' });
    } else if (HMC.audio && HMC.audio.praiseWithPrompt) {
      HMC.audio.praiseWithPrompt(praiseZh, praiseEn, { voiceStyle: 'bedtime' });
    }
    return true;
  }

  /* ========================================================================

     ======================================================================== */

  function getDragCursorEl() {
    return mountContainer ? mountContainer.querySelector('#bedDragCursor') : null;
  }

  function screenToCanvasSvg(clientX, clientY) {
    if (!mountContainer) return null;
    const canvas = mountContainer.querySelector('#bedCanvas');
    if (!canvas || typeof canvas.getBoundingClientRect !== 'function') return null;
    const rect = canvas.getBoundingClientRect();
    if (!rect || rect.width <= 0 || rect.height <= 0) return null;

    const touchOffsetY = dragPointerType === 'touch' ? -28 : 0;
    const tipX = clientX;
    const tipY = clientY + touchOffsetY;

    const svgX = ((tipX - rect.left) / rect.width) * SVG_W;
    const svgY = ((tipY - rect.top) / rect.height) * SVG_H;
    const inside = svgX >= -24 && svgX <= SVG_W + 24 && svgY >= -24 && svgY <= SVG_H + 24;
    const hitRadiusSvg = Math.max(38, 38 * (SVG_W / rect.width));

    return { svgX, svgY, rect, inside, hitRadiusSvg, scaleX: SVG_W / rect.width, scaleY: SVG_H / rect.height };
  }

  function renderDragCursorContent(kind, payload) {
    const cursor = getDragCursorEl();
    if (!cursor) return;
    cursor.className = `bath-drag-cursor bed-drag-cursor visible tool-${kind}`;
    if (kind === 'tube') {
      cursor.innerHTML = `<div class="bath-cursor-tool">${renderTubeSVG(getFlavor(), 64)}</div>`;
    } else if (kind === 'toothbrush') {
      cursor.innerHTML = `<div class="bath-cursor-tool">${renderLoadedToothbrushSVG(getFlavor(), 78)}</div>`;
    } else if (kind === 'cup') {
      cursor.innerHTML = `<div class="bath-cursor-tool">${renderWaterCupSVG(62)}</div>`;
    } else if (kind === 'plushie') {
      const p = PLUSHIE_BY_ID[payload && payload.plushieId] || PLUSHIES[0];
      cursor.innerHTML = `<div class="bath-cursor-tool">${renderPlushieSVG(p, 68)}</div>`;
    }
  }

  function updateDragCursorPos(clientX, clientY, activeEffect = false) {
    const cursor = getDragCursorEl();
    if (!cursor) return;
    const touchOffsetY = dragPointerType === 'touch' ? -28 : 0;
    cursor.style.left = `${clientX}px`;
    cursor.style.top = `${clientY + touchOffsetY}px`;
    cursor.classList.toggle('active-effect', !!activeEffect);
  }

  function onGlobalPointerMove(e) {
    if (!dragActive || !bedState) return;
    if (dragPointerId != null && e.pointerId != null && e.pointerId !== dragPointerId) return;

    const dx = e.clientX - dragLastX;
    const dy = e.clientY - dragLastY;
    const totalMove = Math.hypot(e.clientX - dragStartX, e.clientY - dragStartY);
    const stepPx = Math.hypot(dx, dy);

    if (!dragMoved && totalMove > 10) {
      dragMoved = true;
      if (dragKind === 'toothbrush' && dragPayload && dragPayload.fromStage) {
        renderDragCursorContent('toothbrush');
        const h = mountContainer && mountContainer.querySelector('#bedToolHandle');
        if (h) h.classList.add('is-dragging');
      } else if (dragKind === 'plushie') {
        renderDragCursorContent('plushie', dragPayload);
        const card = mountContainer && mountContainer.querySelector(`.bed-plushie-card[data-plushie-id="${dragPayload.plushieId}"]`);
        if (card) card.classList.add('is-dragging');
      } else if (dragKind === 'tube' && dragPayload && !dragPayload.fromStage) {
        renderDragCursorContent('tube');
        const h = mountContainer && mountContainer.querySelector('#bedToolHandle');
        if (h) h.classList.add('is-dragging');
      }
    }

    dragLastX = e.clientX;
    dragLastY = e.clientY;

    // 1. Step 1: Toothpaste Squeeze Drag
    if (dragKind === 'tube' && bedState.phase === 'paste') {
      const pt = screenToCanvasSvg(e.clientX, e.clientY);
      if (dragPayload && !dragPayload.fromStage && dragMoved) {
        updateDragCursorPos(e.clientX, e.clientY, !!(pt && pt.inside));
      }
      if (pt && pt.inside && stepPx >= 1.5) {
        // Horizontal brushing motion across bristles squeezes paste smoothly!
        const inZone = pt.svgX >= 52 && pt.svgX <= 268 && pt.svgY >= 72 && pt.svgY <= 220;
        if (inZone || (dragPayload && dragPayload.fromStage)) {
          const deltaPct = Math.max(0.8, (stepPx * pt.scaleX) * 0.72);
          squeezePaste(deltaPct);
        }
      }
      return;
    }

    // 2. Step 2a: Toothbrush Scrub Drag
    if (dragKind === 'toothbrush' && bedState.phase === 'brush') {
      if (dragPayload && dragPayload.fromStage && !dragMoved) return;
      const pt = screenToCanvasSvg(e.clientX, e.clientY);
      updateDragCursorPos(e.clientX, e.clientY, !!(pt && pt.inside));
      if (pt && pt.inside && stepPx >= 1.5) {
        brushAtSvgPoint(pt.svgX, pt.svgY, stepPx * pt.scaleX, pt.hitRadiusSvg);
      }
      return;
    }

    // 3. Step 2b: Water Cup Drag onto Mouth
    if (dragKind === 'cup' && bedState.phase === 'gargle') {
      const pt = screenToCanvasSvg(e.clientX, e.clientY);
      const overMouth = !!(pt && pt.svgX >= 70 && pt.svgX <= 350 && pt.svgY >= 52 && pt.svgY <= 248);
      updateDragCursorPos(e.clientX, e.clientY, overMouth);
      if (overMouth && dragMoved) {

      return;
    }

    // 4. Step 3a: Plushie Drag onto Bed
    if (dragKind === 'plushie' && bedState.phase === 'plushie') {

      updateDragCursorPos(e.clientX, e.clientY, !!(pt && pt.inside));

    }

    // 5. Step 3b: Vertical UPWARD Starry Quilt Drag
    if (dragKind === 'quilt' && bedState.phase === 'quilt') {
      const canvas = mountContainer && mountContainer.querySelector('#bedCanvas');
      const rect = canvas && canvas.getBoundingClientRect ? canvas.getBoundingClientRect() : null;
      const pullSpanPx = Math.max(58, rect && rect.height ? rect.height * 0.34 : 88);

      if (downwardPx > 4) {

      }
      return;
    }

  function onGlobalPointerUp(e) {
    if (!dragActive) return;

    if (kind === 'tube' && bedState.phase === 'paste' && !moved) {
      squeezePaste(35, { forceSfx: true });

    }

    // Step 2a: Tap assist directly on a germy tooth (+45%!)
    if (kind === 'toothbrush' && bedState.phase === 'brush' && !moved && payload && payload.germId) {
      tapGermAssist(payload.germId);
      return;
    }

    // Step 2b: Tap assist on cup handle triggers gargle directly for young toddlers!
    if (kind === 'cup' && bedState.phase === 'gargle' && !moved) {
      triggerGargle();
      return;
    }

    // Step 3a: Tap OR Drop Plushie onto bed places it warmly into chick's arms!
    if (kind === 'plushie' && bedState.phase === 'plushie' && payload && payload.plushieId) {
      if (!moved) {
        selectPlushie(payload.plushieId);
      } else {
        const pt = screenToCanvasSvg(upX, upY);
        if (pt && pt.inside) {
          selectPlushie(payload.plushieId);
        } else if (HMC.audio && HMC.audio.SFX && HMC.audio.SFX.boing) {
          HMC.audio.SFX.boing();
        }
      }
      return;
    }

    // Step 3b: Tap assist on quilt handle/overlay smoothly pulls quilt up by +40%!
    if (kind === 'quilt' && bedState.phase === 'quilt' && !moved) {

      return;
    }

      const pt = screenToCanvasSvg(dragStartX, dragStartY);
      updateDragCursorPos(dragStartX, dragStartY, !!(pt && pt.inside));

    dragKind = null;
    dragPointerId = null;
    dragMoved = false;
    dragPayload = null;

        quiltOverlay.addEventListener('click', (e) => {
          if (!bedState || bedState.phase !== 'quilt' || bedState.quiltLocked) return;
          e.stopPropagation();
          if (Date.now() - lastQuiltPtrTs < 380) return;

    if (songResetHandle) {

      songResetHandle = null;

      (nextSub) => {

        state.playSubMode = nextSub;

  function updatePianoCueAndProgress() {
    const state = HMC.state;

      ? song.notes[state.pianoStep]
      : -1;

          dot.classList.toggle('done', idx < state.pianoStep);

      if (r && (r.width > 0 || r.height > 0)) {
        return { x: r.left + r.width / 2, y: r.top + r.height * 0.25 };

  function handlePianoKeyTap(noteNum, btnEl = null, clientX = null, clientY = null) {

    HMC.audio.SFX.marimba(note.freq);
    animatePianoKey(keyEl);

    const fallbackPos = getElCenter(keyEl);
    const fxX = (typeof clientX === 'number' && clientX > 0) ? clientX : fallbackPos.x;
    const fxY = (typeof clientY === 'number' && clientY > 0) ? clientY : fallbackPos.y;
    HMC.effects.spawnFloatingWord(`🎵 ${note.solfege}!`, fxX, fxY - 22, note.dark);

    const song = getActiveSong();
    if (!song || songLocked) return;

    const expected = song.notes[state.pianoStep];
    if (noteNum === expected) {
      state.pianoStep++;
      updatePianoCueAndProgress();

      if (state.pianoStep >= song.notes.length) {
        songLocked = true;
        if (HMC.storage && HMC.storage.recordAttempt) {
          HMC.storage.recordAttempt('play_music', true);
        }
        updatePianoCueAndProgress();
        songCelebrateTimer = setTimeout(() => {
          songCelebrateTimer = null;

          HMC.audio.SFX.fanfare();
          HMC.effects.burstConfetti(42);
          const isParty = HMC.effects.awardStar();
          const praiseZh = `太棒啦！你弹完了一整首《${song.zh}》！`;
          const praiseEn = `Bravo! You played the whole ${song.en} song!`;
          if (isParty) HMC.audio.setPrompt(praiseZh, praiseEn, false);
          else HMC.audio.praiseWithPrompt(praiseZh, praiseEn);
          document.querySelectorAll('.piano-chick-key').forEach((k, idx) => {
            setTimeout(() => animatePianoKey(k), idx * 65);
          });
          songResetHandle = HMC.audio.waitForSpeechThen(
            1400,
            () => {
              songResetHandle = null;
              state.pianoStep = 0;
              songLocked = false;
              updatePianoCueAndProgress();
            },
            () => state.mode === 'play' && state.playSubMode === 'piano' && state.pianoSongId === song.id

      pill.addEventListener('click', (e) => {

        cleanup();

      btn.addEventListener('click', (e) => {

    if (isFresh) {
      if (song) {
        HMC.audio.setPrompt(
          `跟着发光的小星星，一起弹《${song.zh}》吧！`,

        );

  }

     SUB-MODE B: 🛁 生活好习惯剧场 (Good Habits Theater — Bath & Bedtime)

  function selectHabitStory(storyId, isFresh = true) {

    // 2. Pure Single-Row Category Filter Bar (7 Categories)

      const isActive = cat.id === currentCatId;

      pill.type = 'button';

    const activeCatItems = items.filter(it => it.slot === currentCatId);
    const unlockedInCat = activeCatItems.filter(it => unlockedSet.has(it.id)).length;

    catNote.className = 'wardrobe-cat-note';
    catNote.textContent = `当前品类：${activeCatObj.icon} ${activeCatObj.zh} · 已解锁 ${unlockedInCat}/${activeCatItems.length}`;

    // 4. 6-Item Category Grid
    const grid = document.createElement('div');
    grid.className = 'wardrobe-grid';

    activeCatItems.forEach(item => {
      const isUnlocked = unlockedSet.has(item.id);
      const isEquipped = isUnlocked && equippedSet.has(item.id);
      const canClaim = !isUnlocked && totalStars >= item.cost;
      const starsNeeded = Math.max(0, item.cost - totalStars);

      let stateClass = 'state-locked';
      let actionLabel = `🔒 还差 ${starsNeeded}⭐`;
      if (isEquipped) {
        stateClass = 'state-equipped';
        actionLabel = '✅ 穿着呢';
      } else if (isUnlocked) {
        stateClass = 'state-owned';
        actionLabel = '👗 穿上它';
      } else if (canClaim) {
        stateClass = 'state-claimable';
        actionLabel = '🎁 解锁！';

      const thumbHtml = (HMC.svgWardrobe && typeof HMC.svgWardrobe.renderItemThumbnail === 'function')

        : `<span class="wardrobe-item-emoji">${item.icon}</span>`;

        <div class="wardrobe-item-name">${item.zh}</div>

        e.stopPropagation();

          if (res.equipped) {
            if (HMC.audio && HMC.audio.SFX) HMC.audio.SFX.success();
            if (HMC.audio && HMC.audio.speak) {
              HMC.audio.speak(`穿上${item.zh}啦！真好看！`, `Wearing ${item.en}!`);
            }
          } else {
            if (HMC.audio && HMC.audio.SFX) HMC.audio.SFX.pop();
            if (HMC.audio && HMC.audio.speak) {
              HMC.audio.speak(`脱下${item.zh}啦！`, `Took off ${item.en}!`);
            }
          }
          refreshLiveChickens();
          updateBadge();
          renderWardrobeContent();
          if (res.equipped) triggerPreviewDance(1100);
          return;
        }

        if (canClaim) {
          HMC.storage.unlockWardrobeItem(item.id);
          if (HMC.audio && HMC.audio.SFX) HMC.audio.SFX.fanfare();
          if (HMC.effects && HMC.effects.burstConfetti) HMC.effects.burstConfetti(30);
          if (HMC.effects && HMC.effects.spawnFloatingWord) {
            HMC.effects.spawnFloatingWord(
              `🎉 解锁${item.zh}！`,
              (window.innerWidth || 390) / 2,
              (window.innerHeight || 844) * 0.28,
              '#FF5C8D'
            );
          }
          if (HMC.audio && HMC.audio.speak) {
            HMC.audio.speak(`太棒啦！解锁了${item.zh}！`, `Awesome! Unlocked ${item.en}!`);
          }
          refreshLiveChickens();
          updateBadge();
          renderWardrobeContent();
          triggerPreviewDance(1500);
          return;
        }

        // Locked & not enough stars yet
        card.classList.remove('locked-shake');
        void card.offsetWidth;
        card.classList.add('locked-shake');
        if (HMC.audio && HMC.audio.SFX) HMC.audio.SFX.boing();
        if (HMC.audio && HMC.audio.speak) {
          HMC.audio.speak(
            `再收集 ${starsNeeded} 颗星星就能解锁${item.zh}啦！`,
            `Collect ${starsNeeded} more stars to unlock ${item.en}!`
          );
        }
      });

      grid.appendChild(card);
    });

    bodyEl.appendChild(previewWrap);
    bodyEl.appendChild(catBar);
    bodyEl.appendChild(catNote);
    bodyEl.appendChild(grid);

    // Restore category bar scroll position cleanly
    if (savedCatBarScrollLeft > 0) {
      catBar.scrollLeft = savedCatBarScrollLeft;
    }
  }

  function renderAlbumTab(bodyEl, album, buddies) {
    const categories = getAlbumCategories();
    const currentCatId = ensureValidAlbumCategory(categories);
    const totalRare = buddies.length;
    const collectedCount = buddies.filter(b => (Number(album[b.id]) || 0) > 0).length;
    const pct = totalRare > 0 ? Math.round((collectedCount / totalRare) * 100) : 0;
    const isAllCollected = totalRare > 0 && collectedCount >= totalRare;

    summaryBar.className = 'album-summary-bar' + (isAllCollected ? ' complete' : '');
    summaryBar.innerHTML = `
      <div class="album-summary-head">

        <span class="album-summary-pct">${isAllCollected ? '🎉 全集齐！' : `${pct}%`}</span>
      </div>
      <div class="album-progress-track" role="progressbar" aria-label="图鉴收集进度" aria-valuemin="0" aria-valuemax="${totalRare}" aria-valuenow="${collectedCount}">

      </div>
      <div class="album-summary-sub">${isAllCollected
        ? `太厉害啦！全部 ${totalRare} 位神奇小伙伴都和你成为好朋友咯！`

      categories.forEach(cat => {
