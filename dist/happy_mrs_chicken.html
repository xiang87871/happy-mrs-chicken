  /* ==========================================================================
     3-Tier Voice & Speech Engine (Tier 1 Parent Clip -> Tier 2 Offline MP3
     Pack via HMC.voicePack -> Tier 3 Web Speech API Fallback + Watchdog)
     ========================================================================== */

  let speechGen = 0;
  let currentSpeechPromise = Promise.resolve();
  let isActiveSpeaking = false;
  let activeClipAudio = null;
  let activeClipCancel = null;
  let activeUtterance = null;
  let pendingTransitions = new Set();
  let pendingTimers = new Set();

  function getNick() {
    return '';
  }

  function personalizeZh(text) {
    if (!text || typeof text !== 'string') return '';
    return text
      .replace(/^宝贝[，,]\s*/, '')
      .replace(/[，,]宝贝([！!？?。])/g, '$1');
  }

  function withNick(text) {
    return personalizeZh(text);
  }

  function stripSpeechDecorations(text) {
    if (!text || typeof text !== 'string') return '';
    return text
      .replace(/[【】]/g, '')
      .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{2300}-\u{23FF}\uFE0E\uFE0F\u200D\u20E3]/gu, '')
      .replace(/[\u00A0\u3000\s]+/g, ' ')
      .trim();
  }

  function normalizeVoiceKey(text) {
    if (!text || typeof text !== 'string') return '';
    let s = stripSpeechDecorations(text)
      .replace(/\.{3,}/g, '…')
      .replace(/~+/g, '～')
      .trim();
    // Collapse spaces adjacent to CJK characters or CJK punctuation so keys match identically
    s = s
      .replace(/([\u4E00-\u9FFF\u3001-\u303F\uFF00-\uFFEF])\s+/g, '$1')
      .replace(/\s+([\u4E00-\u9FFF\u3001-\u303F\uFF00-\uFFEF])/g, '$1')
      .replace(/\s+([,.;:!?])/g, '$1')
      .trim();
    return s;
  }

  function stopActiveClipPlayback() {
    if (typeof activeClipCancel === 'function') {
      const cancel = activeClipCancel;
      activeClipCancel = null;
      try { cancel(); } catch (e) {}
    }
    if (activeClipAudio) {
      const a = activeClipAudio;
      activeClipAudio = null;
      try {
        a.onended = null;
        a.onerror = null;
        if (typeof a.pause === 'function') a.pause();
        try { a.currentTime = 0; } catch (e) {}
      } catch (e) {}
    }
    activeUtterance = null;
  }

  function stopParentClip() {
    stopActiveClipPlayback();
  }

  function stopAllSpeech() {
    speechGen++;
    isActiveSpeaking = false;
    stopActiveClipPlayback();
    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    currentSpeechPromise = Promise.resolve();
  }

  function cancelPendingTransitions() {
    pendingTransitions.forEach(entry => {
      try { entry.cancel(); } catch (e) {}
    });
    pendingTransitions.clear();
    pendingTimers.forEach(t => {
      try { clearTimeout(t); } catch (e) {}
    });
    pendingTimers.clear();
  }

  function isSpeaking() {
    return isActiveSpeaking;
  }

  function getSpeechGen() {
    return speechGen;
  }

  function getCurrentSpeechPromise() {
    return currentSpeechPromise;
  }

  function pickVoice(langPrefix) {
    if (typeof window === 'undefined' || !('speechSynthesis' in window)) return null;
    const voices = window.speechSynthesis.getVoices() || [];
    return (
      voices.find(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix) && /ting|mei|sin|xiaoxiao|samantha|victoria|google/i.test(v.name)) ||
      voices.find(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix)) ||
      null
    );
  }

  function playAudioUrl(url, myGen) {
    return new Promise((resolve) => {
      if (myGen !== speechGen) {
        resolve('cancelled');
        return;
      }
      if (!url || typeof window === 'undefined' || typeof window.Audio !== 'function') {
        resolve('error');
        return;
      }

      let audio;
      try {
        audio = new window.Audio(url);
        audio.preload = 'auto';
      } catch (e) {
        resolve('error');
        return;
      }

      let settled = false;
      let watchdog = null;

      const cleanup = () => {
        if (watchdog) {
          clearTimeout(watchdog);
          watchdog = null;
        }
        try {
          audio.onended = null;
          audio.onerror = null;
        } catch (e) {}
        if (activeClipAudio === audio) activeClipAudio = null;
        if (activeClipCancel === cancelFn) activeClipCancel = null;
      };

      const finish = (status) => {
        if (settled) return;
        settled = true;
        cleanup();
        resolve(status);
      };

      const cancelFn = () => {
        if (settled) return;
        settled = true;
        cleanup();
        try {
          if (typeof audio.pause === 'function') audio.pause();
          try { audio.currentTime = 0; } catch (e) {}
        } catch (e) {}
        resolve('cancelled');
      };

      activeClipAudio = audio;
      activeClipCancel = cancelFn;

      audio.onended = () => finish('ended');
      audio.onerror = () => finish('error');

      // Safety watchdog in case a media stream stalls without firing ended/error
      watchdog = setTimeout(() => {
        try {
          if (typeof audio.pause === 'function') audio.pause();
        } catch (e) {}
        finish('error');
      }, 15000);

      try {
        const playResult = audio.play();
        if (playResult && typeof playResult.then === 'function') {
          playResult.catch(() => finish('error'));
        }
      } catch (e) {
        finish('error');
      }
    });
  }

  function speakViaWebSpeech(seg, voiceStyle, myGen) {
    return new Promise((resolve) => {
      if (myGen !== speechGen) {
        resolve('cancelled');
        return;
      }
      if (
        !HMC.state ||
        !HMC.state.soundOn ||
        typeof window === 'undefined' ||
        !('speechSynthesis' in window) ||
        typeof window.SpeechSynthesisUtterance !== 'function'
      ) {
        resolve('skipped');
        return;
      }

      const cleanText = stripSpeechDecorations(seg.text);
      if (!cleanText) {
        resolve('ended');
        return;
      }

      let settled = false;
      let watchdog = null;
      let u = null;

      const cleanup = () => {
        if (watchdog) {
          clearTimeout(watchdog);
          watchdog = null;
        }
        if (u) {
          try {
            u.onend = null;
            u.onerror = null;
          } catch (e) {}
        }
        if (activeClipCancel === cancelFn) activeClipCancel = null;
        if (activeUtterance === u) activeUtterance = null;
      };

      const finish = (status) => {
        if (settled) return;
        settled = true;
        cleanup();
        resolve(status);
      };

      const cancelFn = () => {
        if (settled) return;
        settled = true;
        cleanup();
        try {
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        } catch (e) {}
        resolve('cancelled');
      };

      try {
        u = new window.SpeechSynthesisUtterance(cleanText);
        u.lang = seg.bcp47;
        u.pitch = 1.0;
        u.rate = voiceStyle === 'bedtime' ? 0.88 : 0.96;
        const voice = pickVoice(seg.lang);
        if (voice) u.voice = voice;

        activeUtterance = u;
        activeClipCancel = cancelFn;

        u.onend = () => finish('ended');
        u.onerror = () => finish('error');

        const watchdogMs = Math.max(1600, cleanText.length * 320 + 1200);
        watchdog = setTimeout(() => {
          finish('timeout');
        }, watchdogMs);

        window.speechSynthesis.speak(u);
      } catch (e) {
        finish('error');
      }
    });
  }

  async function speakInternal(zhText, enText, opts, myGen) {
    const state = HMC.state;
    if (!state || !state.soundOn || myGen !== speechGen) return;

    const finalZh = personalizeZh(zhText || '');
    const finalEn = typeof enText === 'string' ? enText : '';
    const voiceStyle = (opts && opts.voiceStyle) || 'daily';

    const segments = [];
    if (state.lang === 'zh') {
      if (finalZh) segments.push({ text: finalZh, lang: 'zh', bcp47: 'zh-CN' });
    } else if (state.lang === 'en') {
      if (finalEn || finalZh) segments.push({ text: finalEn || finalZh, lang: 'en', bcp47: 'en-US' });
    } else if (state.lang === 'bi') {
      if (finalZh) segments.push({ text: finalZh, lang: 'zh', bcp47: 'zh-CN' });
      if (finalEn) segments.push({ text: finalEn, lang: 'en', bcp47: 'en-US' });
    } else {
      if (finalZh) segments.push({ text: finalZh, lang: 'zh', bcp47: 'zh-CN' });
    }

    for (let i = 0; i < segments.length; i++) {
      if (myGen !== speechGen || !state.soundOn) return;
      const seg = segments[i];

      // Tier 2: Offline pre-generated MP3 pack via HMC.voicePack.resolve(text, lang, voiceStyle)
      let mp3Urls = null;
      if (HMC.voicePack && typeof HMC.voicePack.resolve === 'function') {
        try {
          const resolved = HMC.voicePack.resolve(seg.text, seg.lang, voiceStyle);
          if (Array.isArray(resolved) && resolved.length > 0) {
            mp3Urls = resolved.filter(u => typeof u === 'string' && u.length > 0);
          } else if (typeof resolved === 'string' && resolved.length > 0) {
            mp3Urls = [resolved];
          }
        } catch (e) {
          mp3Urls = null;
        }
      }

      let mp3Succeeded = false;
      if (mp3Urls && mp3Urls.length > 0 && typeof window !== 'undefined' && typeof window.Audio === 'function') {
        mp3Succeeded = true;
        for (let j = 0; j < mp3Urls.length; j++) {
          if (myGen !== speechGen || !state.soundOn) return;
          const res = await playAudioUrl(mp3Urls[j], myGen);
          if (res === 'cancelled' || myGen !== speechGen) return;
          if (res === 'error') {
            mp3Succeeded = false;
            break;
          }
        }
      }

      // Tier 3: Web Speech API fallback (natural pitch=1.0 + safety watchdog)
      if (!mp3Succeeded && myGen === speechGen && state.soundOn) {
        await speakViaWebSpeech(seg, voiceStyle, myGen);
      }
    }
  }

  function speak(zhText, enText = '', opts = {}) {
    stopAllSpeech();
    if (!HMC.state || !HMC.state.soundOn) {
      currentSpeechPromise = Promise.resolve();
      return currentSpeechPromise;
    }

    const myGen = speechGen;
    isActiveSpeaking = true;
    const p = speakInternal(zhText, enText, opts, myGen).finally(() => {
      if (myGen === speechGen) {
        isActiveSpeaking = false;
      }
    });
    currentSpeechPromise = p;
    return p;
  }

  function playParentClip(slotId, fallbackZh = '', fallbackEn = '', onDone = null, opts = {}) {
    stopAllSpeech();
    if (!HMC.state || !HMC.state.soundOn) {
      if (typeof onDone === 'function') {
        try { onDone(false); } catch (e) {}
      }
      currentSpeechPromise = Promise.resolve();
      return currentSpeechPromise;
    }

    const hasClip = !!(
      HMC.storage &&
      typeof HMC.storage.hasVoiceClip === 'function' &&
      HMC.storage.hasVoiceClip(slotId)
    );
    const dataUrl = hasClip && typeof HMC.storage.getVoiceClip === 'function'
      ? HMC.storage.getVoiceClip(slotId)
      : null;

    return out.length ? out : null;

  function renderShapePath(shapeId, cx, cy, size, fill, opts = {}) {
    const r = size / 2;

    const dash = opts.dashed ? 'stroke-dasharray="6 4"' : '';

    if (shapeId === 'square') {
      return `<rect x="${cx - r}" y="${cy - r}" width="${size}" height="${size}" rx="5" ${attrs}/>`;
    }
    if (shapeId === 'rectangle') {
      const w = size * 1.24;
      const h = size * 0.72;
      return `<rect x="${cx - w / 2}" y="${cy - h / 2}" width="${w}" height="${h}" rx="5" ${attrs}/>`;
    }
    if (shapeId === 'diamond') {
      const pts = `${cx},${cy - r * 1.06} ${cx + r * 0.82},${cy} ${cx},${cy + r * 1.06} ${cx - r * 0.82},${cy}`;
      return `<polygon points="${pts}" ${attrs} stroke-linejoin="round"/>`;

    if (shapeId === 'semicircle') {

      return `<path d="M${cx - w} ${cy + r * 0.25} A${w} ${w} 0 0 1 ${cx + w} ${cy + r * 0.25} Z" ${attrs} stroke-linejoin="round"/>`;

    if (shapeId === 'triangle') {

      const p2 = `${cx + r * 1.06},${cy + r * 0.9}`;
      const p3 = `${cx - r * 1.06},${cy + r * 0.9}`;
      return `<polygon points="${p1} ${p2} ${p3}" ${attrs} stroke-linejoin="round"/>`;
    }
    if (shapeId === 'star') {
      const pts = [];
      for (let i = 0; i < 10; i++) {
        const rad = (i % 2 === 0 ? r * 1.12 : r * 0.48);
        const ang = (Math.PI / 5) * i - Math.PI / 2;

      return `<polygon points="${pts.join(' ')}" ${attrs} stroke-linejoin="round"/>`;
    }
    if (shapeId === 'heart') {

(function (HMC) {
  'use strict';

  function getFxLayer() {
    return document.getElementById('fxLayer');
  }

  function spawnFloatingWord(text, x, y, color = '#FF5C8D') {
    const fxLayerEl = getFxLayer();
    if (!fxLayerEl) return;
    const vw = window.innerWidth || 390;
    const vh = window.innerHeight || 844;
    const padX = Math.min(115, Math.max(76, text.length * 10));
    const safeX = Math.max(padX, Math.min(vw - padX, x));
    const safeY = Math.max(82, Math.min(vh - 70, y));
    const el = document.createElement('div');
    el.className = 'float-word';
    el.textContent = text;
    el.style.left = `${safeX}px`;
    el.style.top = `${safeY}px`;
    el.style.color = color;
    fxLayerEl.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }

  function burstConfetti(count = 32) {
    const fxLayerEl = getFxLayer();
    if (!fxLayerEl) return;
    const palette = ['#FF5D6C', '#FFD43B', '#4DABF7', '#51CF66', '#FF85C0', '#B197FC', '#FF922B'];
    for (let i = 0; i < count; i++) {
      const piece = document.createElement('div');
      piece.className = 'confetti-piece';
      piece.style.left = `${8 + Math.random() * 84}%`;
      piece.style.top = `${-10 - Math.random() * 40}px`;
      piece.style.background = palette[i % palette.length];
      piece.style.animationDelay = `${Math.random() * 0.45}s`;
      piece.style.borderRadius = i % 2 === 0 ? '50%' : '3px';
      fxLayerEl.appendChild(piece);
      setTimeout(() => piece.remove(), 2400);
    }
  }

  function renderStarsUI() {
    const slots = document.querySelectorAll('#stickerTray .sticker-slot');
    slots.forEach((slot, idx) => {
      slot.classList.toggle('empty', idx >= HMC.state.stars);
      slot.classList.toggle('earned', idx < HMC.state.stars);
    });
    const total = Math.max(0, Number(HMC.state.totalStars) || 0);
    const tray = document.getElementById('stickerTray');
    if (tray) {
      tray.title = `累计 ${total} 颗星星 · 点一点打开换装间与图鉴！`;
      tray.setAttribute('aria-label', `累计 ${total} 颗星星，打开换装间与图鉴`);
    }
    const badge = document.getElementById('totalStarsBadge');
    if (badge) {
      badge.textContent = `⭐ ${total}`;
    }
  }

  let partyTimer = null;

  function awardStar() {
    const state = HMC.state;
    const newTotal = (HMC.storage && HMC.storage.addStar)
      ? HMC.storage.addStar()
      : (Number(state.totalStars) || 0) + 1;
    state.totalStars = newTotal;
    state.stars = Math.min(5, (Number(state.stars) || 0) + 1);
    renderStarsUI();

    if (HMC.wardrobe && HMC.wardrobe.updateBadge) {
      HMC.wardrobe.updateBadge();
    }

    const items = (HMC.data && HMC.data.WARDROBE_ITEMS) || [];
    const unlocked = (HMC.storage && HMC.storage.getWardrobe) ? HMC.storage.getWardrobe().unlocked : [];
    const newlyUnlockable = items.find(item => item.cost > 0 && item.cost === newTotal && !unlocked.includes(item.id));
    if (newlyUnlockable) {
      const toastDelay = state.stars >= 5 ? 1250 : 260;
      setTimeout(() => {
        spawnFloatingWord('🎁 新装扮可解锁！', (window.innerWidth || 390) / 2, (window.innerHeight || 844) * 0.24, '#FF5C8D');
      }, toastDelay);
    }

    const isParty = state.stars >= 5;
    if (isParty) {
      if (partyTimer) clearTimeout(partyTimer);
      partyTimer = setTimeout(() => {
        partyTimer = null;
        const sleepOverlay = document.getElementById('sleepOverlay');
        if (sleepOverlay && sleepOverlay.classList.contains('open')) return;

        HMC.audio.SFX.fanfare();
        burstConfetti(48);
        spawnFloatingWord('🎉 小鸡大派对！', (window.innerWidth || 390) / 2, (window.innerHeight || 844) * 0.36, '#FF8C00');

        const playPartyVoice = () => {
          const sleepEl = document.getElementById('sleepOverlay');
          if (sleepEl && sleepEl.classList.contains('open')) return;
          HMC.audio.playParentClip(
            'party',
            '哇！集齐五颗星啦！快乐小鸡大派对！',
            'Five stars! Happy Mrs. Chicken party!'
          );
        };

        if (
          HMC.audio &&
          typeof HMC.audio.isSpeaking === 'function' &&
          HMC.audio.isSpeaking() &&
          typeof HMC.audio.getCurrentSpeechPromise === 'function'
        ) {
          const genBefore = typeof HMC.audio.getSpeechGen === 'function' ? HMC.audio.getSpeechGen() : -1;
          const activeP = HMC.audio.getCurrentSpeechPromise();
          let settled = false;
          const finish = () => {
            if (settled) return;
            settled = true;
            const curGen = typeof HMC.audio.getSpeechGen === 'function' ? HMC.audio.getSpeechGen() : -1;
            if (curGen === genBefore) playPartyVoice();
          };
          setTimeout(finish, 4500);
          Promise.resolve(activeP).then(finish, finish);
        } else {
          playPartyVoice();
        }

        const actor = document.querySelector('.chicken-actor');
        if (actor) {
          actor.classList.remove('idle');
          actor.classList.add('celebrate');
          setTimeout(() => {
            actor.classList.remove('celebrate');
            actor.classList.add('idle');
          }, 1600);
        }
        setTimeout(() => {
          state.stars = (Number(state.totalStars) || 0) % 5;
          renderStarsUI();
        }, 2200);
      }, 500);
    }
    return isParty;
  }

  function setupDragToTarget(dragEl, targetSelector, onDrop) {
    if (!dragEl) return;
    let dragging = false;
    let startX = 0;
    let startY = 0;

    dragEl.addEventListener('pointerdown', (e) => {
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      dragEl.classList.remove('bounce');
      dragEl.style.zIndex = '50';
      if (dragEl.setPointerCapture) {
        try { dragEl.setPointerCapture(e.pointerId); } catch (err) {}
      }
    });

    dragEl.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      dragEl.style.transform = `translate(${e.clientX - startX}px, ${e.clientY - startY}px) scale(1.08)`;
    });

    const finish = (e) => {
      if (!dragging) return;
      dragging = false;
      dragEl.style.transform = '';
      dragEl.style.zIndex = '';
      let matched = null;
      document.querySelectorAll(targetSelector).forEach(t => {
        const rect = t.getBoundingClientRect();
        if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
          matched = t;
        }
      });
      if (matched) onDrop(matched, e.clientX, e.clientY);
      else dragEl.classList.add('bounce');
    };

    dragEl.addEventListener('pointerup', finish);
    dragEl.addEventListener('pointercancel', finish);
  }

  function renderSubModeDock(items, activeId, onSelect) {
    const dockEl = document.getElementById('subModeDock');
    const appShellEl = document.getElementById('appShell');
    if (!dockEl || !appShellEl) return;

    dockEl.innerHTML = '';
    items.forEach(item => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'submode-pill' + (item.id === activeId ? ' active' : '');
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-selected', item.id === activeId ? 'true' : 'false');
      btn.dataset.subId = item.id;
      btn.textContent = item.label;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (item.id === activeId) return;
        if (typeof onSelect === 'function') onSelect(item.id);
      });
      dockEl.appendChild(btn);
    });

    dockEl.classList.remove('hidden');
    appShellEl.classList.add('has-subdock');
  }

  function clearSubModeDock() {
    const dockEl = document.getElementById('subModeDock');
    const appShellEl = document.getElementById('appShell');
    if (dockEl) {
      dockEl.innerHTML = '';
      dockEl.classList.add('hidden');
    }
    if (appShellEl) {
      appShellEl.classList.remove('has-subdock');
    }
  }

  HMC.effects = {
    spawnFloatingWord,
    burstConfetti,
    renderStarsUI,
    awardStar,
    setupDragToTarget,
    renderSubModeDock,
    clearSubModeDock
  };
})(window.HMC = window.HMC || {});

      left: 0,
      top: 0,
      width: window.innerWidth || 390,
      height: window.innerHeight || 844,
      right: window.innerWidth || 390,
      bottom: window.innerHeight || 844
    };
  }

  function getBounds() {
    if (HMC.modes && HMC.modes.classic && typeof HMC.modes.classic.getClassicBounds === 'function') {
      return HMC.modes.classic.getClassicBounds(false);
    }
    return {
      shellRect: getShellRect(),
      minX: 9,
      maxX: 91,
      minY: 18,
      maxY: 84
    };
  }

  function clampToBounds(spot, boundsOverride = null) {
    const b = boundsOverride || getBounds();
    return {
      xPct: Math.max(b.minX + 1, Math.min(b.maxX - 1, spot.xPct)),
      yPct: Math.max(b.minY + 4, Math.min(b.maxY - 1, spot.yPct))
    };
  }

  function clientToPct(clientX, clientY, shellRect) {
    const r = shellRect || getShellRect();
    const w = r.width > 0 ? r.width : (window.innerWidth || 390);
    const h = r.height > 0 ? r.height : (window.innerHeight || 844);
    return {
      xPct: ((clientX - r.left) / w) * 100,
      yPct: ((clientY - r.top) / h) * 100
    };
  }

  function pctToClient(xPct, yPct, shellRect) {
    const r = shellRect || getShellRect();
    const w = r.width > 0 ? r.width : (window.innerWidth || 390);
    const h = r.height > 0 ? r.height : (window.innerHeight || 844);
    return {
      x: r.left + (xPct / 100) * w,
      y: r.top + (yPct / 100) * h
    };
  }

  function getToyEl(toyId) {
    const meta = TOY_BY_ID[toyId];
    return meta ? document.getElementById(meta.elId) : null;
  }

  function getItemNode(itemId) {
    if (HMC.modes && HMC.modes.classic && typeof HMC.modes.classic.getItemNode === 'function') {
      return HMC.modes.classic.getItemNode(itemId);
    }
    return document.querySelector(`.free-meadow-item[data-item-id="${itemId}"]`);
  }

  function retriggerClass(el, cls) {
    if (!el) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function triggerHop(el) {
    if (!el || !el._innerEl) return;
    el._innerEl.classList.remove('hop', 'pop-in', 'egg-shake');
    void el._innerEl.offsetWidth;
    el._innerEl.classList.add('hop');
  }

  function triggerTrampolineBoing() {
    const el = getToyEl('trampoline');
    if (el) retriggerClass(el, 'trampoline-boing');
  }

  function triggerSlideCheer() {
    const el = getToyEl('slide');
    if (el) retriggerClass(el, 'slide-cheer');
  }

  function triggerPuddleSplash() {
    const el = getToyEl('puddle');
    if (el) retriggerClass(el, 'splash');
  }

  function markJustDropped(ms = 400) {
    justDroppedUntil = nowMs() + ms;
  }

  function wasJustDropped() {
    return nowMs() < justDroppedUntil;
  }

  function trackFxTimer(fn, ms) {
    const id = setTimeout(() => {
      fxTimers.delete(id);
      fn();
    }, ms);
    fxTimers.add(id);
    return id;
  }

  function spawnMudDroplets(cx, cy) {
    const fxLayer = document.getElementById('fxLayer');
    if (!fxLayer) return;
    const dirs = [
      { dx: -44, dy: -46, s: 11 },
      { dx: -24, dy: -62, s: 9 },
      { dx: -6,  dy: -54, s: 12 },
      { dx: 14,  dy: -64, s: 10 },
      { dx: 36,  dy: -48, s: 11 },
      { dx: -36, dy: -26, s: 8 },
      { dx: 42,  dy: -24, s: 8 }
    ];
    dirs.forEach((d, idx) => {
      const dot = document.createElement('div');
      dot.className = 'mud-droplet';
      dot.style.left = `${cx}px`;
      dot.style.top = `${cy}px`;
      dot.style.width = `${d.s}px`;
      dot.style.height = `${d.s}px`;
      dot.style.setProperty('--dx', `${d.dx}px`);
      dot.style.setProperty('--dy', `${d.dy}px`);
      dot.style.animationDelay = `${idx * 24}ms`;
      fxLayer.appendChild(dot);
      trackFxTimer(() => {
        if (dot.parentNode) dot.remove();
      }, 720);
    });
  }

  function spawnToySparkles(cx, cy, symbols = ['✨', '⭐', '🌟', '💫', '🎉', '✨']) {
    const fxLayer = document.getElementById('fxLayer');
    if (!fxLayer) return;
    const offsets = [
      { dx: -46, dy: -42 },
      { dx: 0,   dy: -58 },
      { dx: 48,  dy: -40 },
      { dx: -34, dy: -16 },
      { dx: 36,  dy: -18 },
      { dx: 4,   dy: -36 }
    ];
    offsets.forEach((o, idx) => {
      const sp = document.createElement('div');
      sp.className = 'toy-sparkle';
      sp.textContent = symbols[idx % symbols.length];
      sp.style.left = `${cx}px`;
      sp.style.top = `${cy}px`;
      sp.style.setProperty('--dx', `${o.dx}px`);
      sp.style.setProperty('--dy', `${o.dy}px`);
      sp.style.animationDelay = `${idx * 35}ms`;
      fxLayer.appendChild(sp);
      trackFxTimer(() => {
        if (sp.parentNode) sp.remove();
      }, 860);
    });
  }

  function clearMudOverlay(itemId, removeNode = true) {
    const entry = mudTimers.get(itemId);
    if (entry) {
      if (entry.fadeTimer) clearTimeout(entry.fadeTimer);
      if (entry.removeTimer) clearTimeout(entry.removeTimer);
      if (removeNode && entry.overlayEl && entry.overlayEl.parentNode) {
        entry.overlayEl.remove();
      }
      mudTimers.delete(itemId);
    }
  }

  function applyMudOverlay(item, el) {
    if (!item || !el) return;
    clearMudOverlay(item.id, true);
    const host = el.querySelector('.meadow-sprite-wrap') || el._innerEl || el;
    const existing = host.querySelector('.muddy-splatter');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.className = 'muddy-splatter';
    overlay.setAttribute('aria-hidden', 'true');
    overlay.innerHTML = `
      <svg viewBox="0 0 80 80" fill="none">
        <ellipse cx="29" cy="54" rx="5.5" ry="3.8" transform="rotate(-14 29 54)" fill="#7A4924" opacity="0.88"/>
        <circle cx="48" cy="58" r="4.2" fill="#8D5524" opacity="0.85"/>
        <ellipse cx="42" cy="46" rx="3.4" ry="2.4" transform="rotate(18 42 46)" fill="#6B3F1D" opacity="0.82"/>
        <circle cx="54" cy="47" r="2.6" fill="#8D5524" opacity="0.8"/>
        <circle cx="24" cy="46" r="2.4" fill="#6B3F1D" opacity="0.78"/>
      </svg>
    `;
    host.appendChild(overlay);

    const entry = { overlayEl: overlay, fadeTimer: null, removeTimer: null };
    entry.fadeTimer = setTimeout(() => {
      if (overlay) overlay.classList.add('fading');
      entry.removeTimer = setTimeout(() => {
        if (overlay && overlay.parentNode) overlay.remove();
        mudTimers.delete(item.id);
      }, 650);
    }, 5800);
    mudTimers.set(item.id, entry);
  }

  function findDropTarget(clientX, clientY) {
    if (HMC.state && HMC.state.mode && HMC.state.mode !== 'classic') return null;
    if (typeof clientX !== 'number' || typeof clientY !== 'number') return null;

    let bestId = null;
    let bestDist = Infinity;

    for (let i = 0; i < TOYS.length; i++) {
      const toy = TOYS[i];
      const el = document.getElementById(toy.elId);
      if (!el || typeof el.getBoundingClientRect !== 'function') continue;
      const r = el.getBoundingClientRect();
      if (!r || r.width <= 0 || r.height <= 0) continue;

      if (
        clientX >= r.left - DROP_PAD_PX &&
        clientX <= r.right + DROP_PAD_PX &&
        clientY >= r.top - DROP_PAD_PX &&
        clientY <= r.bottom + DROP_PAD_PX
      ) {
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        const d = Math.hypot(clientX - cx, clientY - cy);
        if (d < bestDist) {
          bestDist = d;
          bestId = toy.id;
        }
      }
    }
    return bestId;
  }

  function setDragHighlights(active, hoveredId = null) {
    TOYS.forEach(toy => {
      const el = document.getElementById(toy.elId);
      if (!el) return;
      const isHot = !!active && hoveredId === toy.id;
      el.classList.toggle('drop-ready', !!active);
      el.classList.toggle('drop-hot', isHot);

      const hintEl = el.querySelector('.toy-drop-hint');
      if (hintEl) {
        if (isHot) {
          hintEl.textContent = toy.hint;
          hintEl.classList.add('visible');
        } else {
          hintEl.classList.remove('visible');
        }
      }
    });
  }

  function getToyObstacleRects() {
    const shellRect = getShellRect();
    const w = shellRect.width > 0 ? shellRect.width : 1;
    const h = shellRect.height > 0 ? shellRect.height : 1;
    const pad = 16;
    const rects = [];

    TOYS.forEach(toy => {
      const el = document.getElementById(toy.elId);
      if (!el || typeof el.getBoundingClientRect !== 'function') return;
      const r = el.getBoundingClientRect();
      if (!r || r.width <= 0 || r.height <= 0) return;
      rects.push({
        id: toy.id,
        leftPct: ((r.left - pad - shellRect.left) / w) * 100,
        rightPct: ((r.right + pad - shellRect.left) / w) * 100,
        topPct: ((r.top - pad - shellRect.top) / h) * 100,
        bottomPct: ((r.bottom + pad - shellRect.top) / h) * 100
      });
    });
    return rects;
  }

  function getToyInviteSpot(toyId) {
    const bounds = getBounds();
    const { shellRect } = bounds;
    const el = getToyEl(toyId);
    const r = el && typeof el.getBoundingClientRect === 'function' ? el.getBoundingClientRect() : null;

    if (r && r.width > 0 && r.height > 0) {
      if (toyId === 'puddle') {
        return clampToBounds(clientToPct(r.left + r.width * 0.52, r.top + r.height * 0.42, shellRect), bounds);
      }
      if (toyId === 'slide') {
        return clampToBounds(clientToPct(r.left + r.width * 0.65, r.top + r.height * 0.85, shellRect), bounds);
      }
      if (toyId === 'trampoline') {
        return clampToBounds(clientToPct(r.left + r.width * 0.52, r.top + r.height * 0.55, shellRect), bounds);
      }
    }

    if (toyId === 'puddle') return clampToBounds({ xPct: 20, yPct: 80 }, bounds);
    if (toyId === 'slide') return clampToBounds({ xPct: 82, yPct: 44 }, bounds);
    return clampToBounds({ xPct: 18, yPct: 52 }, bounds);
  }

  function createRun(item, el, toyId) {
    cancelItemRun(item.id);

    const run = {
      itemId: item.id,
      item,
      el,
      toyId,
      timers: new Set(),
      rafId: null,
      cancelled: false
    };

    item.playingToy = toyId;
    item.visitingPuddle = false;
    item.invitedToy = null;
    item.targetX = null;
    item.targetY = null;

    if (el) {
      el.classList.add('is-playing-toy');
      if (el._waddleEl) el._waddleEl.classList.remove('waddling');
    }

    activeRuns.set(item.id, run);
    return run;
  }

  function runTimer(run, fn, ms) {
    const id = setTimeout(() => {
      run.timers.delete(id);
      if (run.cancelled) return;
      fn();
    }, ms);
    run.timers.add(id);
    return id;
  }

  function finishRun(run, onDone) {
    if (!run || run.cancelled) return;
    run.cancelled = true;
    run.timers.forEach(id => clearTimeout(id));
    run.timers.clear();
    if (run.rafId !== null && typeof cancelAnimationFrame === 'function') {
      cancelAnimationFrame(run.rafId);
      run.rafId = null;
    }
    if (activeRuns.get(run.itemId) === run) {
      activeRuns.delete(run.itemId);
    }

    const { item, el } = run;
    if (item) {
      item.playingToy = null;
      item.invitedToy = null;
      item.targetX = null;
      item.targetY = null;
      item.pauseUntil = nowMs() + 900;
    }
    if (el) {
      el.classList.remove('is-playing-toy');
      if (el._innerEl) el._innerEl.style.transform = '';
      if (item && typeof item.yPct === 'number') {
        el.style.zIndex = String(Math.max(15, Math.round(item.yPct * 10)));
      }
    }

    if (typeof onDone === 'function') {
      onDone();
    }
  }

  function cancelItemRun(itemId) {
    const run = activeRuns.get(itemId);
    if (!run) return;
    run.cancelled = true;
    run.timers.forEach(id => clearTimeout(id));
    run.timers.clear();
    if (run.rafId !== null && typeof cancelAnimationFrame === 'function') {
      cancelAnimationFrame(run.rafId);
      run.rafId = null;
    }
    activeRuns.delete(itemId);

    if (run.item) {
      run.item.playingToy = null;
      run.item.invitedToy = null;
    }
    if (run.el) {
      run.el.classList.remove('is-playing-toy');
      if (run.el._innerEl) run.el._innerEl.style.transform = '';
      if (run.item && typeof run.item.yPct === 'number') {
        run.el.style.zIndex = String(Math.max(15, Math.round(run.item.yPct * 10)));
      }
    }
  }

  function renderToyHammerSVG(size = 76) {

        <g transform="translate(44 36) rotate(-32)">

          <path d="M-2 17 V45" stroke="#FFE2A8" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

  function playHammerStrikeAt(clientX, clientY) {
    const fxLayer = document.getElementById('fxLayer');
    if (!fxLayer) return null;
    const x = typeof clientX === 'number' ? clientX : (window.innerWidth || 390) * 0.5;
    const y = typeof clientY === 'number' ? clientY : (window.innerHeight || 844) * 0.5;

    const fx = document.createElement('div');
    fx.className = 'hammer-strike-fx';
    fx.setAttribute('aria-hidden', 'true');
    fx.style.left = `${x}px`;
    fx.style.top = `${y}px`;
    fx.innerHTML = renderToyHammerSVG(76);
    fxLayer.appendChild(fx);

    trackFxTimer(() => {
      spawnToySparkles(x, y - 14, ['⭐', '✨', '💥', '🌟', '💫', '✨']);
    }, 150);

    trackFxTimer(() => {
      if (fx.parentNode) fx.remove();
    }, 460);

    return fx;
  }

  function cancelAllAnimations() {
    Array.from(activeRuns.keys()).forEach(id => cancelItemRun(id));
    Array.from(mudTimers.keys()).forEach(id => clearMudOverlay(id, true));
    fxTimers.forEach(id => clearTimeout(id));
    fxTimers.clear();
    const fxLayer = document.getElementById('fxLayer');
    if (fxLayer && typeof fxLayer.querySelectorAll === 'function') {
      fxLayer.querySelectorAll('.hammer-strike-fx').forEach(n => n.remove());
    }
    setDragHighlights(false, null);
  }

  function setItemPos(item, el, xPct, yPct) {
    item.xPct = xPct;
    item.yPct = yPct;
    if (el) {
      el.style.left = `${xPct.toFixed(2)}%`;
      el.style.top = `${yPct.toFixed(2)}%`;
    }
  }

  /* ==========================================================================
     1. Muddy Puddle Jump Routine (~1.7s)
     ========================================================================== */
  function playPuddleJump(item, el, onDone = null) {
    const node = el || (item && getItemNode(item.id));
    if (!item || !node) {
      if (typeof onDone === 'function') onDone();
      return false;
    }

    const run = createRun(item, node, 'puddle');
    const bounds = getBounds();
    const { shellRect } = bounds;
    const puddleEl = getToyEl('puddle');
    const pr = puddleEl && typeof puddleEl.getBoundingClientRect === 'function'
      ? puddleEl.getBoundingClientRect()
      : null;

    let centerSpot;
    let landingSpot;
    let splashClientX;
    let splashClientY;

    if (pr && pr.width > 0 && pr.height > 0) {
      centerSpot = clientToPct(pr.left + pr.width * 0.50, pr.top + pr.height * 0.44, shellRect);
      landingSpot = clampToBounds(clientToPct(pr.right + 28, pr.top + pr.height * 0.15, shellRect), bounds);
      splashClientX = pr.left + pr.width * 0.50;
      splashClientY = pr.top + pr.height * 0.35;
    } else {
      centerSpot = { xPct: 20, yPct: 80 };
      landingSpot = clampToBounds({ xPct: 34, yPct: 76 }, bounds);
      const pt = pctToClient(centerSpot.xPct, centerSpot.yPct, shellRect);
      splashClientX = pt.x;
      splashClientY = pt.y;
    }

    setItemPos(item, node, centerSpot.xPct, centerSpot.yPct);

    const doJump = (withSplashSound) => {
      triggerHop(node);
      triggerPuddleSplash();
      spawnMudDroplets(splashClientX, splashClientY);
      if (withSplashSound && HMC.audio && HMC.audio.SFX) {
        HMC.audio.SFX.splash();
      }
    };

    // Jump 1
    doJump(true);

    runTimer(run, () => {
      if (HMC.effects) {
        HMC.effects.spawnFloatingWord('咕叽咕叽！真好玩！💦', splashClientX, splashClientY - 26, '#8D5524');
      }
      if (HMC.audio) {
        if (typeof HMC.audio.setPrompt === 'function') {
          HMC.audio.setPrompt('哈哈！小鸡跳进大泥坑啦，咕叽咕叽！', 'Haha! Splashing in the big muddy puddle!');
        } else if (typeof HMC.audio.speak === 'function') {
          HMC.audio.speak('哈哈！小鸡跳进大泥坑啦，咕叽咕叽！', 'Haha! Splashing in the big muddy puddle!');
        }
      }
    }, 100);

    // Jump 2 + cute mud splatter freckles
    runTimer(run, () => {
      doJump(true);
      applyMudOverlay(item, node);
    }, 480);

    // Jump 3 + cheerful cheep
    runTimer(run, () => {
      doJump(false);
      if (HMC.audio && HMC.audio.SFX) HMC.audio.SFX.cheep();
    }, 980);

    // Soft hop back onto grass & resume walking
    runTimer(run, () => {
      setItemPos(item, node, landingSpot.xPct, landingSpot.yPct);
      triggerHop(node);
      if (HMC.audio && HMC.audio.SFX) HMC.audio.SFX.pop();
      finishRun(run, onDone);
    }, 1660);

    return true;
  }

  /* ==========================================================================
     2. Rainbow Slide Ride Routine (~1.9s)
     ========================================================================== */
  function playSlideRide(item, el, onDone = null) {
    const node = el || (item && getItemNode(item.id));
    if (!item || !node) {
      if (typeof onDone === 'function') onDone();
      return false;
    }

    const run = createRun(item, node, 'slide');
    const bounds = getBounds();
    const { shellRect } = bounds;
    const slideEl = getToyEl('slide');
    const sr = slideEl && typeof slideEl.getBoundingClientRect === 'function'
      ? slideEl.getBoundingClientRect()
      : null;

    let p0, p1, p2, pLand;
    let topClientX, topClientY;

    if (sr && sr.width > 0 && sr.height > 0) {
      p0 = clientToPct(sr.left + sr.width * 0.72, sr.top + sr.height * 0.25, shellRect);
      p1 = clientToPct(sr.left + sr.width * 0.44, sr.top + sr.height * 0.66, shellRect);
      p2 = clientToPct(sr.left + sr.width * 0.14, sr.top + sr.height * 0.86, shellRect);
      pLand = clampToBounds(clientToPct(sr.left - sr.width * 0.12, sr.top + sr.height * 0.96, shellRect), bounds);
      topClientX = sr.left + sr.width * 0.62;
      topClientY = sr.top - 10;
    } else {
      p0 = { xPct: 86, yPct: 36 };
      p1 = { xPct: 79, yPct: 44 };
      p2 = { xPct: 71, yPct: 49 };
      pLand = clampToBounds({ xPct: 65, yPct: 52 }, bounds);
      const pt = pctToClient(p0.xPct, p0.yPct, shellRect);
      topClientX = pt.x;
      topClientY = pt.y - 16;
    }

    // Step 1: Hop cleanly to the top lookout platform
    item.facingRight = false;
    if (node._facingEl) node._facingEl.classList.remove('flip');
    setItemPos(item, node, p0.xPct, p0.yPct);
    triggerHop(node);
    triggerSlideCheer();
    if (HMC.audio && HMC.audio.SFX) HMC.audio.SFX.pop();
    if (HMC.effects) {
      HMC.effects.spawnFloatingWord('爬上滑滑梯！', topClientX, topClientY, '#FF922B');
    }

    let landed = false;
    const triggerLanding = () => {
      if (landed || run.cancelled) return;
      landed = true;
      if (run.rafId !== null && typeof cancelAnimationFrame === 'function') {
        cancelAnimationFrame(run.rafId);
        run.rafId = null;
      }
      if (node._innerEl) node._innerEl.style.transform = '';
      setItemPos(item, node, pLand.xPct, pLand.yPct);
      triggerHop(node);
      if (HMC.audio && HMC.audio.SFX) HMC.audio.SFX.cheep();

      const landPt = pctToClient(pLand.xPct, pLand.yPct, shellRect);
      spawnToySparkles(landPt.x, landPt.y - 16, ['⭐', '✨', '🌈', '🌟', '💫', '✨']);
      if (HMC.effects) {
